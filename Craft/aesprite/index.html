<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AeCraft</title>
  <!-- AeCraft's icon, copied from assets/app-icon/aecraft/ under these plain names. -->
  
  
  <link rel="icon" type="image/png" sizes="32x32" href="./aecraft-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./aecraft-512.png" />
  <link rel="apple-touch-icon" href="./aecraft-512.png" />
  
<script type="module">
import init, * as bindings from './photocraft-web-b30413450d781f08.js';
const wasm = await init({ module_or_path: './photocraft-web-9bae744e48a2e197_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
<link rel="modulepreload" href="./photocraft-web-b30413450d781f08.js" crossorigin="anonymous"><link rel="modulepreload" href="./eframe-d31a8450ea12dfc1-inline0.js" crossorigin="anonymous"><link rel="preload" href="./photocraft-web-9bae744e48a2e197_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <p>Loading AeCraft&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If AeCraft doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
