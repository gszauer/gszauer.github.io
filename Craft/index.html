<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craft Apps</title>
<link rel="icon" type="image/png" href="icons/photocraft.png">
<style>
  :root {
    --bg: #f3f2ee;
    --bg-glow: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --tile-hover: rgba(0, 0, 0, 0.045);
    --ring: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --bg-glow: #232328;
      --text: #f2f2f4;
      --muted: #98989f;
      --tile-hover: rgba(255, 255, 255, 0.06);
      --ring: #6b9bff;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .apps {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 800px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 3vw, 28px);
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 14px 6px 12px;
    border-radius: 18px;
    color: inherit;
    text-decoration: none;
    outline: none;
    transition: background-color 0.15s;
  }
  .app img {
    width: clamp(72px, 20vw, 120px);
    height: auto;
    aspect-ratio: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.18));
    transition: transform 0.18s cubic-bezier(0.3, 0.7, 0.4, 1.5);
  }
  .app .name { font-weight: 600; font-size: 15px; }
  .app .kind { color: var(--muted); font-size: 13px; text-align: center; }

  .app:hover { background: var(--tile-hover); }
  .app:hover img { transform: translateY(-3px) scale(1.05); }
  .app:active img { transform: scale(0.95); transition-duration: 0.06s; }
  .app:focus-visible { box-shadow: 0 0 0 3px var(--ring); }

  @media (max-width: 640px) {
    .apps { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 420px) {
    .app .name { font-size: 13px; }
    .app .kind { font-size: 11.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .app img { transition: none; }
    .app:hover img { transform: none; }
  }
</style>
</head>
<body>
  <ul class="apps">
    <li><a class="app" href="photocraft/index.html" target="_blank" rel="noopener">
      <img src="icons/photocraft.png" alt=""><span class="name">PhotoCraft</span><span class="kind">Photo editing</span></a></li>
    <li><a class="app" href="vectorcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/vectorcraft.png" alt=""><span class="name">VectorCraft</span><span class="kind">Vector illustration</span></a></li>
    <li><a class="app" href="designcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/designcraft.png" alt=""><span class="name">DesignCraft</span><span class="kind">Page layout</span></a></li>
    <li><a class="app" href="wordcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/wordcraft.png" alt=""><span class="name">WordCraft</span><span class="kind">Word processing</span></a></li>
    <li><a class="app" href="gridcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/gridcraft.png" alt=""><span class="name">GridCraft</span><span class="kind">Spreadsheets</span></a></li>
    <li><a class="app" href="deckcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/deckcraft.png" alt=""><span class="name">DeckCraft</span><span class="kind">Presentations</span></a></li>
    <li><a class="app" href="pdfcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/pdfcraft.png" alt=""><span class="name">PdfCraft</span><span class="kind">PDF documents</span></a></li>
    <li><a class="app" href="filmcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/filmcraft.png" alt=""><span class="name">FilmCraft</span><span class="kind">Video editing</span></a></li>
    <li><a class="app" href="soundcraft/index.html" target="_blank" rel="noopener">
      <img src="icons/soundcraft.png" alt=""><span class="name">SoundCraft</span><span class="kind">Audio workstation</span></a></li>
    <li><a class="app" href="miscraft/index.html" target="_blank" rel="noopener">
      <img src="icons/miscraft.png" alt=""><span class="name">MisCraft</span><span class="kind">Sketching</span></a></li>
  </ul>
</body>
</html>
