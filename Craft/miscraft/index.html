<body>
  <canvas id="miscraft_canvas"></canvas>
  <div id="miscraft_loading">
    <img id="miscraft_icon" src="apple-touch-icon.png" alt="" onerror="this.remove()">
    <p>Loading MisCraft&hellip;</p>
    <p id="miscraft_status">Downloading</p>
    <p id="miscraft_hint"></p>
    <div id="miscraft_errors"></div>
  </div>
  <script>
    // Startup diagnostics: until the app runs, show where loading got to and anything that went
    // wrong, so a phone without developer tools still says why it's stuck.
    (function () {
      var box = document.getElementById('miscraft_loading');
      var status = document.getElementById('miscraft_status');
      var hint = document.getElementById('miscraft_hint');
      var errors = document.getElementById('miscraft_errors');
      var loading = function () { return document.body.contains(box); };
      window.miscraftStatus = function (msg) { if (loading()) status.textContent = msg; };
      // A page cached from an older build points at files that no longer exist (every build
      // renames them): reload once, past the cache, before reporting it.
      var stale = /failed to fetch Wasm|Importing a module script failed|Failed to fetch dynamically imported module|404/i;
      var report = function (msg) {
        if (!loading()) return;
        if (stale.test(String(msg))) {
          var tried = false;
          try { tried = sessionStorage.getItem('miscraft-fresh') === '1'; sessionStorage.setItem('miscraft-fresh', '1'); } catch (_) {}
          if (!tried) {
            var q = location.search.replace(/[?&]fresh=\d+/, '').replace(/^&/, '?');
            location.replace(location.pathname + q + (q ? '&' : '?') + 'fresh=' + Date.now());
            return;
          }
        }
        errors.textContent += (errors.textContent ? '\n' : '') + String(msg).slice(0, 2000);
      };
      window.miscraftReport = report;
      // trunk replaces its <link data-trunk> tags when it builds the app; if one is still here,
      // this is the source template, which has no app in it.
      if (document.querySelector('link[data-trunk]')) {
        status.textContent = 'This is the source page of the web app, not the built app.';
        hint.innerHTML = 'Build it with <code>trunk build --release</code> in <code>apps/miscraft-web</code>, then open ' +
          '<a href="../../dist/web/">dist/web/</a> (or run <code>trunk serve --release --address 0.0.0.0</code> there).';
        return;
      }
      if (typeof WebAssembly !== 'object') {
        status.textContent = 'This browser has WebAssembly turned off, so MisCraft can’t run.';
        hint.innerHTML = 'On iPhone and iPad this happens in Lockdown Mode: turn it off for this site in ' +
          'Settings › Privacy &amp; Security › Lockdown Mode › Configure Web Browsing.';
        return;
      }
      window.addEventListener('error', function (e) { report((e.message || 'error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { report('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      var consoleError = console.error;
      console.error = function () {
        try { report(Array.prototype.map.call(arguments, String).join(' ')); } catch (_) {}
        return consoleError.apply(console, arguments);
      };
      window.addEventListener('TrunkApplicationStarted', function () {
        window.miscraftStatus('Starting');
        try { sessionStorage.removeItem('miscraft-fresh'); } catch (_) {}
      });
      setTimeout(function () {
        if (!loading()) return;
        var webgl = /[?&]webgl/.test(location.search);
        hint.innerHTML = 'This is taking longer than it should. <a href="">Reload</a>' +
          (webgl ? '' : ', or <a href="?webgl">use WebGL instead of WebGPU</a>') + '.';
      }, 20000);
    })();
  </script>
