<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win98 Shell - Gabor Szauer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Basic Reset & Body Styling */
        :root {
            --bg-color: #008080;
            --taskbar-bg: #c0c0c0;
            --window-bg: #c0c0c0;
            --window-titlebar-bg: #000080;
            --window-titlebar-inactive-bg: #808080;
            --window-titlebar-text: white;
            --button-bg: #c0c0c0;
            --button-text: black;
            --button-border-light: #ffffff;
            --button-border-dark: #000000;
            --button-border-shadow: #808080;
            --taskbar-button-active-bg: #a0a0a0;
            --text-color: black;
            --icon-label-color: white;
            --icon-label-shadow: 1px 1px 1px black;
            --folder-icon-label-color: black;
            --folder-icon-label-shadow: none;
            --folder-content-bg: white;
            --disabled-bg: #c0c0c0;
            --disabled-text: #555555;
            --inset-border-dark: #000000;
            --inset-border-light: #808080;
            --start-menu-sidebar-bg: #808080;
            --start-menu-sidebar-text: #c0c0c0;
            --start-menu-hover-bg: #000080;
            --start-menu-hover-text: white;
            --content-bg: white; /* Default content area background */
            --content-text: black; /* Default content area text color */
            --info-window-content-bg: #c0c0c0; /* Specific for InfoWindow light theme */
            --info-window-content-text: black; /* Specific for InfoWindow light theme */
            --iframe-container-bg: white;
            --theme-icon-fill: black;
            --user-header-image-border: #808080;
            --user-header-image-shadow: #000000;
            --user-header-image-highlight: #ffffff;
            --desktop-qrcode-border: #808080; /* For light theme */
        }

        body.dark-theme {
            --bg-color: #1e272e;
            --taskbar-bg: #404040;
            --window-bg: #3b3b3b;
            --window-titlebar-bg: var(--start-menu-sidebar-bg);
            --window-titlebar-inactive-bg: #536d81;
            --window-titlebar-text: #ecf0f1;
            --button-bg: #555555;
            --button-text: #ecf0f1;
            --button-border-light: #777777;
            --button-border-dark: #222222;
            --button-border-shadow: #333333;
            --taskbar-button-active-bg: #444444;
            --text-color: #ecf0f1;
            --icon-label-color: #ecf0f1;
            --icon-label-shadow: 1px 1px 1px #1e272e;
            --folder-icon-label-color: #ecf0f1;
            --folder-icon-label-shadow: none;
            --folder-content-bg: #4a4a4a;
            --disabled-bg: #555555;
            --disabled-text: #aaaaaa;
            --inset-border-dark: #222222;
            --inset-border-light: #555555;
            --start-menu-sidebar-bg: #2c3e50;
            --start-menu-sidebar-text: #bdc3c7;
            --start-menu-hover-bg: #3498db;
            --start-menu-hover-text: white;
            --content-bg: #4a4a4a;
            --content-text: #dadada;
            --info-window-content-bg: #3b3b3b; /* InfoWindow dark theme matches window */
            --info-window-content-text: #dadada; /* InfoWindow dark theme matches window */
            --iframe-container-bg: #333;
            --theme-icon-fill: #ecf0f1;
            --user-header-image-border: #555555;
            --user-header-image-shadow: #222222;
            --user-header-image-highlight: #777777;
            --desktop-qrcode-border: #555555; /* For dark theme */
        }


        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: "Tahoma", "Geneva", sans-serif; font-size: 11px;
            user-select: none; background-color: var(--bg-color); color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Desktop Area */
        #desktop {
            position: absolute; top: 0; left: 0; right: 0; bottom: 30px;
            padding: 10px; overflow-y: auto; display: flex; flex-direction: column;
            flex-wrap: wrap; align-content: flex-start; gap: 5px;
        }

        /* QR Code on Desktop */
        #desktop-qrcode {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 60px;
            height: 60px;
            border: 2px solid var(--desktop-qrcode-border);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            z-index: 1;
            transition: border-color 0.3s;
        }


        /* Icons */
        .icon {
            display: flex; flex-direction: column; align-items: center;
            width: 75px; height: 75px; padding: 5px; text-align: center;
            cursor: pointer; border: 1px solid transparent;
            z-index: 2;
            position: relative;
        }
        .icon:hover { background-color: rgba(0, 80, 160, 0.2); border: 1px dotted #0050a0; }
        .icon.selected { background-color: rgba(0, 80, 160, 0.4); border: 1px dotted #003080; }
        .icon .icon-image { font-size: 32px; display: block; margin-bottom: 5px; }
        .icon .icon-label {
            color: var(--icon-label-color); text-shadow: var(--icon-label-shadow);
            word-wrap: break-word; max-height: 3.6em; overflow: hidden;
            transition: color 0.3s;
        }

        /* Taskbar */
        #taskbar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 30px;
            background-color: var(--taskbar-bg);
            border-top: 1px solid var(--button-border-light);
            box-shadow: inset 0 1px 0 var(--button-border-light);
            display: flex; align-items: center; padding: 0 2px; z-index: 10000;
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Start Button */
        #start-button {
            background-color: var(--button-bg); color: var(--button-text);
            border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 1px 1px 0 var(--button-border-shadow);
            padding: 3px 8px; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; margin-right: 5px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        body.dark-theme #start-button {
            background-color: var(--button-bg);
        }
        #start-button.active,
        #start-button:active {
            border: 1px solid var(--button-border-dark); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light);
            box-shadow: inset 1px 1px 0 var(--button-border-shadow); padding: 4px 7px 2px 9px;
        }
        body.dark-theme #start-button.active,
        body.dark-theme #start-button:active {
             background-color: color-mix(in srgb, var(--button-bg) 80%, black);
        }
        #start-button .start-icon {
            font-size: 14px; margin-right: 6px; line-height: 1;
            width: 16px; text-align: center;
        }

        /* Taskbar Items Area */
        #taskbar-items { flex-grow: 1; display: flex; align-items: center; height: 100%; overflow: hidden; gap: 2px; }
        .taskbar-button {
            background-color: var(--button-bg); color: var(--button-text);
            border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 1px 1px 0 var(--button-border-shadow);
            padding: 3px 6px; height: 22px;
            min-width: 60px;
            max-width: 130px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer;
            font-size: 11px; text-align: left;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .taskbar-button.active {
             border: 1px solid var(--button-border-dark); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light);
             box-shadow: inset 1px 1px 0 var(--button-border-shadow); background-color: var(--taskbar-button-active-bg);
             padding: 4px 5px 2px 7px;
        }
        .taskbar-button:active:not(.active) {
             border: 1px solid var(--button-border-dark); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light);
             box-shadow: inset 1px 1px 0 var(--button-border-shadow); padding: 4px 5px 2px 7px;
        }

        /* Theme Switcher Button */
        #theme-switcher {
            background-color: var(--button-bg);
            border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 1px 1px 0 var(--button-border-shadow);
            padding: 0; height: 22px; width: 28px; margin-left: 5px;
            cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            border-radius: 0;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        #theme-switcher i {
            font-size: 14px; color: var(--theme-icon-fill); transition: color 0.3s;
        }
        #theme-switcher:active {
            border: 1px solid var(--button-border-dark); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light);
            box-shadow: inset 1px 1px 0 var(--button-border-shadow);
        }

        /* Clock */
        #clock {
            background-color: var(--taskbar-bg); color: var(--text-color);
            border: 1px solid var(--inset-border-light); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light);
            box-shadow: inset 1px 1px 0 var(--inset-border-dark);
            padding: 3px 6px; margin-left: 5px; font-size: 11px; min-width: 50px; text-align: center;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }


        /* Start Menu */
        #start-menu {
            position: absolute; bottom: 30px; left: 0;
            background-color: var(--window-bg);
            border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 2px 2px 3px rgba(0,0,0,0.4);
            padding: 2px; z-index: 9999; transition: background-color 0.3s, border-color 0.3s;
            display: flex;
        }

        /* Start Menu User Header */
        #start-menu-user-header {
            display: flex; padding: 5px; border-bottom: 1px solid var(--inset-border-light);
            margin-bottom: 2px; gap: 8px; align-items: center; flex-shrink: 0;
        }
        #user-header-image-container {
            padding: 2px; border: 1px solid var(--user-header-image-border);
            box-shadow: inset 1px 1px 2px var(--user-header-image-shadow), inset -1px -1px 0px var(--user-header-image-highlight);
            flex-shrink: 0; transition: border-color 0.3s, box-shadow 0.3s;
            background-color: var(--window-bg);
        }
        #user-header-image {
            width: 50px; height: 50px; object-fit: cover; display: block;
        }
        #user-header-buttons {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px;
        }
        .user-header-button {
            background-color: var(--button-bg); color: var(--button-text);
            border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 1px 1px 0 var(--button-border-shadow);
            width: 24px; height: 24px; padding: 0;
            font-size: 12px; text-align: center; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .user-header-button i { line-height: 1; }
        .user-header-button:active {
            border: 1px solid var(--button-border-dark); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light);
            box-shadow: inset 1px 1px 0 var(--button-border-shadow);
        }

        #start-menu-sidebar {
            background-color: var(--start-menu-sidebar-bg); width: 25px;
            display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;
            transition: background-color 0.3s; flex-shrink: 0;
        }
         #start-menu-sidebar span {
            writing-mode: vertical-lr; transform: rotate(180deg); font-size: 18px; font-weight: bold; color: var(--start-menu-sidebar-text);
            text-shadow: 1px 1px 1px black; white-space: nowrap; padding-left: 2px; transition: color 0.3s;
         }

        #start-menu-right-panel {
            display: flex; flex-direction: column; flex-grow: 1;
            background-color: var(--window-bg); transition: background-color 0.3s;
            min-width: 145px;
        }

        #start-menu-items {
            flex-grow: 1;
        }
        .start-menu-item {
            display: flex; align-items: center; padding: 4px 10px; cursor: pointer;
            white-space: nowrap; justify-content: space-between; color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        .start-menu-item:hover { background-color: var(--start-menu-hover-bg); color: var(--start-menu-hover-text); }
        .start-menu-item .item-content { display: flex; align-items: center; flex-grow: 1; overflow: hidden; }
        .start-menu-item .icon-image { font-size: 16px; margin-right: 8px; width: 20px; text-align: center; flex-shrink: 0; }
        .start-menu-item .item-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .start-menu-item .submenu-arrow { font-size: 10px; margin-left: 10px; flex-shrink: 0; }

        #global-submenu-container {
            position: fixed; top: 0; left: 0; width: 0; height: 0;
            z-index: 10002; pointer-events: none;
        }
        #global-submenu-container > .start-menu-submenu {
            pointer-events: auto;
        }

        .start-menu-submenu {
            display: none; position: fixed; min-width: 150px;
            background-color: var(--window-bg);
            border: 1px solid var(--button-border-light);
            border-right-color: var(--button-border-dark);
            border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 2px 2px 3px rgba(0,0,0,0.4);
            padding: 2px;
            transition: background-color 0.3s, border-color 0.3s;
            max-height: 200px; overflow-y: auto; overflow-x: hidden;
        }

        .submenu-item {
            display: flex; align-items: center; padding: 4px 10px; cursor: pointer;
            white-space: nowrap; color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        .submenu-item:hover { background-color: var(--start-menu-hover-bg); color: var(--start-menu-hover-text); }
        .submenu-item .icon-image { font-size: 16px; margin-right: 8px; width: 20px; text-align: center; flex-shrink: 0; }

        .start-menu-separator { height: 1px; background-color: var(--inset-border-light); border-bottom: 1px solid var(--button-border-light); margin: 2px 0; transition: background-color 0.3s, border-color 0.3s; }

        /* Window Styling */
        .window {
            position: absolute; background-color: var(--window-bg);
            border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 2px 2px 3px rgba(0,0,0,0.4);
            min-width: 200px; min-height: 150px; display: flex; flex-direction: column; overflow: hidden;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .window.minimized { display: none; }
        .window.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: calc(100% - 30px) !important; border: none; box-shadow: none; }

        .window-titlebar {
            background-color: var(--window-titlebar-bg); color: var(--window-titlebar-text);
            padding: 3px 5px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center; cursor: grab; height: 18px; flex-shrink: 0;
            transition: background-color 0.3s, color 0.3s;
            margin: 3px 3px 0 3px;
        }
        .window-titlebar.inactive { background-color: var(--window-titlebar-inactive-bg); }
         .window.maximized .window-titlebar { cursor: default; margin: 0; }
        .window-titlebar:active { cursor: grabbing; }
         .window.maximized .window-titlebar:active { cursor: default; }
        .window-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 5px; }
        .window-controls button {
            background-color: var(--button-bg); border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark);
            box-shadow: inset 1px 1px 0 var(--button-border-light), 1px 1px 0 var(--button-border-shadow);
            font-family: "Marlett", "Webdings"; font-size: 10px; width: 16px; height: 14px; line-height: 14px; padding: 0;
            margin-left: 2px; cursor: pointer; font-weight: bold; flex-shrink: 0; color: var(--button-text);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .window-controls button:active {
            border: 1px solid var(--button-border-dark); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light);
            box-shadow: inset 1px 1px 0 var(--button-border-shadow); padding: 1px 0 0 1px;
        }

        /* Browser Window URL Bar */
        .browser-url-bar { background-color: var(--window-bg); padding: 2px 3px; flex-shrink: 0; display: flex; align-items: center; gap: 3px; transition: background-color 0.3s; margin: 1px; }
        .browser-url-input { background-color: var(--disabled-bg); border: 1px solid var(--inset-border-light); box-shadow: inset 1px 1px 0 var(--inset-border-dark); padding: 2px 4px; flex-grow: 1; box-sizing: border-box; font-family: "Tahoma", "Geneva", sans-serif; font-size: 11px; color: var(--disabled-text); cursor: pointer; min-width: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        .browser-go-button { background-color: var(--button-bg); color: var(--button-text); border: 1px solid var(--button-border-light); border-right-color: var(--button-border-dark); border-bottom-color: var(--button-border-dark); box-shadow: inset 1px 1px 0 var(--button-border-light), 1px 1px 0 var(--button-border-shadow); padding: 1px 6px; font-size: 11px; font-weight: normal; cursor: pointer; flex-shrink: 0; height: 20px; transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s; }
        .browser-go-button:active { border: 1px solid var(--button-border-dark); border-right-color: var(--button-border-light); border-bottom-color: var(--button-border-light); box-shadow: inset 1px 1px 0 var(--button-border-shadow); padding: 2px 5px 0px 7px; }

        .window-content {
            flex-grow: 1; background-color: var(--content-bg); color: var(--content-text);
            margin: 0 2px 2px 2px;
            padding: 10px; overflow: auto; border: 1px solid var(--inset-border-light);
            box-shadow: inset 1px 1px 0 var(--inset-border-dark); min-height: 0;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        /* Specific styling for InfoWindow content area */
        .info-window-content {
            background-color: var(--info-window-content-bg);
            color: var(--info-window-content-text);
        }
        body:not(.dark-theme) .info-window-content h1,
        body:not(.dark-theme) .info-window-content p {
            color: black;
        }


         .window.maximized .window-content { margin: 0; border: none; box-shadow: none; }
        .iframe-content, .browser-content {
             padding: 0 !important; overflow: hidden !important; border: none !important; box-shadow: none !important;
             margin: 0 2px 2px 2px;
             border: 1px solid var(--inset-border-light); box-shadow: inset 1px 1px 0 var(--inset-border-dark);
             background-color: var(--iframe-container-bg); transition: background-color 0.3s, border-color 0.3s;
        }
         .window.maximized .iframe-content, .window.maximized .browser-content { margin: 0; border: none; box-shadow: none; }
        .window-content iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Folder Window Content */
        .folder-content {
            background-color: var(--folder-content-bg); display: flex; flex-wrap: wrap; align-content: flex-start;
        }
        .folder-content .icon .icon-label { color: var(--folder-icon-label-color); text-shadow: var(--folder-icon-label-shadow); font-size: 10px; transition: color 0.3s; }
         .folder-content .icon { width: 65px; height: 65px; margin: 3px; }
         .folder-content .icon .icon-image { font-size: 24px; }
         .folder-content .icon:hover { background-color: rgba(0, 80, 160, 0.2); border: 1px dotted #0050a0; }
         .folder-content .icon.selected { background-color: rgba(0, 80, 160, 0.4); border: 1px dotted #003080; }

        /* Window Resize Handle (No longer a visible element, cursor handled by .window) */

        /* Toast Notification */
        #toast-notification {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7); color: white; padding: 8px 15px;
            border-radius: 4px; font-size: 12px; z-index: 11000; opacity: 0;
            transition: opacity 0.3s ease-in-out; pointer-events: none;
        }
        #toast-notification.show { opacity: 1; }

        /* Mobile Font Size Adjustments */
        @media (max-width: 768px) {
            body, html {
                font-size: 13px;
            }
            .taskbar-button {
                min-width: 40px;
                padding: 3px 4px;
            }
            #start-button .start-icon {
                margin-right: 3px;
            }
            .user-header-button {
                width: 22px;
                height: 22px;
                font-size: 11px;
            }
            #user-header-image, #user-header-image-container {
                 width: 40px;
                 height: 40px;
            }
            .start-menu-item .icon-image, .submenu-item .icon-image {
                width: 18px;
                font-size: 14px;
            }
        }


    </style>
</head>
<body class="">
    <div id="desktop">
        <img id="desktop-qrcode" src="https://gaborszauer.com/img/contact.png" alt="Contact QR Code">
    </div>

    <div id="start-menu" style="display:none;">
        <div id="start-menu-sidebar"><span>Gabor Szauer</span></div>
        <div id="start-menu-right-panel">
            <div id="start-menu-user-header">
                <div id="user-header-image-container">
                    <img id="user-header-image" src="https://gaborszauer.com/img/gabor.png" alt="Gabor Szauer">
                </div>
                <div id="user-header-buttons">
                    <a href="https://github.com/gszauer" target="_blank" class="user-header-button" title="GitHub"><i class="fab fa-github"></i></a>
                    <a href="https://bsky.app/profile/gszauer.bsky.social" target="_blank" class="user-header-button" title="Bluesky"><i class="fab fa-twitter"></i></a>
                    <a href="https://gabormakesgames.com" target="_blank" class="user-header-button" title="Blog"><i class="fab fa-wordpress"></i></a>

        // --- Window Subclasses ---

        }

        // --- Window Resizing ---
        function startResize(event, windowInstance, direction, isTouchEvent = false) {
            event.stopPropagation();
            resizeInfo.isResizing = true; resizeInfo.targetWindow = windowInstance; resizeInfo.direction = direction; resizeInfo.isTouchEvent = isTouchEvent;
            const clientX = isTouchEvent ? event.touches[0].clientX : event.clientX;
            const clientY = isTouchEvent ? event.touches[0].clientY : event.clientY;
            resizeInfo.startX = clientX; resizeInfo.startY = clientY;
            resizeInfo.startWidth = windowInstance.element.offsetWidth; resizeInfo.startHeight = windowInstance.element.offsetHeight;
            resizeInfo.startLeft = windowInstance.element.offsetLeft; resizeInfo.startTop = windowInstance.element.offsetTop;
            document.body.style.cursor = `${direction}-resize`; document.body.style.userSelect = 'none';
             if (isTouchEvent) {
                event.preventDefault();
                document.addEventListener('touchmove', handleResize, { passive: false });
                document.addEventListener('touchend', stopResize);
            } else {
                document.addEventListener('mousemove', handleResize);
                document.addEventListener('mouseup', stopResize);
            }
        }
        function handleResize(event) {
            if (!resizeInfo.isResizing || !resizeInfo.targetWindow) return;
            if (resizeInfo.isTouchEvent) event.preventDefault();
            const win = resizeInfo.targetWindow;
            const clientX = resizeInfo.isTouchEvent ? event.touches[0].clientX : event.clientX;
            const clientY = resizeInfo.isTouchEvent ? event.touches[0].clientY : event.clientY;
            let newX = resizeInfo.startLeft; let newY = resizeInfo.startTop;
            let newWidth = resizeInfo.startWidth; let newHeight = resizeInfo.startHeight;
            const dx = clientX - resizeInfo.startX; const dy = clientY - resizeInfo.startY;
            if (resizeInfo.direction.includes('e')) newWidth = resizeInfo.startWidth + dx;
            if (resizeInfo.direction.includes('s')) newHeight = resizeInfo.startHeight + dy;
            if (resizeInfo.direction.includes('w')) { newWidth = resizeInfo.startWidth - dx; newX = resizeInfo.startLeft + dx; }
            if (resizeInfo.direction.includes('n')) { newHeight = resizeInfo.startHeight - dy; newY = resizeInfo.startTop + dy; }
            if (newWidth < win.minWidth) { if (resizeInfo.direction.includes('w')) newX = resizeInfo.startLeft + (resizeInfo.startWidth - win.minWidth); newWidth = win.minWidth; }
            if (newHeight < win.minHeight) { if (resizeInfo.direction.includes('n')) newY = resizeInfo.startTop + (resizeInfo.startHeight - win.minHeight); newHeight = win.minHeight; }
            win.element.style.left = `${newX}px`; win.element.style.top = `${newY}px`;
            win.element.style.width = `${newWidth}px`; win.element.style.height = `${newHeight}px`;
            win.x = newX; win.y = newY; win.width = newWidth; win.height = newHeight;
            win.originalState = { x: newX, y: newY, width: newWidth, height: newHeight };
        }
        function stopResize() {
            if (resizeInfo.isResizing) {
                document.body.style.cursor = ''; document.body.style.userSelect = '';
                if (resizeInfo.isTouchEvent) {
                    document.removeEventListener('touchmove', handleResize);
                    document.removeEventListener('touchend', stopResize);
                } else {
                    document.removeEventListener('mousemove', handleResize);
                    document.removeEventListener('mouseup', stopResize);
                }
                if(resizeInfo.targetWindow) resizeInfo.targetWindow.element.style.cursor = 'default';
                resizeInfo.isResizing = false; resizeInfo.targetWindow = null; resizeInfo.isTouchEvent = false;
            }
        }

        // --- Initialization ---
        function renderDesktopIcons() {
            // Remove only existing icons before re-rendering
            const existingIcons = desktopElement.querySelectorAll('.icon');
            existingIcons.forEach(icon => icon.remove());

            const desktopFolder = getPathObject('C:/Desktop');
            if (desktopFolder && desktopFolder.children) {
                for (const name in desktopFolder.children) {
                    const item = desktopFolder.children[name];
                    const iconElement = createIconElement(name, item, 'desktop', desktopElement);
                    desktopElement.appendChild(iconElement);
                }
            } else {
                console.error("Could not find C:/Desktop in fileSystem");
            }
        }
        function populateStartMenu() {
            startMenuItemsContainer.innerHTML = '';

            const createSubMenuItem = (name, itemData) => {
                const subItem = document.createElement('div');
                subItem.className = 'submenu-item';
                subItem.title = name;
                const img = document.createElement('span');
                img.className = 'icon-image';
                img.textContent = itemData.icon || '❓';
                const label = document.createElement('span');
                label.textContent = name;
                subItem.appendChild(img); subItem.appendChild(label);
                subItem.onclick = (e) => { e.stopPropagation(); handleItemOpen(name, itemData); hideStartMenu(); };
                return subItem;
            };

            const createMenuItemWithSubmenu = (name, icon, contentSourcePath) => {
                const menuItem = document.createElement('div');
                menuItem.className = 'start-menu-item';
                menuItem.title = name;

                const contentDiv = document.createElement('div'); contentDiv.className = 'item-content';
                const img = document.createElement('span'); img.className = 'icon-image'; img.textContent = icon;
                const label = document.createElement('span'); label.className = 'item-label'; label.textContent = name;
                contentDiv.appendChild(img); contentDiv.appendChild(label); menuItem.appendChild(contentDiv);

                const arrow = document.createElement('span'); arrow.className = 'submenu-arrow'; arrow.textContent = '▶';
                menuItem.appendChild(arrow);

                const submenuElement = document.createElement('div');
                submenuElement.className = 'start-menu-submenu';
                const folderData = getPathObject(contentSourcePath);
                if (folderData && folderData.children) {
                    for (const itemName in folderData.children) {
                        submenuElement.appendChild(createSubMenuItem(itemName, folderData.children[itemName]));
                    }
                } else {
                    const noItems = document.createElement('div'); noItems.className = 'submenu-item'; noItems.textContent = '(Empty)';
                    noItems.style.fontStyle = 'italic'; noItems.style.color = 'var(--disabled-text)';
                    submenuElement.appendChild(noItems);
                }
                menuItem.submenuElement = submenuElement;

                menuItem.addEventListener('mouseenter', () => {
                    if (submenuHideTimeout) clearTimeout(submenuHideTimeout);
                    showSubmenuFor(menuItem, submenuElement);
                });
                menuItem.addEventListener('mouseleave', () => {
                    submenuHideTimeout = setTimeout(hideActiveSubmenu, 200);
                });

                return menuItem;
            };

            const addSeparator = () => {
                 const separator = document.createElement('div'); separator.className = 'start-menu-separator'; startMenuItemsContainer.appendChild(separator);
            };

            const startMenuRoot = getPathObject('C:/Start Menu');
            if (startMenuRoot && startMenuRoot.children && startMenuRoot.children['About']) {
                const aboutData = startMenuRoot.children['About'];
                const aboutItem = document.createElement('div');
                aboutItem.className = 'start-menu-item';
                aboutItem.title = 'About';
                const contentDiv = document.createElement('div'); contentDiv.className = 'item-content';
                const img = document.createElement('span'); img.className = 'icon-image'; img.textContent = aboutData.icon || '❓';
                const label = document.createElement('span'); label.className = 'item-label'; label.textContent = 'About';
                contentDiv.appendChild(img); contentDiv.appendChild(label); aboutItem.appendChild(contentDiv);
                aboutItem.onclick = () => handleItemOpen('About', aboutData);
                startMenuItemsContainer.appendChild(aboutItem);
            }


            startMenuItemsContainer.appendChild(createMenuItemWithSubmenu('Games', '🎮', 'C:/Games'));
            startMenuItemsContainer.appendChild(createMenuItemWithSubmenu('Apps', '📱', 'C:/Apps'));
            startMenuItemsContainer.appendChild(createMenuItemWithSubmenu('Books', '📚', 'C:/Books'));
            addSeparator();


            if (startMenuRoot && startMenuRoot.children && startMenuRoot.children['Shutdown']) {
                const shutdownData = startMenuRoot.children['Shutdown'];
                const shutdownItem = document.createElement('div'); shutdownItem.className = 'start-menu-item'; shutdownItem.title = 'Shutdown';
                const contentDiv = document.createElement('div'); contentDiv.className = 'item-content';
                const img = document.createElement('span'); img.className = 'icon-image'; img.textContent = shutdownData.icon || '❓';
                const label = document.createElement('span'); label.className = 'item-label'; label.textContent = 'Shutdown';
                contentDiv.appendChild(img); contentDiv.appendChild(label); shutdownItem.appendChild(contentDiv);
                shutdownItem.onclick = () => handleItemOpen('Shutdown', shutdownData);
                startMenuItemsContainer.appendChild(shutdownItem);
            } else {
                console.error("Shutdown item or C:/Start Menu not found in fileSystem");
            }
        }

        function repositionWindowsOnResize() {
            const taskbarHeight = document.getElementById('taskbar').offsetHeight;
            const desktopWidth = document.documentElement.clientWidth;
            const desktopHeight = document.documentElement.clientHeight - taskbarHeight;

            for (const id in openWindows) {
                const winInstance = openWindows[id];
                if (winInstance.isMaximized || winInstance.isMinimized || !winInstance.element) continue;

                let currentX = winInstance.element.offsetLeft;
                let currentY = winInstance.element.offsetTop;
                const currentWidth = winInstance.element.offsetWidth;
                const currentHeight = winInstance.element.offsetHeight;

                let needsUpdate = false;

                if (currentX + currentWidth > desktopWidth) {
                    currentX = Math.max(0, desktopWidth - currentWidth);
                    needsUpdate = true;
                }
                if (currentX < 0) {
                    currentX = 0;
                    needsUpdate = true;
                }
                if (currentY + currentHeight > desktopHeight) {
                    currentY = Math.max(0, desktopHeight - currentHeight);
                    needsUpdate = true;
                }
                if (currentY < 0) {
                    currentY = 0;
                    needsUpdate = true;
                }

                if (needsUpdate) {
                    winInstance.x = currentX;
                    winInstance.y = currentY;
                    winInstance.element.style.left = `${currentX}px`;
                    winInstance.element.style.top = `${currentY}px`;
                    winInstance.originalState.x = currentX;
                    winInstance.originalState.y = currentY;
                }
            }
        }


        // --- Initial Setup ---
        const savedTheme = localStorage.getItem('win98theme') || 'light'; applyTheme(savedTheme);
        renderDesktopIcons(); startButton.addEventListener('click', toggleStartMenu); themeSwitcherElement.addEventListener('click', toggleTheme);
        updateClock(); setInterval(updateClock, 1000);
        document.addEventListener('dragstart', (e) => e.preventDefault());
        desktopElement.addEventListener('click', (e) => { if (e.target === desktopElement) clearSelection(desktopElement); });
        window.addEventListener('resize', repositionWindowsOnResize);

    </script>
</body>
