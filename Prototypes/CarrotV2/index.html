<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrot Code</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212;
            font-family: "Segoe UI", sans-serif;
            color: #e4e4e4;
        }

        body {
            display: flex;
            align-items: stretch;
            justify-content: stretch;

            /* Disable selection of html elements */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #carrot-canvas {
            flex: 1;
            width: 100vw;
            height: 100vh;
            display: block;
            background: #1e1e1e;
            outline: none;
            image-rendering: pixelated;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-dialog {
            min-width: min(480px, 90vw);
            max-width: 640px;
            background: #232323;
            border: 1px solid #3d3d3d;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .modal-dialog h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.25rem;
            color: #f0f0f0;
        }

        .modal-dialog p {
            margin: 0 0 16px 0;
            line-height: 1.5;
        }

        .modal-dialog textarea,
        .modal-dialog input[type="text"] {
            width: 100%;
            margin: 12px 0 16px 0;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            background: #151515;
            color: #f5f5f5;
            font-size: 0.95rem;
            resize: vertical;
            /* Allow text selection and input in modal fields */
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .modal-dialog textarea {
            min-height: 140px;
            max-height: 320px;
        }

        .modal-dialog .button-row {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-dialog button {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            background: #2e2e2e;
            color: #f0f0f0;
            transition: background 0.2s ease;
        }

        .modal-dialog button.primary {
            background: #7a3a6e;
        }

        .modal-dialog button:hover {
            background: #3a3a3a;
        }

        .modal-dialog button.primary:hover {
            background: #8a437c;
        }

        .helper-text {
            font-size: 0.85rem;
            color: #9d9d9d;
        }

        .shutdown-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            z-index: 2000;
        }

        .shutdown-container.hidden {
            display: none;
        }

        .shutdown-content {
            text-align: center;
            color: #e4e4e4;
        }

        .shutdown-content h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0 0 1rem 0;
            color: #f0f0f0;
        }

        .shutdown-content p {
            font-size: 1.2rem;
            margin: 0;
            color: #9d9d9d;
        }

        /* Drag and drop visual feedback */
        body.drag-over::after {
            content: 'Drop file to open';
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(122, 58, 110, 0.9);
            color: #f0f0f0;
            font-size: 2rem;
            font-weight: 300;
            z-index: 1500;
            pointer-events: none;
            border: 4px dashed rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            margin: 20px;
        }
    </style>
</head>
<body>
<canvas id="carrot-canvas" tabindex="0"></canvas>

<div id="copy-modal" class="modal hidden">
    <div class="modal-dialog">
        <h2>Copy To Clipboard</h2>
        <textarea id="copy-modal-text"></textarea>
        <p class="helper-text">Use the copy button or select the text and press Ctrl+C / Command+C.</p>
        <div class="button-row">
            <button id="copy-modal-close">Close</button>
            <button id="copy-modal-copy" class="primary">Copy</button>
        </div>
    </div>
</div>

<div id="paste-modal" class="modal hidden">
    <div class="modal-dialog">
        <h2>Paste From Clipboard</h2>
        <textarea id="paste-modal-text" placeholder="Paste text here (Ctrl+V / Command+V)"></textarea>
        <div class="button-row">
            <button id="paste-modal-cancel">Cancel</button>
            <button id="paste-modal-submit" class="primary">Paste</button>
        </div>
    </div>
</div>

<div id="yesno-modal" class="modal hidden">
    <div class="modal-dialog">
        <h2>Confirm</h2>
        <p id="yesno-modal-message"></p>
        <div class="button-row">
            <button id="yesno-modal-no">No</button>
            <button id="yesno-modal-yes" class="primary">Yes</button>
        </div>
    </div>
</div>

<div id="save-modal" class="modal hidden">
    <div class="modal-dialog">
        <h2>Save File As</h2>
        <input type="text" id="save-modal-name" placeholder="document.txt" autocomplete="off">
        <div class="button-row">
            <button id="save-modal-cancel">Cancel</button>
            <button id="save-modal-save" class="primary">Save</button>
        </div>
    </div>
</div>

<input id="file-input" type="file" style="display:none" />

<div id="shutdown-message" class="shutdown-container hidden">
    <div class="shutdown-content">
        <h1>Carrot Code Closed</h1>
        <p>Refresh page to re-launch</p>
    </div>
</div>

<script src="emscripten.js"></script>
<script src="carrotcode.js"></script>
</body>
</html>
