<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser Grid Card Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
        }
        #game-container {
            border: 2px solid #34495e;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
        const GRID_SIZE = 8;
        const TILE_SIZE = 60;
        const CARD_SIZE = 50;
        const ANIMATION_DURATION = 300;

        // Base Card class
        class Card extends Phaser.GameObjects.Container {
            constructor(scene, x, y, type) {
                super(scene, x, y);
                this.type = type;
                this.gridX = 0;
                this.gridY = 0;
                
                // Card background
                this.background = scene.add.graphics();
                this.add(this.background);
                
                scene.add.existing(this);
            }
            
            setGridPosition(gridX, gridY) {
                this.gridX = gridX;
                this.gridY = gridY;
            }
            
            animateMoveTo(x, y, duration = ANIMATION_DURATION, onComplete = null) {
                this.scene.tweens.add({
                    targets: this,
                    x: x,
                    y: y,
                    duration: duration,
                    ease: 'Power2',
                    onComplete: onComplete
                });
            }
            
            fadeIn(delay = 100) {
                this.setAlpha(0);
                this.scene.tweens.add({
                    targets: this,
                    alpha: 1,
                    duration: 200,
                    delay: delay
                });
            }
        }

        // Player Card
        class PlayerCard extends Card {
            constructor(scene, x, y) {
                super(scene, x, y, 'hero');
                
                // Blue card with circle
                this.background.fillStyle(0x3498db, 1);
                this.background.fillRoundedRect(-CARD_SIZE/2, -CARD_SIZE/2, CARD_SIZE, CARD_SIZE, 8);
                
                const heroGraphics = scene.add.graphics();
                heroGraphics.fillStyle(0xffffff, 1);
                heroGraphics.fillCircle(0, 0, 15);
                this.add(heroGraphics);
            }
        }

        // Dirt Card
        class DirtCard extends Card {
            constructor(scene, x, y) {
                super(scene, x, y, 'dirt');
                
                // Brown card with rectangle
                this.background.fillStyle(0x8b4513, 1);
                this.background.fillRoundedRect(-CARD_SIZE/2, -CARD_SIZE/2, CARD_SIZE, CARD_SIZE, 8);
                
                const dirtGraphics = scene.add.graphics();
                dirtGraphics.fillStyle(0x654321, 1);
                dirtGraphics.fillRect(-10, -10, 20, 20);
                this.add(dirtGraphics);
            }
        }

        // Coin Card (Treasure)
        class CoinCard extends Card {
            constructor(scene, x, y) {
                super(scene, x, y, 'treasure');
                
                // Gold card with star
                this.background.fillStyle(0xf39c12, 1);
                this.background.fillRoundedRect(-CARD_SIZE/2, -CARD_SIZE/2, CARD_SIZE, CARD_SIZE, 8);
                
                const treasureGraphics = scene.add.graphics();
                treasureGraphics.fillStyle(0xffffff, 1);
                this.drawStar(treasureGraphics, 0, 0, 5, 15, 7);
                this.add(treasureGraphics);
            }
            
            drawStar(graphics, cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let x = cx;
                let y = cy;
                const step = Math.PI / spikes;

                graphics.beginPath();
                graphics.moveTo(cx, cy - outerRadius);
                
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    graphics.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    graphics.lineTo(x, y);
                    rot += step;
                }
                
                graphics.lineTo(cx, cy - outerRadius);
                graphics.closePath();
                graphics.fill();
            }
        }

        // Game Grid
        class GameGrid extends Phaser.GameObjects.Container {
            constructor(scene, x, y) {
                super(scene, x, y);
                this.scene = scene;
                this.grid = [];
                this.cards = [];
                this.disabledTiles = new Set();
                this.playerCard = null;
                
                this.setupDisabledTiles();
                this.createGrid();
                
                scene.add.existing(this);
            }
            
            setupDisabledTiles() {
                const disabledPattern = [
                    { x: 2, y: 0 }, { x: 5, y: 0 },
                    { x: 0, y: 2 }, { x: 7, y: 2 },
                    { x: 3, y: 3 }, { x: 4, y: 3 },
                    { x: 3, y: 4 }, { x: 4, y: 4 },
                    { x: 0, y: 5 }, { x: 7, y: 5 },
                    { x: 2, y: 7 }, { x: 5, y: 7 }
                ];
                
                disabledPattern.forEach(pos => {
                    this.disabledTiles.add(`${pos.x},${pos.y}`);
                });
            }
            
            createGrid() {
                const graphics = this.scene.add.graphics();
                this.add(graphics);
                
                for (let y = 0; y < GRID_SIZE; y++) {
                    this.grid[y] = [];
                    for (let x = 0; x < GRID_SIZE; x++) {
                        const tileX = x * TILE_SIZE + TILE_SIZE / 2;
                        const tileY = y * TILE_SIZE + TILE_SIZE / 2;
                        
                        if (this.disabledTiles.has(`${x},${y}`)) {
                            graphics.fillStyle(0x1a1a1a, 1);
                            graphics.fillRect(
                                tileX - TILE_SIZE / 2,
                                tileY - TILE_SIZE / 2,
                                TILE_SIZE,
                                TILE_SIZE
                            );
                        } else {
                            graphics.fillStyle(0x404040, 1);
                            graphics.fillRect(
                                tileX - TILE_SIZE / 2,
                                tileY - TILE_SIZE / 2,
                                TILE_SIZE,
                                TILE_SIZE
                            );
                            
                            graphics.lineStyle(2, 0x606060, 1);
                            graphics.strokeRect(
                                tileX - TILE_SIZE / 2,
                                tileY - TILE_SIZE / 2,
                                TILE_SIZE,
                                TILE_SIZE
                            );
                        }
                        
                        this.grid[y][x] = {
                            x: tileX,
                            y: tileY,
                            disabled: this.disabledTiles.has(`${x},${y}`),
                            card: null
                        };
                    }
                }
            }
            
            initializeCards() {
                // Clear existing cards
                this.cards.forEach(card => card.destroy());
                this.cards = [];
                
                // Find valid starting position for player
                let validPositions = [];
                for (let y = 1; y < GRID_SIZE - 1; y++) {
                    for (let x = 1; x < GRID_SIZE - 1; x++) {
                        if (!this.grid[y][x].disabled) {
                            validPositions.push({ x, y });
                        }
                    }
                }
                
                // Place player at random valid position
                const playerPos = Phaser.Math.RND.pick(validPositions);
                this.playerCard = this.createCard(playerPos.x, playerPos.y, 'hero');
                
                // Fill remaining tiles
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (!this.grid[y][x].disabled && !this.grid[y][x].card) {
                            const cardType = Math.random() < 0.3 ? 'treasure' : 'dirt';
                            this.createCard(x, y, cardType);
                        }
                    }
                }
                
                this.bringToTop(this.playerCard);
                return playerPos;
            }
            
            createCard(gridX, gridY, type) {
                const tile = this.grid[gridY][gridX];
                let card;
                
                switch(type) {
                    case 'hero':
                        card = new PlayerCard(this.scene, tile.x, tile.y);
                        break;
                    case 'treasure':
                        card = new CoinCard(this.scene, tile.x, tile.y);
                        break;
                    case 'dirt':
                        card = new DirtCard(this.scene, tile.x, tile.y);
                        break;
                }
                
                card.setGridPosition(gridX, gridY);
                this.add(card);
                this.cards.push(card);
                tile.card = card;
                
                return card;
            }
            
            canMove(fromX, fromY, dx, dy) {
                const newX = fromX + dx;
                const newY = fromY + dy;
                
                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                    return false;
                }
                
                return !this.grid[newY][newX].disabled;
            }
            
            getCardsInLine(startX, startY, dx, dy) {
                const cards = [];
                let x = startX;
                let y = startY;
                
                // First, collect the hero card
                if (this.grid[y][x].card && this.grid[y][x].card.type === 'hero') {
                    cards.push(this.grid[y][x].card);
                }
                
                // Then collect trailing cards until we hit a disabled tile or edge
                x -= dx;
                y -= dy;
                
                while (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                    if (this.grid[y][x].disabled) {
                        break;
                    }
                    
                    if (this.grid[y][x].card) {
                        cards.push(this.grid[y][x].card);
                    }
                    
                    x -= dx;
                    y -= dy;
                }
                
                return cards;
            }
            
            moveCards(cards, dx, dy, onComplete) {
                let completed = 0;

                
                cards.forEach((card) => {
                    const newGridX = card.gridX + dx;
                    const newGridY = card.gridY + dy;
                    const newTile = this.grid[newGridY][newGridX];
                    
                    // Update grid references
                    this.grid[card.gridY][card.gridX].card = null;
                    this.grid[newGridY][newGridX].card = card;
                    card.setGridPosition(newGridX, newGridY);
                    
                    // Animate
                    card.animateMoveTo(newTile.x, newTile.y, ANIMATION_DURATION, () => {
                        completed++;
                        if (completed === cards.length && onComplete) {
                            onComplete();
                        }
                    });
                });
            }
            
            collectCardsAt(x, y) {
                const collectedCards = [];
                const heroTile = this.grid[y][x];
                
                const cardsAtPos = this.cards.filter(card => 
                    card.gridX === x && 
                    card.gridY === y &&
                    card.type !== 'hero'
                );
                
                cardsAtPos.forEach(card => {
                    if (card.type === 'treasure' || card.type === 'dirt') {
                        collectedCards.push(card);
                        card.destroy();
                        const index = this.cards.indexOf(card);
                        this.cards.splice(index, 1);
                    }
                });
                
                // Ensure hero card is properly set in the tile
                heroTile.card = this.playerCard;
                
                this.bringToTop(this.playerCard);
                return collectedCards;
            }
            
            fillEmptyTiles() {
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (!this.grid[y][x].disabled && !this.grid[y][x].card) {
                            const cardType = Math.random() < 0.3 ? 'treasure' : 'dirt';
                            const newCard = this.createCard(x, y, cardType);
                            newCard.fadeIn();
                        }
                    }
                }
            }
            
            getPlayerPosition() {
                return { x: this.playerCard.gridX, y: this.playerCard.gridY };
            }
        }

        // Game UI
        class GameUI extends Phaser.GameObjects.Container {
            constructor(scene, x, y) {
                super(scene, x, y);
                this.scene = scene;
                this.score = 0;
                
                this.createUI();
                scene.add.existing(this);
            }
            
            createUI() {
                // Score text
                this.scoreText = this.scene.add.text(10, GRID_SIZE * TILE_SIZE + 10, `Score: ${this.score}`, {
                    fontSize: '24px',
                    color: '#ffffff'
                });
                this.add(this.scoreText);
                
                // Restart button
                const buttonX = GRID_SIZE * TILE_SIZE - 80;
                const buttonY = GRID_SIZE * TILE_SIZE + 10;
                
                this.restartButton = this.scene.add.rectangle(buttonX, buttonY + 15, 150, 40, 0x27ae60);
                this.restartButton.setInteractive({ useHandCursor: true });
                
                this.restartText = this.scene.add.text(buttonX, buttonY + 15, 'Restart', {
                    fontSize: '20px',
                    color: '#ffffff'
                }).setOrigin(0.5);
                
                this.add([this.restartButton, this.restartText]);
                
                // Button interactions
                this.restartButton.on('pointerover', () => this.restartButton.setFillStyle(0x2ecc71));
                this.restartButton.on('pointerout', () => this.restartButton.setFillStyle(0x27ae60));
                this.restartButton.on('pointerdown', () => this.scene.scene.restart());
            }
            
            updateScore(points) {
                this.score += points;
                this.scoreText.setText(`Score: ${this.score}`);
            }
            
            getScore() {
                return this.score;
            }
        }

        // Main Game Scene
        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
                this.gameGrid = null;
                this.gameUI = null;
                this.isAnimating = false;
                this.dragStartPos = null;
                this.dragVisuals = null;
            }
            
            create() {
                // Create game components
                this.gameGrid = new GameGrid(this, 0, 0);
                this.gameUI = new GameUI(this, 0, 0);
                
                // Initialize the game
                const playerPos = this.gameGrid.initializeCards();
                
                // Set up input handling
                this.setupInput();
                
                // Create drag visualization
                this.createDragVisualization();
            }
            
            createDragVisualization() {
                this.dragVisuals = {
                    line: this.add.graphics().setDepth(1000),
                    arrow: this.add.graphics().setDepth(1001),
                    text: this.add.text(0, 0, '', {
                        fontSize: '16px',
                        color: '#00ff00',
                        backgroundColor: '#000000',
                        padding: { x: 4, y: 2 }
                    }).setDepth(1002).setVisible(false)
                };
            }
            
            setupInput() {
                // Mouse/touch input
                this.input.on('pointerdown', this.handlePointerDown, this);
                this.input.on('pointerup', this.handlePointerUp, this);
                this.input.on('pointerupoutside', this.handlePointerUp, this);
                this.input.on('pointermove', this.handlePointerMove, this);
                this.input.on('pointerout', this.handlePointerOut, this);
                
                // Keyboard input
                this.input.keyboard.on('keydown-UP', () => this.tryMove('up'));
                this.input.keyboard.on('keydown-DOWN', () => this.tryMove('down'));
                this.input.keyboard.on('keydown-LEFT', () => this.tryMove('left'));
                this.input.keyboard.on('keydown-RIGHT', () => this.tryMove('right'));
                this.input.keyboard.on('keydown-W', () => this.tryMove('up'));
                this.input.keyboard.on('keydown-S', () => this.tryMove('down'));
                this.input.keyboard.on('keydown-A', () => this.tryMove('left'));
                this.input.keyboard.on('keydown-D', () => this.tryMove('right'));
            }
            
            handlePointerDown(pointer) {
                if (!this.isAnimating) {
                    this.dragStartPos = { x: pointer.x, y: pointer.y };
                    this.clearDragVisuals();
                    this.input.setDefaultCursor('grabbing');
                }
            }
            
            handlePointerUp(pointer) {
                if (this.dragStartPos && !this.isAnimating) {
                    const dx = pointer.x - this.dragStartPos.x;
                    const dy = pointer.y - this.dragStartPos.y;
                    const threshold = 20;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance > threshold) {
                        let direction = null;
                        
                        if (Math.abs(dx) > Math.abs(dy)) {
                            direction = dx > 0 ? 'right' : 'left';
                        } else {
                            direction = dy > 0 ? 'down' : 'up';
                        }
                        
                        this.tryMove(direction);
                    }
                    
                    this.dragStartPos = null;
                    this.clearDragVisuals();
                    this.input.setDefaultCursor('default');
                }
            }
            
            handlePointerMove(pointer) {
                if (this.dragStartPos && !this.isAnimating) {
                    const dx = pointer.x - this.dragStartPos.x;
                    const dy = pointer.y - this.dragStartPos.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    this.updateDragVisuals(pointer, dx, dy, distance);
                }
            }
            
            handlePointerOut() {
                if (!this.dragStartPos) {
                    this.clearDragVisuals();
                }
            }
            
            updateDragVisuals(pointer, dx, dy, distance) {
                const { line, arrow, text } = this.dragVisuals;
                
                // Clear previous visuals
                line.clear();
                arrow.clear();
                
                // Draw line
                line.lineStyle(3, 0xffffff, 0.5);
                line.beginPath();
                line.moveTo(this.dragStartPos.x, this.dragStartPos.y);
                line.lineTo(pointer.x, pointer.y);
                line.closePath();
                line.strokePath();
                
                if (distance > 20) {
                    let direction = '';
                    let arrowX = this.dragStartPos.x;
                    let arrowY = this.dragStartPos.y;
                    
                    if (Math.abs(dx) > Math.abs(dy)) {
                        direction = dx > 0 ? 'RIGHT' : 'LEFT';
                        arrowX += dx > 0 ? 50 : -50;
                    } else {
                        direction = dy > 0 ? 'DOWN' : 'UP';
                        arrowY += dy > 0 ? 50 : -50;
                    }
                    
                    arrow.fillStyle(0x00ff00, 0.8);
                    this.drawArrow(arrow, this.dragStartPos.x, this.dragStartPos.y, arrowX, arrowY);
                    
                    text.setText(direction);
                    text.setPosition(pointer.x + 10, pointer.y - 20);
                    text.setVisible(true);
                } else {
                    arrow.fillStyle(0xff0000, 0.5);
                    arrow.fillCircle(pointer.x, pointer.y, 5);
                    text.setVisible(false);
                }
            }
            
            clearDragVisuals() {
                if (this.dragVisuals) {
                    this.dragVisuals.line.clear();
                    this.dragVisuals.arrow.clear();
                    this.dragVisuals.text.setVisible(false);
                }
            }
            
            drawArrow(graphics, fromX, fromY, toX, toY) {
                const angle = Math.atan2(toY - fromY, toX - fromX);
                const arrowLength = 20;
                const arrowAngle = Math.PI / 6;
                
                graphics.beginPath();
                graphics.moveTo(toX, toY);
                graphics.lineTo(
                    toX - arrowLength * Math.cos(angle - arrowAngle),
                    toY - arrowLength * Math.sin(angle - arrowAngle)
                );
                graphics.lineTo(
                    toX - arrowLength * Math.cos(angle + arrowAngle),
                    toY - arrowLength * Math.sin(angle + arrowAngle)
                );
                graphics.closePath();
                graphics.fillPath();
            }
            
            tryMove(direction) {
                if (this.isAnimating) return;
                
                const moves = {
                    'up': { dx: 0, dy: -1 },
                    'down': { dx: 0, dy: 1 },
                    'left': { dx: -1, dy: 0 },
                    'right': { dx: 1, dy: 0 }
                };
                
                const move = moves[direction];
                const playerPos = this.gameGrid.getPlayerPosition();
                
                if (!this.gameGrid.canMove(playerPos.x, playerPos.y, move.dx, move.dy)) {
                    return;
                }
                
                this.isAnimating = true;
                
                // Get cards that need to move
                const cardsToMove = this.gameGrid.getCardsInLine(
                    playerPos.x,
                    playerPos.y,
                    move.dx,
                    move.dy
                );
                
                // Animate movement
                this.gameGrid.moveCards(cardsToMove, move.dx, move.dy, () => {
                    // Check for collections
                    const newPlayerPos = this.gameGrid.getPlayerPosition();
                    const collected = this.gameGrid.collectCardsAt(newPlayerPos.x, newPlayerPos.y);
                    
                    // Update score for treasures
                    collected.forEach(card => {
                        if (card.type === 'treasure') {
                            this.gameUI.updateScore(10);
                        }
                    });
                    
                    // Fill empty tiles
                    this.gameGrid.fillEmptyTiles();
                    
                    this.isAnimating = false;
                });
            }
        }

        // Game configuration
        const config = {
            type: Phaser.AUTO,
            width: GRID_SIZE * TILE_SIZE,
            height: GRID_SIZE * TILE_SIZE + 60,
            parent: 'game-container',
            backgroundColor: '#2c3e50',
            scene: GameScene
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
