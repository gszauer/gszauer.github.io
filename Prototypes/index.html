<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabor Szauer - Prototypes</title>
    <link rel="stylesheet" href="desktopish/styles.css" />
  </head>
  <body>
    <div class="desktop">
      <div id="desktop-icons"></div>

      <div class="taskbar">
        <button class="start-button">
          <img
            src="desktopish/icons/gamepad.svg"
            alt="Start"
            width="16"
            height="16"
          />
          <span>Start</span>
        </button>
        <div class="separator"></div>
        <div id="taskbar-windows"></div>
        <div class="taskbar-right">
          <div class="separator"></div>
          <button class="dark-mode-toggle" id="darkModeToggle">
            <img src="desktopish/icons/sun.svg" alt="Toggle dark mode" />
          </button>
          <div class="clock" id="clock"></div>
        </div>
      </div>
    </div>

    <div id="start-menu" class="start-menu hidden">
      <div class="start-sidebar">
        <div class="sidebar-text">Prototypes</div>
      </div>
      <div class="start-items">
        <a
          href="https://github.com/gszauer/"
          target="_blank"
          rel="noopener noreferrer"
          class="menu-item"
        >
          <span class="menu-icon">🐙</span>
          <span class="menu-text">GitHub</span>
        </a>
        <a
          href="https://bsky.app/profile/gszauer.bsky.social"
          target="_blank"
          rel="noopener noreferrer"
          class="menu-item"
        >
          <span class="menu-icon">💬</span>
          <span class="menu-text">Bluesky</span>
        </a>
        <div class="menu-item" data-folder="games">
          <span class="menu-icon">🎮</span>
          <span class="menu-text">Games</span>
        </div>
        <div class="menu-item" data-folder="apps">
          <span class="menu-icon">📱</span>
          <span class="menu-text">Apps</span>
        </div>
        <div class="separator"></div>
        <div class="menu-item has-submenu">
          <span class="menu-icon">▶️</span>
          <span class="menu-text">Run...</span>
          <div class="submenu">
            <div class="menu-item" data-iframe="keyframe-studio">
              <span class="menu-icon">🎥</span>
              <span class="menu-text">Key Frame Studio</span>
            </div>
            <div class="menu-item" data-iframe="carrot-code">
              <span class="menu-icon">🥕</span>
              <span class="menu-text">Carrot.Code</span>
            </div>
            <div class="menu-item" data-iframe="boxelot">
              <span class="menu-icon">🎮</span>
              <span class="menu-text">Boxelot</span>
            </div>
          </div>
        </div>
        <div class="separator"></div>
        <a
          href="https://gabormakesgames.com"
          target="_blank"
          rel="noopener noreferrer"
          class="menu-item"
        >
          <span class="menu-icon">🚪</span>
          <span class="menu-text">Shut Down...</span>
        </a>
      </div>
    </div>

    <script src="desktopish/data.js"></script>
    <script src="desktopish/app.js"></script>
  </body>
</html>
