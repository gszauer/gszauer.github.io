<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototypes - Windows 98 Style</title>
  <link rel="stylesheet" href="desktopish/styles.css">
</head>
<body>
  <div class="desktop">
    <div id="desktop-icons"></div>
    
    <div class="taskbar">
      <button class="start-button">
        <img src="desktopish/icons/gamepad.svg" alt="Start" width="16" height="16">
        <span>Start</span>
      </button>
      <div class="separator"></div>
      <div id="taskbar-windows"></div>
      <div class="separator"></div>
      <div class="clock" id="clock"></div>
    </div>
  </div>

  <div id="start-menu" class="start-menu hidden">
    <div class="start-sidebar">
      <div class="sidebar-text">Prototypes</div>
    </div>
    <div class="start-items">
      <a href="https://github.com/gszauer/" target="_blank" rel="noopener noreferrer" class="menu-item">
        <img src="desktopish/icons/github.svg" alt="GitHub" width="16" height="16">
        <span>GitHub</span>
      </a>
      <a href="https://bsky.app/profile/gszauer.bsky.social" target="_blank" rel="noopener noreferrer" class="menu-item">
        <img src="desktopish/icons/message-circle.svg" alt="Bluesky" width="16" height="16">
        <span>Bluesky</span>
      </a>
      <div class="menu-item" data-folder="games">
        <img src="desktopish/icons/gamepad.svg" alt="Games" width="16" height="16">
        <span>Games</span>
      </div>
      <div class="menu-item" data-folder="apps">
        <img src="desktopish/icons/app-window.svg" alt="Apps" width="16" height="16">
        <span>Apps</span>
      </div>
      <div class="separator"></div>
      <a href="https://gabormakesgames.com" target="_blank" rel="noopener noreferrer" class="menu-item">
        <img src="desktopish/icons/power.svg" alt="Shut Down" width="16" height="16">
        <span>Shut Down...</span>
      </a>
    </div>
  </div>

  <script src="desktopish/data.js"></script>
  <script src="desktopish/app.js"></script>
</body>
</html>
