<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ChessMate - Chess Puzzle Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000000;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            height: 100vh;
            width: calc(100vh * (1400 / 2556));
            max-width: 100vw;
            background: #184c2f;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/PlayerData.js"></script>
    <script src="js/ChessPiece.js"></script>
    <script src="js/ChessBoard.js"></script>
    <script src="js/DebugWindow.js"></script>
    <script src="js/Preloader.js"></script>
    <script src="js/LevelSelect.js"></script>
    <script src="js/Gameplay.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script>
        const config = {
            type: Phaser.AUTO,
            parent: 'game',
            backgroundColor: '#184c2f',
            width: 1400,
            height: 2556,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            scene: [Preloader, LevelSelect, Gameplay]
        };

        const playerData = new PlayerData();
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
