<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxelot</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; margin: auto; }
    </style>
</head>
<body>
    <script src="phaser.3.80.1.min.js"></script>
    <!-- call npm run build to generate -->
    <script src="game.min.js"></script>

    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 600,
                height: 900
            },
            scene: [Game]
        };

        const game = new Phaser.Game(config);
        
        // Global error handling
        window.addEventListener('error', function(event) {
            console.error('JavaScript Error:', event.error);
            alert('JavaScript Error Detected!\n\nError: ' + event.error.message + '\nFile: ' + event.filename + '\nLine: ' + event.lineno + '\n\nCheck the console for details.');
        });
        
        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled Promise Rejection:', event.reason);
            alert('Promise Rejection Error!\n\nReason: ' + event.reason + '\n\nCheck the console for details.');
        });
    </script>
</body>
</html>
