<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxelot</title>
    <style>
        body { margin: 0; background-color: #111; height: 100vh; overflow: hidden; }
        canvas { display: block; width: 100vw !important; height: 100vh !important; }
    </style>
</head>
<body>
    <script src="phaser.3.80.1.min.js"></script>
    <!-- call npm run build to generate -->
    <script src="game.min.js"></script>

    <div id="game-container"></div>

    <script>
        window.addEventListener('error', function(event) {
            console.error('JavaScript Error:', event.error);
            alert('JavaScript Error Detected!\n\nError: ' + event.error.message + '\nFile: ' + event.filename + '\nLine: ' + event.lineno + '\n\nCheck the console for details.');
        });

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            scale: {
                mode: Phaser.Scale.RESIZE,
                width: window.innerWidth,
                height: window.innerHeight
            },
            scene: [Game]
        };

        const game = new Phaser.Game(config);
    </script>
</body>
</html>
