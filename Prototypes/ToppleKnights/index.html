<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Topple Knights</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    /* Nothing on the page can be selected, dragged or long-pressed for a
       menu (src/input/PageGuards.js cancels the events as well). */
    *, *::before, *::after {
      user-select: none; -webkit-user-select: none; -moz-user-select: none;
      -webkit-touch-callout: none; -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, canvas {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
    }
    html, body { position: fixed; inset: 0; background: #0b0d12; }
    canvas { display: block; position: absolute; inset: 0; }
  </style>
</head>
<body>
  <script src="game.js"></script>
</body>
</html>
