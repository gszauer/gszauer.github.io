// ---- TITLE SCENE ----
class TitleScene extends Phaser.Scene {
    constructor() {
        super('Title');
    }

    create() {
        // Background
        this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x0A0A1A);

        // Parallax wall layer — height proportional to canvas
        const wallGfx = this.add.graphics();
        const wallH = GAME_HEIGHT * 0.4;
        wallGfx.fillStyle(COLORS.WALL_STONE, 0.3);
        const wallTile = Math.max(16, sz(32));
        for (let i = 0; i < Math.ceil(GAME_WIDTH / wallTile) + 1; i++) {
            wallGfx.fillRect(i * wallTile, GAME_HEIGHT - wallH, wallTile, wallH);
            wallGfx.fillStyle(COLORS.WALL_STONE_DARK, 0.2);
            wallGfx.fillRect(i * wallTile, GAME_HEIGHT - wallH, wallTile, 2);
            wallGfx.fillRect(i * wallTile, GAME_HEIGHT - wallH + 16, wallTile, 1);
            wallGfx.fillStyle(COLORS.WALL_STONE, 0.3);
        }

        // Titan silhouettes — proportional to canvas height
        const silGfx = this.add.graphics();
        silGfx.fillStyle(0x1A1A2E, 0.8);
        const silH1 = GAME_HEIGHT * 0.45;
        silGfx.fillRect(GAME_WIDTH * 0.15, GAME_HEIGHT - silH1, sz(40), silH1 * 0.7);
        silGfx.fillCircle(GAME_WIDTH * 0.15 + sz(20), GAME_HEIGHT - silH1, sz(22));
        const silH2 = GAME_HEIGHT * 0.35;
        silGfx.fillRect(GAME_WIDTH * 0.65, GAME_HEIGHT - silH2, sz(35), silH2 * 0.7);
        silGfx.fillCircle(GAME_WIDTH * 0.65 + sz(17), GAME_HEIGHT - silH2, sz(18));
        const silH3 = GAME_HEIGHT * 0.55;
        silGfx.fillRect(GAME_WIDTH * 0.8, GAME_HEIGHT - silH3, sz(50), silH3 * 0.7);
        silGfx.fillCircle(GAME_WIDTH * 0.8 + sz(25), GAME_HEIGHT - silH3, sz(26));

        // Wings of Freedom emblem — proportional
        const emblemGfx = this.add.graphics();
        const ex = GAME_WIDTH / 2;
        const ey = GAME_HEIGHT * 0.25;
        const eS = Math.min(sz(1), GAME_HEIGHT / 300); // emblem scale
        const eW = 50 * eS, eH = 55 * eS;
        emblemGfx.fillStyle(COLORS.UI_BG, 0.8);
        emblemGfx.fillRoundedRect(ex - eW, ey - eH, eW * 2, eH * 2, 8 * eS);
        emblemGfx.lineStyle(2 * eS, COLORS.UI_BORDER);
        emblemGfx.strokeRoundedRect(ex - eW, ey - eH, eW * 2, eH * 2, 8 * eS);
        emblemGfx.fillStyle(0x4488CC);
        emblemGfx.fillTriangle(ex - 35 * eS, ey + 30 * eS, ex - 5 * eS, ey - 35 * eS, ex - 5 * eS, ey + 30 * eS);
        emblemGfx.fillStyle(0xDDDDDD);
        emblemGfx.fillTriangle(ex + 35 * eS, ey + 30 * eS, ex + 5 * eS, ey - 35 * eS, ex + 5 * eS, ey + 30 * eS);

        // Title
        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.47, 'ATTACK ON TITAN', {
            fontSize: fs(36), fontFamily: 'monospace', color: '#D4A44C',
            fontStyle: 'bold', stroke: '#000000', strokeThickness: sz(4),
        }).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.56, 'WINGS OF FREEDOM', {
            fontSize: fs(16), fontFamily: 'monospace', color: '#FFFFFF',
            stroke: '#000000', strokeThickness: sz(2),
        }).setOrigin(0.5);

        // Menu options
        this.menuItems = ['START GAME', 'CONTROLS'];
        this.selectedIndex = 0;
        this.menuTexts = [];

        const menuStartY = GAME_HEIGHT * 0.72;
        const menuGap = GAME_HEIGHT * 0.1;
        for (let i = 0; i < this.menuItems.length; i++) {
            const txt = this.add.text(GAME_WIDTH / 2, menuStartY + i * menuGap, this.menuItems[i], {
                fontSize: fs(14), fontFamily: 'monospace', color: i === 0 ? '#FFCC00' : '#888888',
            }).setOrigin(0.5);
            this.menuTexts.push(txt);
        }

        // Cursor
        this.cursor = this.add.text(GAME_WIDTH / 2 - sz(90), menuStartY, '►', {
            fontSize: fs(14), fontFamily: 'monospace', color: '#FFCC00',
        }).setOrigin(0.5);
        this._menuStartY = menuStartY;
        this._menuGap = menuGap;

        // Copyright
        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT - sz(8), 'A HYPOTHETICAL KONAMI/CAPCOM PRODUCTION', {
            fontSize: fs(7), fontFamily: 'monospace', color: '#555555',
        }).setOrigin(0.5);

        // Input
        this.upKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.UP);
        this.downKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.DOWN);
        this.enterKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
        this.zKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);

        this.controlsShowing = false;
        this.controlsOverlay = null;
    }

    update() {
        if (this.controlsShowing) {
            if (Phaser.Input.Keyboard.JustDown(this.enterKey) || Phaser.Input.Keyboard.JustDown(this.zKey)) {
                this.controlsOverlay.destroy(true);
                this.controlsShowing = false;
            }
            return;
        }

        if (Phaser.Input.Keyboard.JustDown(this.upKey)) {
            this.selectedIndex = (this.selectedIndex - 1 + this.menuItems.length) % this.menuItems.length;
        }
        if (Phaser.Input.Keyboard.JustDown(this.downKey)) {
            this.selectedIndex = (this.selectedIndex + 1) % this.menuItems.length;
        }

        for (let i = 0; i < this.menuTexts.length; i++) {
            this.menuTexts[i].setColor(i === this.selectedIndex ? '#FFCC00' : '#888888');
        }
        this.cursor.y = this._menuStartY + this.selectedIndex * this._menuGap;

        if (Phaser.Input.Keyboard.JustDown(this.enterKey) || Phaser.Input.Keyboard.JustDown(this.zKey)) {
            if (this.selectedIndex === 0) {
                this.cameras.main.fadeOut(500, 0, 0, 0);
                this.cameras.main.once('camerafadeoutcomplete', () => {
                    this.scene.start('CharSelect');
                });
            } else if (this.selectedIndex === 1) {
                this._showControls();
            }
        }
    }

    _showControls() {
        this.controlsShowing = true;
        this.controlsOverlay = this.add.container(0, 0);

        const panelW = GAME_WIDTH * 0.85;
        const panelH = GAME_HEIGHT * 0.85;
        const bg = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, panelW, panelH, 0x000000, 0.9);
        bg.setStrokeStyle(Math.max(1, sz(2)), COLORS.UI_BORDER);
        this.controlsOverlay.add(bg);

        const title = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 - panelH * 0.42, 'CONTROLS', {
            fontSize: fs(14), fontFamily: 'monospace', color: '#FFCC00', fontStyle: 'bold',
        }).setOrigin(0.5);
        this.controlsOverlay.add(title);

        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        const controls = isMobile ? [
            'D-PAD: Move     B: Jump     Y: Attack',
            'X: Grapple      L: Dodge    R: Lock-On',
            'A: Special       START: Pause',
            '',
            'TIPS: Grapple rooftops, swing for speed.',
            'Strike the red NAPE from behind!',
            'Resupply at green crate stations.',
        ] : [
            'ARROWS: Move    Z: Jump    X: Attack',
            'C: Grapple      S: Dodge   D: Lock-On',
            'A: Special       ESC: Pause',
            '',
            'TIPS: Grapple rooftops, swing for speed.',
            'Strike the red NAPE from behind!',
            'Resupply at green crate stations.',
        ];

        const lineH = panelH * 0.1;
        const startY = GAME_HEIGHT / 2 - panelH * 0.28;
        for (let i = 0; i < controls.length; i++) {
            const line = this.add.text(GAME_WIDTH / 2 - panelW * 0.4, startY + i * lineH, controls[i], {
                fontSize: fs(8), fontFamily: 'monospace', color: '#CCCCCC',
            });
            this.controlsOverlay.add(line);
        }

        const back = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 + panelH * 0.42, 'Press ENTER to close', {
            fontSize: fs(9), fontFamily: 'monospace', color: '#888888',
        }).setOrigin(0.5);
        this.controlsOverlay.add(back);
    }
}

// ---- CHARACTER SELECT SCENE ----
class CharSelectScene extends Phaser.Scene {
    constructor() {
        super('CharSelect');
    }

    create() {
        this.cameras.main.fadeIn(500);
        this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x0A0A1A);

        // Title — top 10% of screen
        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.06, 'SELECT YOUR SOLDIER', {
            fontSize: fs(16), fontFamily: 'monospace', color: '#FFCC00', fontStyle: 'bold',
        }).setOrigin(0.5);

        this.characters = ['eren', 'mikasa', 'levi'];
        this.selectedIndex = 0;
        this.charCards = [];

        // Card dimensions — derived from available space
        const cardH = GAME_HEIGHT * 0.72;
        const cardW = Math.min(cardH * 0.55, GAME_WIDTH * 0.28);
        const cardSpacing = Math.min(GAME_WIDTH * 0.32, cardW + sz(30));
        const cardCY = GAME_HEIGHT * 0.50;

        // Sprite scale — fit within top portion of card
        const spriteScale = Math.max(1, Math.min(4 * S, cardH * 0.2 / 16));

        for (let i = 0; i < this.characters.length; i++) {
            const charId = this.characters[i];
            const def = CHAR_DEFS[charId];
            const cx = GAME_WIDTH / 2 + (i - 1) * cardSpacing;

            const card = this.add.container(cx, cardCY);

            // Card background
            const cardBg = this.add.rectangle(0, 0, cardW, cardH, COLORS.UI_BG, 0.8);
            cardBg.setStrokeStyle(Math.max(1, sz(2)), COLORS.UI_BORDER);
            card.add(cardBg);

            // Character sprite — top 30% of card
            const charSprite = this.add.image(0, -cardH * 0.28, 'player_' + charId).setScale(spriteScale);
            card.add(charSprite);

            // Name — below sprite
            const nameText = this.add.text(0, -cardH * 0.06, def.name, {
                fontSize: fs(10), fontFamily: 'monospace', color: '#FFFFFF', fontStyle: 'bold',
            }).setOrigin(0.5);
            card.add(nameText);

            // Stats — middle of card
            const stats = [
                { label: 'BLADE', value: def.bladeStrength, color: '#CC4444' },
                { label: 'SPEED', value: def.speed, color: '#44CC44' },
                { label: 'GAS  ', value: def.gasEfficiency, color: '#4488CC' },
            ];

            const statStartY = cardH * 0.04;
            const statGap = cardH * 0.14;
            const barBlockW = Math.min(sz(16), cardW * 0.1);
            const barBlockH = Math.min(sz(8), cardH * 0.04);
            const barGap = barBlockW + 2;

            for (let s = 0; s < stats.length; s++) {
                const sy = statStartY + s * statGap;
                const label = this.add.text(-cardW * 0.42, sy, stats[s].label, {
                    fontSize: fs(8), fontFamily: 'monospace', color: '#AAAAAA',
                });
                card.add(label);

                for (let b = 0; b < 5; b++) {
                    const filled = b < stats[s].value;
                    const block = this.add.rectangle(-cardW * 0.05 + b * barGap, sy + barBlockH * 0.5, barBlockW, barBlockH,
                        filled ? Phaser.Display.Color.HexStringToColor(stats[s].color).color : 0x333333);
                    card.add(block);
                }
            }

            // Special ability name — near bottom of card
            const specText = this.add.text(0, cardH * 0.38, def.specialName, {
                fontSize: fs(7), fontFamily: 'monospace', color: '#FFCC00',
            }).setOrigin(0.5);
            card.add(specText);

            this.charCards.push(card);
        }

        // Selection frame
        this._cardSpacing = cardSpacing;
        this._cardCY = cardCY;
        this.selectFrame = this.add.rectangle(GAME_WIDTH / 2 - cardSpacing, cardCY, cardW + sz(6), cardH + sz(6), 0x000000, 0);
        this.selectFrame.setStrokeStyle(Math.max(1, sz(2)), COLORS.YELLOW);

        // Instructions — bottom
        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.94, '← → select    START confirm', {
            fontSize: fs(9), fontFamily: 'monospace', color: '#888888',
        }).setOrigin(0.5);

        // Input
        this.leftKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
        this.rightKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);
        this.enterKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
        this.zKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);
    }

    update() {
        if (Phaser.Input.Keyboard.JustDown(this.leftKey)) {
            this.selectedIndex = (this.selectedIndex - 1 + this.characters.length) % this.characters.length;
        }
        if (Phaser.Input.Keyboard.JustDown(this.rightKey)) {
            this.selectedIndex = (this.selectedIndex + 1) % this.characters.length;
        }

        // Update selection frame position
        const targetX = GAME_WIDTH / 2 + (this.selectedIndex - 1) * this._cardSpacing;
        this.selectFrame.x = lerp(this.selectFrame.x, targetX, 0.2);

        if (Phaser.Input.Keyboard.JustDown(this.enterKey) || Phaser.Input.Keyboard.JustDown(this.zKey)) {
            this.cameras.main.fadeOut(500, 0, 0, 0);
            this.cameras.main.once('camerafadeoutcomplete', () => {
                this.scene.start('Game', { charId: this.characters[this.selectedIndex] });
            });
        }
    }
}

// ---- GAME SCENE ----
class GameScene extends Phaser.Scene {
    constructor() {
        super('Game');
    }

    init(data) {
        this.charId = data.charId || 'eren';
        this.timeScale = 1.0;
        this.stageTimer = 0;
        this.effects = [];
        this.titans = [];
        this.titanGraphics = null;
        this.totalTitansToKill = 0;
        this.titansSpawned = 0;
        this.waveTimer = 0;
        this.currentWave = 0;
        this.maxWaves = 5;
        this.isPaused = false;
        this.transitioning = false;
    }

    create() {
        this.cameras.main.fadeIn(500);

        // Create stage — world height adapts to viewport
        const worldW = 4000 * DPR;
        const worldH = Math.max(800 * DPR, GAME_HEIGHT + 300 * DPR);
        this.stage = new Stage(this, {
            worldWidth: worldW,
            worldHeight: worldH,
        });

        // Set world bounds and camera
        this.cameras.main.setBounds(0, 0, worldW, worldH);

        // Create player
        const groundY = (this.stage.tilesY - 2) * TILE_SIZE;
        this.player = new Player(this, 128 * DPR, groundY, this.charId);

        // Camera follow (will be overridden during cutscenes)
        this.cameras.main.startFollow(this.player.sprite, true, 0.08, 0.08);

        // Titan container graphics
        this.titanGraphics = this.add.graphics();
        this.titanGraphics.setDepth(42);

        // Effects graphics
        this.effectsGraphics = this.add.graphics();
        this.effectsGraphics.setDepth(60);

        // HUD
        this.hud = new HUD(this);

        // Cutscene system
        this.cutscene = new Cutscene(this);
        this.inCutscene = true;

        // Spawn titans early so they're visible during cutscene
        this._spawnWave();

        // Skip cutscene on any key or tap
        this._cutsceneSkipKey = this.input.keyboard.on('keydown', () => {
            if (this.cutscene.active) this.cutscene.skip();
        });
        this.input.on('pointerdown', () => {
            if (this.cutscene.active) this.cutscene.skip();
        });

        // Build intro cutscene beats — pan to show titans
        const charName = CHAR_DEFS[this.charId].name;
        const groundLevel = groundY;
        // Find where titans actually are for cinematic panning
        const firstTitan = this.titans.length > 0 ? this.titans[0] : null;
        const midTitan = this.titans.length > 2 ? this.titans[Math.floor(this.titans.length / 2)] : firstTitan;
        const introBeats = [
            {
                camX: this.player.x, camY: groundLevel - 100 * DPR,
                speaker: '', text: 'Trost District — Year 850',
                panDuration: 1000, duration: 120,
            },
            {
                camX: midTitan ? midTitan.x : worldW * 0.4,
                camY: groundLevel - 200 * DPR,
                speaker: '', text: 'The wall has been breached. Titans are pouring in.',
                panDuration: 2500, duration: 150,
            },
            {
                camX: firstTitan ? firstTitan.x : worldW * 0.3,
                camY: groundLevel - 150 * DPR,
                speaker: 'Shadis', text: 'All squads — engage ODM gear and eliminate every Titan within the district!',
                panDuration: 2000, duration: 180,
            },
            {
                camX: this.player.x, camY: this.player.y - 60 * DPR,
                speaker: charName, text: 'Understood. Blades ready... let\'s move!',
                panDuration: 1200, duration: 140,
            },
        ];

        this.cutscene.play(introBeats, () => {
            this.inCutscene = false;
            this.cameras.main.startFollow(this.player.sprite, true, 0.08, 0.08);
            this.hud.showMessage('Shadis', 'Eliminate all Titans!', 2000);
        });

        // Pause handling
        this.pauseKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ESC);
        this.pauseOverlay = null;
    }

    _spawnWave() {
        this.currentWave++;
        let count = 3 + this.currentWave;
        if (count > 10) count = 10;

        const spawnPoints = this.stage.getTitanSpawnPoints(count);

        for (let i = 0; i < spawnPoints.length; i++) {
            const sp = spawnPoints[i];

            // Choose titan class based on wave
            let cls = '3m';
            const roll = Math.random();
            if (this.currentWave >= 3 && roll > 0.7) cls = '10m';
            else if (this.currentWave >= 2 && roll > 0.5) cls = '7m';
            else if (roll > 0.8) cls = '7m';

            // Aberrant chance
            const isAberrant = this.currentWave >= 2 && Math.random() > 0.8;

            const titan = new Titan(this, sp.x, sp.y, cls, isAberrant);
            this.titans.push(titan);
        }

        this.totalTitansToKill += count;

        if (this.currentWave > 1 && this.hud) {
            this.hud.showMessage(null, `Wave ${this.currentWave}! ${count} Titans incoming!`, 2500);
        }
    }

    spawnEffect(type, x, y, dir) {
        if (type === 'slash') {
            this.effects.push({
                type: 'slash',
                x: x, y: y,
                dir: dir || 1,
                life: 6,
                maxLife: 6,
            });
        } else if (type === 'nape_slash') {
            this.effects.push({
                type: 'nape_slash',
                x: x, y: y,
                dir: dir || 1,
                life: 8,
                maxLife: 8,
            });
        } else if (type === 'blood_burst') {
            for (let i = 0; i < 6; i++) {
                this.effects.push({
                    type: 'blood',
                    x: x + randFloat(-5, 5) * DPR,
                    y: y + randFloat(-5, 5) * DPR,
                    vx: randFloat(-3, 3) * DPR,
                    vy: randFloat(-4, -1) * DPR,
                    life: randInt(10, 20),
                    maxLife: 20,
                    size: randFloat(2, 4) * DPR,
                });
            }
        }
    }

    update(time, delta) {
        // Pause toggle
        if (Phaser.Input.Keyboard.JustDown(this.pauseKey)) {
            this.isPaused = !this.isPaused;
            if (this.isPaused) {
                this._showPause();
            } else {
                this._hidePause();
            }
        }

        if (this.isPaused) return;

        // Real delta time normalized to 60fps (dt=1.0 at 60fps)
        const dt = (delta / 16.667) * this.timeScale;

        // Cutscene update
        if (this.cutscene.active) {
            this.cutscene.update(dt);
            return;
        }
        if (this.inCutscene) return;

        this.stageTimer++;

        // Update player
        this.player.update(dt);
        this.player.render();

        // Update titans
        this.titanGraphics.clear();
        for (let i = this.titans.length - 1; i >= 0; i--) {
            const titan = this.titans[i];
            titan.update(dt);
            titan.render(this.titanGraphics);

            // Remove fully dead titans
            if (titan.isDead && titan.deathTimer > 90) {
                this.titans.splice(i, 1);
            }
        }

        // Update effects
        this.effectsGraphics.clear();
        for (let i = this.effects.length - 1; i >= 0; i--) {
            const e = this.effects[i];
            e.life -= dt;

            if (e.type === 'blood') {
                e.x += e.vx * dt;
                e.y += e.vy * dt;
                e.vy += 0.2 * DPR * dt;
                const alpha = e.life / e.maxLife;
                this.effectsGraphics.fillStyle(COLORS.BLOOD_RED, alpha);
                this.effectsGraphics.fillCircle(e.x, e.y, e.size);
            } else if (e.type === 'slash') {
                const alpha = e.life / e.maxLife;
                this.effectsGraphics.lineStyle(3 * DPR, 0xFFFFFF, alpha);
                this.effectsGraphics.beginPath();
                this.effectsGraphics.arc(e.x, e.y, 16 * DPR, -1.2 * e.dir, 1.2 * e.dir, e.dir < 0);
                this.effectsGraphics.strokePath();
            } else if (e.type === 'nape_slash') {
                const alpha = e.life / e.maxLife;
                this.effectsGraphics.lineStyle(4 * DPR, COLORS.NAPE_RED, alpha);
                this.effectsGraphics.beginPath();
                this.effectsGraphics.arc(e.x, e.y, 18 * DPR, -1.2 * e.dir, 1.2 * e.dir, e.dir < 0);
                this.effectsGraphics.strokePath();
            }

            if (e.life <= 0) {
                this.effects.splice(i, 1);
            }
        }

        // HUD
        this.hud.update(this.player);

        // Wave management
        let aliveTitans = 0;
        for (let i = 0; i < this.titans.length; i++) {
            if (!this.titans[i].isDead) aliveTitans++;
        }

        if (aliveTitans === 0 && this.currentWave < this.maxWaves) {
            this.waveTimer++;
            if (this.waveTimer > 120) {
                this.waveTimer = 0;
                this._spawnWave();
            }
        }

        // Victory condition
        if (aliveTitans === 0 && this.currentWave >= this.maxWaves && !this.transitioning) {
            this.transitioning = true;
            this.inCutscene = true;

            const charName = CHAR_DEFS[this.charId].name;
            const px = this.player.x;
            const py = this.player.y;
            const worldW = this.stage.worldWidth;
            const groundY = (this.stage.tilesY - 2) * TILE_SIZE;

            const victoryBeats = [
                {
                    camX: px, camY: py - 30 * DPR,
                    speaker: '', text: 'The last Titan falls...',
                    panDuration: 800, duration: 120,
                },
                {
                    camX: px, camY: py - 120 * DPR,
                    speaker: charName, text: 'It\'s over... we held the district.',
                    panDuration: 2000, duration: 150,
                },
                {
                    camX: worldW * 0.5, camY: groundY - 300 * DPR,
                    speaker: 'Shadis', text: 'All Titans within Trost have been eliminated. Well done, soldiers.',
                    panDuration: 2500, duration: 180,
                },
                {
                    camX: worldW * 0.5, camY: groundY - 400 * DPR,
                    speaker: '', text: 'Humanity\'s first victory... but the fight is far from over.',
                    panDuration: 2000, duration: 160,
                },
            ];

            this.cutscene.play(victoryBeats, () => {
                this._victory();
            });
        }

        // Death condition
        if (this.player.isDead && !this.transitioning) {
            this.transitioning = true;
            this.time.delayedCall(2000, () => {
                this.scene.start('GameOver', {
                    charId: this.charId,
                    score: this.player.score,
                    kills: this.player.killCount,
                });
            });
        }
    }

    _victory() {
        this.cameras.main.fadeOut(1500, 0, 0, 0);
        this.cameras.main.once('camerafadeoutcomplete', () => {
            this.scene.start('Results', {
                charId: this.charId,
                score: this.player.score,
                kills: this.player.killCount,
                time: this.stageTimer,
                damageTaken: this.player.damageTaken,
                gasRemaining: this.player.gas,
                bladeRemaining: this.player.bladeDurability,
            });
        });
    }

    _showPause() {
        this.pauseOverlay = this.add.container(0, 0).setDepth(200).setScrollFactor(0);
        const bg = this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.7);
        this.pauseOverlay.add(bg);
        const txt = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 - sz(20), 'PAUSED', {
            fontSize: fs(32), fontFamily: 'monospace', color: '#FFFFFF',
        }).setOrigin(0.5);
        this.pauseOverlay.add(txt);
        const hint = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 + sz(30), 'Press ESC to resume', {
            fontSize: fs(12), fontFamily: 'monospace', color: '#888888',
        }).setOrigin(0.5);
        this.pauseOverlay.add(hint);
    }

    _hidePause() {
        if (this.pauseOverlay) {
            this.pauseOverlay.destroy(true);
            this.pauseOverlay = null;
        }
    }

    shutdown() {
        if (this.stage) this.stage.destroy();
        if (this.player) this.player.destroy();
        if (this.hud) this.hud.destroy();
        for (let i = 0; i < this.titans.length; i++) {
            this.titans[i]._destroy();
        }
    }
}

// ---- RESULTS SCENE ----
class ResultsScene extends Phaser.Scene {
    constructor() {
        super('Results');
    }

    init(data) {
        this.resultData = data;
    }

    create() {
        this.cameras.main.fadeIn(500);
        this.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_WIDTH, GAME_HEIGHT, 0x0A0A2A);

        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.08, 'MISSION COMPLETE', {
            fontSize: fs(24), fontFamily: 'monospace', color: '#FFCC00', fontStyle: 'bold',
        }).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.15, 'Battle of Trost', {
            fontSize: fs(14), fontFamily: 'monospace', color: '#AAAAAA',
        }).setOrigin(0.5);

        // Stats
        const d = this.resultData;
        const timeSeconds = Math.floor(d.time / 60);
        const stats = [
            { label: 'TIME', value: Math.floor(timeSeconds / 60) + ':' + String(timeSeconds % 60).padStart(2, '0') },
            { label: 'TITANS KILLED', value: '' + d.kills },
            { label: 'DAMAGE TAKEN', value: d.damageTaken + ' hits' },
            { label: 'GAS REMAINING', value: Math.floor(d.gasRemaining) + '%' },
            { label: 'BLADES REMAINING', value: Math.floor(d.bladeRemaining) + '%' },
            { label: 'SCORE', value: '' + d.score },
        ];

        // Animate stats appearing
        const statsStartY = GAME_HEIGHT * 0.22;
        const statsSpacing = (GAME_HEIGHT * 0.38) / stats.length;
        const colOff = GAME_WIDTH * 0.3;
        for (let i = 0; i < stats.length; i++) {
            this.time.delayedCall(i * 300 + 500, () => {
                this.add.text(GAME_WIDTH / 2 - colOff, statsStartY + i * statsSpacing, stats[i].label, {
                    fontSize: fs(11), fontFamily: 'monospace', color: '#AAAAAA',
                });
                this.add.text(GAME_WIDTH / 2 + colOff, statsStartY + i * statsSpacing, stats[i].value, {
                    fontSize: fs(11), fontFamily: 'monospace', color: '#FFFFFF',
                }).setOrigin(1, 0);
            });
        }

        // Calculate rank
        let points = 0;
        const parTime = 180 * 60;
        points += Math.min(40, (parTime / Math.max(1, d.time)) * 40);
        points += Math.min(25, (d.kills / 20) * 25);
        points += Math.max(0, 20 - d.damageTaken * 4);
        points += ((d.gasRemaining + d.bladeRemaining) / 200) * 10;

        let rank = 'D';
        let rankColor = '#666666';
        if (points >= 80) { rank = 'S'; rankColor = '#FFD700'; }
        else if (points >= 60) { rank = 'A'; rankColor = '#DDDDDD'; }
        else if (points >= 40) { rank = 'B'; rankColor = '#CD7F32'; }
        else if (points >= 20) { rank = 'C'; rankColor = '#888888'; }

        const rankMessages = {
            S: 'A performance worthy of Captain Levi himself.',
            A: 'The Wings of Freedom fly proudly today.',
            B: 'Acceptable. But acceptable isn\'t enough to save humanity.',
            C: 'The Titans are still out there. Train harder.',
            D: 'Commander Shadis is disappointed. Again.',
        };

        // Show rank with dramatic delay
        this.time.delayedCall(stats.length * 300 + 800, () => {
            const rankText = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.7, rank, {
                fontSize: fs(48), fontFamily: 'monospace', color: rankColor,
                fontStyle: 'bold', stroke: '#000000', strokeThickness: sz(4),
            }).setOrigin(0.5).setScale(2);

            this.tweens.add({
                targets: rankText,
                scale: 1,
                duration: 500,
                ease: 'Back.easeOut',
            });

            this.cameras.main.shake(200, 0.01);

            this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.8, rankMessages[rank], {
                fontSize: fs(11), fontFamily: 'monospace', color: '#AAAAAA',
                fontStyle: 'italic',
            }).setOrigin(0.5);
        });

        // Continue prompt
        this.time.delayedCall(stats.length * 300 + 2000, () => {
            const contText = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.92, 'Press ENTER to continue', {
                fontSize: fs(12), fontFamily: 'monospace', color: '#888888',
            }).setOrigin(0.5);

            this.tweens.add({
                targets: contText,
                alpha: 0.3,
                duration: 800,
                yoyo: true,
                repeat: -1,
            });

            this.canContinue = true;
        });

        this.canContinue = false;
        this.enterKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
        this.zKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);
    }

    update() {
        if (this.canContinue) {
            if (Phaser.Input.Keyboard.JustDown(this.enterKey) || Phaser.Input.Keyboard.JustDown(this.zKey)) {
                this.cameras.main.fadeOut(500);
                this.cameras.main.once('camerafadeoutcomplete', () => {
                    this.scene.start('Title');
                });
            }
        }
    }
}

        emblemGfx.fillStyle(0x888888);
        emblemGfx.fillTriangle(ex + 35 * eS, ey + 30 * eS, ex + 5 * eS, ey - 25 * eS, ex + 5 * eS, ey + 30 * eS);

        emblemGfx.moveTo(ex - 10 * eS, ey - 50 * eS);
        emblemGfx.lineTo(ex + 5 * eS, ey - 20 * eS);
        emblemGfx.lineTo(ex - 3 * eS, ey + 10 * eS);
        emblemGfx.lineTo(ex + 8 * eS, ey + 50 * eS);
        emblemGfx.strokePath();

        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.50, 'On that day, humanity received', {
            fontSize: fs(12), fontFamily: 'monospace', color: '#AA4444',
        }).setOrigin(0.5);
        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.57, 'another grim reminder.', {
            fontSize: fs(12), fontFamily: 'monospace', color: '#AA4444',
        }).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.68, 'Score: ' + (this.resultData.score || 0), {
            fontSize: fs(10), fontFamily: 'monospace', color: '#888888',
        }).setOrigin(0.5);
        this.add.text(GAME_WIDTH / 2, GAME_HEIGHT * 0.74, 'Kills: ' + (this.resultData.kills || 0), {
            fontSize: fs(10), fontFamily: 'monospace', color: '#888888',
        }).setOrigin(0.5);

        // Menu options
        this.menuItems = ['RETRY', 'TITLE SCREEN'];
        this.selectedIndex = 0;
        this.menuTexts = [];

        const goMenuY = GAME_HEIGHT * 0.84;
        const goMenuGap = GAME_HEIGHT * 0.08;
        for (let i = 0; i < this.menuItems.length; i++) {
            const txt = this.add.text(GAME_WIDTH / 2, goMenuY + i * goMenuGap, this.menuItems[i], {
                fontSize: fs(12), fontFamily: 'monospace', color: '#888888',
            }).setOrigin(0.5);
            this.menuTexts.push(txt);
        }

        this.cursor = this.add.text(GAME_WIDTH / 2 - sz(80), goMenuY, '►', {
            fontSize: fs(12), fontFamily: 'monospace', color: '#FFCC00',
        }).setOrigin(0.5);
        this._goMenuY = goMenuY;
        this._goMenuGap = goMenuGap;

        this.upKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.UP);
        this.downKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.DOWN);
        this.enterKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
        this.zKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);
    }

    update() {
        if (Phaser.Input.Keyboard.JustDown(this.upKey)) {
            this.selectedIndex = (this.selectedIndex - 1 + this.menuItems.length) % this.menuItems.length;
        }
        if (Phaser.Input.Keyboard.JustDown(this.downKey)) {
            this.selectedIndex = (this.selectedIndex + 1) % this.menuItems.length;
        }

        for (let i = 0; i < this.menuTexts.length; i++) {
            this.menuTexts[i].setColor(i === this.selectedIndex ? '#FFCC00' : '#888888');
        }
        this.cursor.y = this._goMenuY + this.selectedIndex * this._goMenuGap;

        if (Phaser.Input.Keyboard.JustDown(this.enterKey) || Phaser.Input.Keyboard.JustDown(this.zKey)) {
            this.cameras.main.fadeOut(500);
            this.cameras.main.once('camerafadeoutcomplete', () => {
                if (this.selectedIndex === 0) {
                    this.scene.start('Game', { charId: this.resultData.charId || 'eren' });
                } else {
                    this.scene.start('Title');
                }
            });
        }
    }
}

// ===========================================================
// VIRTUAL CONTROLLER — Touch input for mobile/iOS
// ===========================================================
const VController = {
    // Key name → keyCode mapping (matches Phaser keyboard codes)
    KEY_MAP: {
        up:      { keyCode: 38, code: 'ArrowUp',    key: 'ArrowUp' },
        down:    { keyCode: 40, code: 'ArrowDown',  key: 'ArrowDown' },
        left:    { keyCode: 37, code: 'ArrowLeft',  key: 'ArrowLeft' },
        right:   { keyCode: 39, code: 'ArrowRight', key: 'ArrowRight' },
        jump:    { keyCode: 90, code: 'KeyZ',       key: 'z' },
        attack:  { keyCode: 88, code: 'KeyX',       key: 'x' },
        grapple: { keyCode: 67, code: 'KeyC',       key: 'c' },
        special: { keyCode: 65, code: 'KeyA',       key: 'a' },
        dodge:   { keyCode: 83, code: 'KeyS',       key: 's' },
        lockOn:  { keyCode: 68, code: 'KeyD',       key: 'd' },
        start:   { keyCode: 13, code: 'Enter',      key: 'Enter' },
        select:  { keyCode: 27, code: 'Escape',     key: 'Escape' },
    },

    // Currently pressed virtual keys (to avoid duplicate events)
    pressed: {},

    // Touch → button tracking for multi-touch
    touchMap: {},

    // D-pad active directions per touch
    dpadTouches: {},

    isTouchDevice: false,
    el: null,

    init() {
        this.isTouchDevice = ('ontouchstart' in window) ||
            (navigator.maxTouchPoints > 0) ||
            (navigator.msMaxTouchPoints > 0);

        this.el = document.getElementById('vcontroller');
        if (!this.el) return;

        if (this.isTouchDevice) {
            this.el.classList.add('active');
        }

        // Also show on first touch if we missed detection
        window.addEventListener('touchstart', () => {
            if (!this.el.classList.contains('active')) {
                this.el.classList.add('active');
            }
        }, { once: true, passive: true });

        this._bindFaceButtons();
        this._bindDpad();
        this._preventDefaults();
    },

    _fireKey(keyName, isDown) {
        const mapping = this.KEY_MAP[keyName];
        if (!mapping) return;

        // Avoid duplicate downs
        if (isDown && this.pressed[keyName]) return;
        if (!isDown && !this.pressed[keyName]) return;

        this.pressed[keyName] = isDown;

        const eventType = isDown ? 'keydown' : 'keyup';
        const evt = new KeyboardEvent(eventType, {
            keyCode: mapping.keyCode,
            which: mapping.keyCode,
            code: mapping.code,
            key: mapping.key,
            bubbles: true,
            cancelable: true,
        });
        document.dispatchEvent(evt);
        window.dispatchEvent(evt);
    },

    _bindFaceButtons() {
        // All buttons except dpad directions
        const buttons = this.el.querySelectorAll('.face-btn, .shoulder-btn, .center-btn');

        for (let i = 0; i < buttons.length; i++) {
            const btn = buttons[i];
            const keyName = btn.getAttribute('data-key');
            if (!keyName) continue;

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                for (let t = 0; t < e.changedTouches.length; t++) {
                    const touchId = e.changedTouches[t].identifier;
                    this.touchMap[touchId] = { type: 'button', key: keyName, el: btn };
                }
                btn.classList.add('pressed');
                this._fireKey(keyName, true);
            }, { passive: false });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                for (let t = 0; t < e.changedTouches.length; t++) {
                    const touchId = e.changedTouches[t].identifier;
                    delete this.touchMap[touchId];
                }
                // Only release if no other touch is still on this button
                let stillHeld = false;
                for (let tid in this.touchMap) {
                    if (this.touchMap[tid].key === keyName) { stillHeld = true; break; }
                }
                if (!stillHeld) {
                    btn.classList.remove('pressed');
                    this._fireKey(keyName, false);
                }
            }, { passive: false });

            btn.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                for (let t = 0; t < e.changedTouches.length; t++) {
                    delete this.touchMap[e.changedTouches[t].identifier];
                }
                btn.classList.remove('pressed');
                this._fireKey(keyName, false);
            }, { passive: false });
        }
    },

    _bindDpad() {
        const zone = document.getElementById('dpadZone');
        if (!zone) return;

        const dpadBtns = {
            up: zone.querySelector('.dpad-up'),
            down: zone.querySelector('.dpad-down'),
            left: zone.querySelector('.dpad-left'),
            right: zone.querySelector('.dpad-right'),
        };

        const resolveDirection = (touchX, touchY) => {
            const rect = zone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = touchX - cx;
            const dy = touchY - cy;
            const deadZone = 12;
            const dirs = { up: false, down: false, left: false, right: false };

            if (Math.abs(dx) > deadZone || Math.abs(dy) > deadZone) {
                const angle = Math.atan2(dy, dx);
                // Support diagonals by checking angular sectors
                // Right: -45° to 45°, Down: 45° to 135°, Left: 135° to -135°, Up: -135° to -45°
                if (angle > -0.9 && angle < 0.9) dirs.right = true;
                if (angle > 0.4 && angle < 2.7) dirs.down = true;
                if (angle > 2.2 || angle < -2.2) dirs.left = true;
                if (angle > -2.7 && angle < -0.4) dirs.up = true;
            }
            return dirs;
        };

        const updateDpad = (touchId, dirs) => {
            const prev = this.dpadTouches[touchId] || { up: false, down: false, left: false, right: false };
            this.dpadTouches[touchId] = dirs;

            // Compute combined state across all active dpad touches
            const combined = { up: false, down: false, left: false, right: false };
            for (let tid in this.dpadTouches) {
                const d = this.dpadTouches[tid];
                if (d.up) combined.up = true;
                if (d.down) combined.down = true;
                if (d.left) combined.left = true;
                if (d.right) combined.right = true;
            }

            for (let dir in combined) {
                const wasDown = this.pressed[dir];
                if (combined[dir] && !wasDown) {
                    this._fireKey(dir, true);
                    if (dpadBtns[dir]) dpadBtns[dir].classList.add('pressed');
                } else if (!combined[dir] && wasDown) {
                    this._fireKey(dir, false);
                    if (dpadBtns[dir]) dpadBtns[dir].classList.remove('pressed');
                }
            }
        };

        const releaseDpad = (touchId) => {
            delete this.dpadTouches[touchId];
            // Recompute combined
            const combined = { up: false, down: false, left: false, right: false };
            for (let tid in this.dpadTouches) {
                const d = this.dpadTouches[tid];
                if (d.up) combined.up = true;
                if (d.down) combined.down = true;
                if (d.left) combined.left = true;
                if (d.right) combined.right = true;
            }
            for (let dir in combined) {
                if (!combined[dir] && this.pressed[dir]) {
                    this._fireKey(dir, false);
                    if (dpadBtns[dir]) dpadBtns[dir].classList.remove('pressed');
                }
            }
        };

        zone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            for (let t = 0; t < e.changedTouches.length; t++) {
                const touch = e.changedTouches[t];
                const dirs = resolveDirection(touch.clientX, touch.clientY);
                updateDpad(touch.identifier, dirs);
            }
        }, { passive: false });

        zone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            e.stopPropagation();
            for (let t = 0; t < e.changedTouches.length; t++) {
                const touch = e.changedTouches[t];
                if (this.dpadTouches[touch.identifier] !== undefined) {
                    const dirs = resolveDirection(touch.clientX, touch.clientY);
                    updateDpad(touch.identifier, dirs);
                }
            }
        }, { passive: false });

        zone.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            for (let t = 0; t < e.changedTouches.length; t++) {
                releaseDpad(e.changedTouches[t].identifier);
            }
        }, { passive: false });

        zone.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            for (let t = 0; t < e.changedTouches.length; t++) {
                releaseDpad(e.changedTouches[t].identifier);
            }
        }, { passive: false });
    },

    _preventDefaults() {
        // Prevent iOS rubber-banding, zoom, and context menus on the whole page
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('#vcontroller')) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', (e) => { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', (e) => { e.preventDefault(); }, { passive: false });

        // Prevent context menu on long-press
        document.addEventListener('contextmenu', (e) => { e.preventDefault(); });

        // Prevent double-tap zoom
        let lastTap = 0;
        document.addEventListener('touchstart', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                e.preventDefault();
            }
            lastTap = now;
        }, { passive: false });
    },
};

// Initialize after DOM ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => VController.init());
} else {
    VController.init();
}

// ---- PHASER CONFIG ----
const config = {
    type: Phaser.AUTO,
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    backgroundColor: '#000000',
    parent: 'game-container',
    scene: [BootScene, TitleScene, CharSelectScene, GameScene, ResultsScene, GameOverScene],
    render: {
        pixelArt: true,
        antialias: false,
    },
    scale: {
        mode: Phaser.Scale.NONE,
        parent: 'game-container',
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
    },
    input: {
        keyboard: {
            target: window,
        },
        touch: {
            target: null,
        },
    },
};

const game = new Phaser.Game(config);

// Reload on orientation change so canvas resizes properly
let _initialW = window.innerWidth;
let _initialH = window.innerHeight;
function _checkResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    // Detect orientation flip (width/height swapped significantly)
    const wasLandscape = _initialW > _initialH;
    const isLandscape = w > h;
    if (wasLandscape !== isLandscape) {
        window.location.reload();
    }
}
window.addEventListener('orientationchange', () => {
    setTimeout(_checkResize, 200);
});
window.addEventListener('resize', () => {
    // Debounced check — only reload on actual orientation flip
    clearTimeout(window._resizeTimer);
    window._resizeTimer = setTimeout(_checkResize, 300);
});
</script>
