// ---- STATE MACHINE ----
class StateMachine {
    constructor(owner) {
        this.owner = owner;
        this.currentState = null;
        this.previousState = null;
        this.states = {};
    }

    addState(name, stateObj) {
        stateObj.name = name;
        stateObj.machine = this;
        stateObj.owner = this.owner;
        this.states[name] = stateObj;
    }

    changeState(name) {
        if (this.currentState) {
            this.currentState.exit();
            this.previousState = this.currentState;
        }
        this.currentState = this.states[name];
        if (this.currentState) {
            this.currentState.elapsed = 0;
            this.currentState.enter();
        }
    }

    update(dt) {
        if (this.currentState) {
            this.currentState.elapsed += dt;
            this.currentState.execute(dt);
        }
    }

    isInState(name) {
        return this.currentState && this.currentState.name === name;
    }
}

// ---- PLAYER CLASS ----
class Player {
    constructor(scene, x, y, charId) {
        this.scene = scene;
        this.charDef = CHAR_DEFS[charId];
        this.charId = charId;

        // Position and physics
        this.x = x;
        this.y = y;
        this.prevX = x;
        this.prevY = y;
        this.vx = 0;
        this.vy = 0;
        this.width = 20 * DPR;
        this.height = 32 * DPR;
        this.facing = 1; // 1=right, -1=left
        this.isGrounded = false;

        // Stats
        this.maxHealth = this.charDef.maxHealth;
        this.health = this.maxHealth;
        this.gas = 100;
        this.bladeDurability = 100;
        this.bladeSets = 8;
        this.specialCharges = this.charDef.specialCharges;

        // Combat
        this.comboCount = 0;
        this.hitStopFrames = 0;
        this.isInvulnerable = false;
        this.invulnerableTimer = 0;
        this.flashTimer = 0;
        this.lockedTarget = null;
        this.killCount = 0;
        this.score = 0;
        this.damageTaken = 0;

        // Grapple
        this.grappleTarget = null;
        this.grappleLength = 0;
        this.grappleAngle = 0;
        this.grappleAngularVel = 0;
        this.isGrappled = false;
        this.grappleStartedGrounded = false;
        this.dt = 1;

        // Special
        this.specialActive = false;
        this.specialTimer = 0;
        this.titanFormActive = false;

        // Alive
        this.isDead = false;

        // Sprite
        this.sprite = scene.add.image(x, y, 'player_' + charId);
        this.sprite.setOrigin(0.5, 1);
        this.sprite.setDepth(50);
        this.sprite.setScale(DPR);

        // Grapple line graphics
        this.grappleLine = scene.add.graphics();
        this.grappleLine.setDepth(45);

        // Gas trail emitter - manual particles
        this.gasParticles = [];

        // State machine
        this.sm = new StateMachine(this);
        this._initStates();
        this.sm.changeState('IDLE');

        // Input
        this.keys = scene.input.keyboard.addKeys({
            left: Phaser.Input.Keyboard.KeyCodes.LEFT,
            right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
            up: Phaser.Input.Keyboard.KeyCodes.UP,
            down: Phaser.Input.Keyboard.KeyCodes.DOWN,
            jump: Phaser.Input.Keyboard.KeyCodes.Z,
            attack: Phaser.Input.Keyboard.KeyCodes.X,
            grapple: Phaser.Input.Keyboard.KeyCodes.C,
            special: Phaser.Input.Keyboard.KeyCodes.A,
            dodge: Phaser.Input.Keyboard.KeyCodes.S,
            lockOn: Phaser.Input.Keyboard.KeyCodes.D,
        });
    }

    _initStates() {
        const self = this;

        this.sm.addState('IDLE', {
            enter() {
                self.comboCount = 0;
                self.vx = 0;
                self.sprite.setTexture('player_' + self.charId);
            },
            execute(dt) {
                self._applyGravity();
                self._checkGrounded();

                if (self.keys.left.isDown || self.keys.right.isDown) {
                    self.sm.changeState('RUN');
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.jump)) {
                    self.sm.changeState('JUMP');
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.attack)) {
                    self.sm.changeState('GROUND_SLASH');
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) {
                    self._tryFireGrapple();
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.dodge)) {
                    self.sm.changeState('DODGE_ROLL');
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.special)) {
                    self._trySpecial();
                    return;
                }
                if (!self.isGrounded) {
                    self.sm.changeState('FALL');
                }
            },
            exit() {}
        });

        this.sm.addState('RUN', {
            enter() {
                self.sprite.setTexture('player_' + self.charId);
            },
            execute(dt) {
                const spd = (2.0 + self.charDef.speed * 0.3) * DPR;
                if (self.keys.left.isDown) {
                    self.vx = -spd;
                    self.facing = -1;
                } else if (self.keys.right.isDown) {
                    self.vx = spd;
                    self.facing = 1;
                } else {
                    self.sm.changeState('IDLE');
                    return;
                }
                self._applyGravity();
                self._checkGrounded();

                if (Phaser.Input.Keyboard.JustDown(self.keys.jump)) { self.sm.changeState('JUMP'); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.attack)) { self.sm.changeState('GROUND_SLASH'); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) { self._tryFireGrapple(); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.dodge)) { self.sm.changeState('DODGE_ROLL'); return; }
                if (!self.isGrounded) { self.sm.changeState('FALL'); }
            },
            exit() {}
        });

        this.sm.addState('JUMP', {
            enter() {
                self.vy = -9 * DPR;
                self.isGrounded = false;
            },
            execute(dt) {
                self._applyGravity();
                self._handleAirMovement();

                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) { self._tryFireGrapple(); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.attack)) { self.sm.changeState('AIR_SLASH'); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.jump)) { self._tryGasBoost(); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.dodge)) { self.sm.changeState('AIR_DODGE'); return; }

                if (self.vy >= 0) {
                    self.sm.changeState('FALL');
                    return;
                }
                if (self.isGrounded) { self.sm.changeState('IDLE'); }
            },
            exit() {}
        });

        this.sm.addState('FALL', {
            enter() {},
            execute(dt) {
                self._applyGravity();
                self._handleAirMovement();
                self._checkGrounded();

                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) { self._tryFireGrapple(); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.attack)) { self.sm.changeState('AIR_SLASH'); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.jump)) { self._tryGasBoost(); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.dodge)) { self.sm.changeState('AIR_DODGE'); return; }

                if (self.isGrounded) { self.sm.changeState('IDLE'); }
            },
            exit() {}
        });

        this.sm.addState('GRAPPLE_FIRE', {
            enter() {
                // Grapple target already set by _tryFireGrapple
                self._consumeGas(1);
                self.grappleStartedGrounded = self.isGrounded;
                self.isGrounded = false;
            },
            execute(dt) {
                if (this.elapsed > 3) {
                    self.sm.changeState('SWINGING');
                }
            },
            exit() {}
        });

        this.sm.addState('SWINGING', {
            enter() {
                self.isGrappled = true;
            },
            execute(dt) {
                const tx = self.grappleTarget.x;
                const ty = self.grappleTarget.y;
                const dx = tx - self.x;
                const dy = ty - self.y;
                const d = Math.sqrt(dx * dx + dy * dy);

                if (d < 1) {
                    // Arrived at anchor — slingshot launch
                    self._releaseGrapple();
                    self.sm.changeState('LAUNCH');
                    return;
                }

                // Normalize direction
                const nx = dx / d;
                const ny = dy / d;

                // Pull speed — slower, more controlled
                const pullAccel = 0.4 * DPR;
                const maxPull = 4.5 * DPR;

                // Accelerate toward target
                self.vx += nx * pullAccel * dt;
                self.vy += ny * pullAccel * dt;

                // Clamp speed
                const speed = Math.sqrt(self.vx * self.vx + self.vy * self.vy);
                if (speed > maxPull) {
                    self.vx = (self.vx / speed) * maxPull;
                    self.vy = (self.vy / speed) * maxPull;
                }

                // Move
                self.x += self.vx * dt;
                self.y += self.vy * dt;

                // Close enough to anchor — slingshot
                const arrivalDist = 20 * DPR;
                if (d < arrivalDist) {
                    self._releaseGrapple();
                    // Overshoot: give extra velocity in the pull direction
                    const launchBoost = self.grappleStartedGrounded ? 1.15 : 1.0;
                    self.vx = nx * speed * launchBoost;
                    self.vy = ny * speed * launchBoost;
                    // Ensure upward component if target was above
                    if (self.vy > -2 * DPR) self.vy = -2 * DPR;
                    self.sm.changeState('LAUNCH');
                    return;
                }

                // Update facing
                if (self.vx > 0.5 * DPR) self.facing = 1;
                else if (self.vx < -0.5 * DPR) self.facing = -1;

                // Gas trail
                if (this.elapsed % 2 < 1) self._spawnGasParticle();

                // Transitions — can cancel with grapple, jump, or attack
                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) {
                    self._releaseGrapple();
                    self._tryFireGrapple();
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.jump)) {
                    self._releaseGrapple();
                    self.sm.changeState('LAUNCH');
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.attack)) {
                    self.sm.changeState('AIR_SLASH');
                    return;
                }
            },
            exit() {
                self.isGrappled = false;
            }
        });

        this.sm.addState('LAUNCH', {
            enter() {
                self.isGrappled = false;
                self._spawnGasParticle();
                self._spawnGasParticle();
                self._spawnGasParticle();
            },
            execute(dt) {
                // Reduced gravity for first 10 elapsed (heroic arc)
                if (this.elapsed < 10) {
                    self.vy += GRAVITY * 0.4 * dt;
                } else {
                    self._applyGravity();
                }

                // Air control
                const ctrl = 0.15 * DPR;
                if (self.keys.left.isDown) { self.vx -= ctrl * dt; self.facing = -1; }
                if (self.keys.right.isDown) { self.vx += ctrl * dt; self.facing = 1; }

                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) { self._tryFireGrapple(); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.attack)) { self.sm.changeState('AIR_SLASH'); return; }
                if (Phaser.Input.Keyboard.JustDown(self.keys.jump)) { self._tryGasBoost(); return; }

                if (self.vy > 2 * DPR && this.elapsed > 15) {
                    self.sm.changeState('FALL');
                    return;
                }

                self._checkGrounded();
                if (self.isGrounded) { self.sm.changeState('IDLE'); }
            },
            exit() {}
        });

        this.sm.addState('GROUND_SLASH', {
            enter() {
                self.comboCount = Math.min(self.comboCount + 1, 3);
                self.vx = self.facing * 1.5 * DPR;
                self.sprite.setTexture('player_' + self.charId + '_slash');
                self._performSlash();
            },
            execute(dt) {
                self._applyGravity();
                self.vx *= Math.pow(0.9, dt);

                if (this.elapsed > 12) {
                    if (Phaser.Input.Keyboard.JustDown(self.keys.attack) && self.comboCount < 3) {
                        self.sm.changeState('GROUND_SLASH');
                        return;
                    }
                    self.sm.changeState('IDLE');
                }
            },
            exit() {
                self.sprite.setTexture('player_' + self.charId);
            }
        });

        this.sm.addState('AIR_SLASH', {
            enter() {
                self.comboCount = Math.min(self.comboCount + 1, 3);
                self.sprite.setTexture('player_' + self.charId + '_slash');

                // Small forward burst toward target
                if (self.lockedTarget) {
                    const ang = angleBetween(self.x, self.y, self.lockedTarget.x, self.lockedTarget.y - self.lockedTarget.height * 0.15);
                    self.vx += Math.cos(ang) * 3;
                    self.vy += Math.sin(ang) * 3;
                } else {
                    self.vx += self.facing * 2;
                }

                if (self.isGrappled) self._releaseGrapple();
                self._performSlash();
            },
            execute(dt) {
                self.vy += GRAVITY * 0.5; // Reduced gravity during slash

                if (self.hitStopFrames > 0) {
                    self.hitStopFrames--;
                    return; // freeze during hit stop
                }

                if (this.elapsed > 10) {
                    if (Phaser.Input.Keyboard.JustDown(self.keys.attack) && self.comboCount < 3) {
                        this.elapsed = 0;
                        self._performSlash();
                        return;
                    }
                    self.sm.changeState('FALL');
                }

                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) { self._tryFireGrapple(); return; }
                self._checkGrounded();
                if (self.isGrounded) { self.sm.changeState('IDLE'); }
            },
            exit() {
                self.sprite.setTexture('player_' + self.charId);
            }
        });

        this.sm.addState('GAS_BOOST', {
            enter() {
                // Reset velocity before applying boost (no compounding)
                let bx = 0;
                let by = -5 * DPR;
                if (self.keys.left.isDown) { bx = -5 * DPR; by = -3 * DPR; }
                else if (self.keys.right.isDown) { bx = 5 * DPR; by = -3 * DPR; }
                else if (self.keys.down.isDown) { bx = 0; by = 4 * DPR; }
                self.vx = bx;
                self.vy = by;
                self._consumeGas(5);
                for (let i = 0; i < 5; i++) self._spawnGasParticle();
            },
            execute(dt) {
                if (this.elapsed > 6) {
                    self.sm.changeState('FALL');
                    return;
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) { self._tryFireGrapple(); return; }
            },
            exit() {}
        });

        this.sm.addState('DODGE_ROLL', {
            enter() {
                self.vx = self.facing * 3.5 * DPR;
                self.isInvulnerable = true;
                self.invulnerableTimer = 10;
            },
            execute(dt) {
                self._applyGravity();
                self.vx *= Math.pow(0.92, dt);
                if (this.elapsed > 14) {
                    self.sm.changeState('IDLE');
                }
            },
            exit() {}
        });

        this.sm.addState('AIR_DODGE', {
            enter() {
                let dx = self.facing * 3 * DPR;
                if (self.keys.left.isDown) dx = -3 * DPR;
                if (self.keys.right.isDown) dx = 3 * DPR;
                self.vx = dx;
                self.vy = -1 * DPR;
                self.isInvulnerable = true;
                self.invulnerableTimer = 8;
                self._consumeGas(2);
            },
            execute(dt) {
                self.vy += GRAVITY * 0.3 * dt;
                if (this.elapsed > 12) {
                    self.sm.changeState('FALL');
                }
                if (Phaser.Input.Keyboard.JustDown(self.keys.grapple)) { self._tryFireGrapple(); return; }
                self._checkGrounded();
                if (self.isGrounded) { self.sm.changeState('IDLE'); }
            },
            exit() {}
        });

        this.sm.addState('HIT_STUN', {
            enter() {
                self.vx = -self.facing * 3 * DPR;
                self.vy = -3 * DPR;
                self.isInvulnerable = true;
                self.invulnerableTimer = 45;
                if (self.isGrappled) self._releaseGrapple();
            },
            execute(dt) {
                self._applyGravity();
                self.vx *= Math.pow(0.95, dt);
                if (this.elapsed > 20) {
                    if (self.isGrounded) self.sm.changeState('IDLE');
                    else self.sm.changeState('FALL');
                }
            },
            exit() {}
        });

        this.sm.addState('GRABBED', {
            enter() {
                self.mashCount = 0;
                self.grabTimer = 0;
                if (self.isGrappled) self._releaseGrapple();
            },
            execute(dt) {
                self.grabTimer++;
                // Track any key mashing
                for (let key in self.keys) {
                    if (Phaser.Input.Keyboard.JustDown(self.keys[key])) {
                        self.mashCount++;
                    }
                }
                // Escape
                if (self.mashCount >= 15) {
                    self.sm.changeState('HIT_STUN');
                    return;
                }
                // Fail to escape
                if (self.grabTimer > 60) {
                    self.takeDamage(2);
                    self.sm.changeState('HIT_STUN');
                }
            },
            exit() {}
        });

        this.sm.addState('DEAD', {
            enter() {
                self.isDead = true;
                self.vx = 0;
                self.vy = 0;
                if (self.isGrappled) self._releaseGrapple();
            },
            execute(dt) {},
            exit() {}
        });

        this.sm.addState('SPECIAL', {
            enter() {
                self.specialActive = true;
                self.specialTimer = 0;

                if (self.charId === 'mikasa') {
                    // Ackerman Instinct - slow time
                    self.scene.timeScale = 0.4;
                } else if (self.charId === 'levi') {
                    // Spin slash
                    self._performSpinSlash();
                } else if (self.charId === 'eren') {
                    // Titan shift visual
                    self.scene.cameras.main.flash(300, 255, 255, 200);
                    self.scene.cameras.main.shake(300, 0.02);
                }
            },
            execute(dt) {
                self.specialTimer++;
                if (self.charId === 'mikasa') {
                    self._applyGravity();
                    self._handleAirMovement();
                    if (Phaser.Input.Keyboard.JustDown(self.keys.attack)) {
                        self.sm.changeState('AIR_SLASH');
                        return;
                    }
                    if (self.specialTimer > 120) {
                        self.sm.changeState('FALL');
                        return;
                    }
                } else if (self.charId === 'levi') {
                    if (self.specialTimer > 20) {
                        self.sm.changeState('FALL');
                        return;
                    }
                } else {
                    // Eren titan form - brief power boost
                    self._applyGravity();
                    self._handleAirMovement();
                    if (self.specialTimer > 180) {
                        self.sm.changeState('FALL');
                        return;
                    }
                }
                self._checkGrounded();
                if (self.isGrounded && self.specialTimer > 30) {
                    self.sm.changeState('IDLE');
                }
            },
            exit() {
                self.specialActive = false;
                if (self.charId === 'mikasa') {
                    self.scene.timeScale = 1.0;
                }
            }
        });
    }

    // ---- HELPER METHODS ----

    _applyGravity() {
        const dt = this.dt || 1;
        this.vy += GRAVITY * dt;
        if (this.vy > TERMINAL_VELOCITY) this.vy = TERMINAL_VELOCITY;
    }

    _handleAirMovement() {
        const dt = this.dt || 1;
        const airControl = 0.2 * DPR;
        if (this.keys.left.isDown) { this.vx -= airControl * dt; this.facing = -1; }
        if (this.keys.right.isDown) { this.vx += airControl * dt; this.facing = 1; }
        this.vx *= Math.pow(0.99, dt); // Air friction
    }

    _checkGrounded() {
        // Check against stage tiles
        if (this.scene.stage) {
            this.isGrounded = this.scene.stage.checkGrounded(this);
        }
    }

    _tryFireGrapple() {
        if (this.gas <= 0) return;

        const anchor = this._findBestAnchor();
        if (anchor) {
            this.grappleTarget = anchor;
            this.sm.changeState('GRAPPLE_FIRE');
        }
    }

    _findBestAnchor() {
        if (!this.scene.stage) return null;

        // Get direction bias
        let dirX = this.facing;
        let dirY = -1; // Bias upward
        if (this.keys.up.isDown) dirY = -1.5;
        if (this.keys.left.isDown) dirX = -1;
        if (this.keys.right.isDown) dirX = 1;

        // If locked on, bias toward target
        if (this.lockedTarget && !this.lockedTarget.isDead) {
            dirX = this.lockedTarget.x > this.x ? 1 : -1;
            dirY = this.lockedTarget.y < this.y ? -1 : 0;
        }

        // Check building anchors
        let best = this.scene.stage.findAnchor(this.x, this.y, dirX, dirY, MAX_GRAPPLE_RANGE);
        let bestScore = best ? this._scoreAnchor(best, dirX, dirY) : -Infinity;

        // Also consider living Titans as grapple targets (aim for nape area)
        if (this.scene.titans) {
            for (let i = 0; i < this.scene.titans.length; i++) {
                const t = this.scene.titans[i];
                if (t.isDead) continue;
                // Target mouth area of titan (head is top 20%, mouth at ~65% down head)
                const tx = t.x;
                const ty = t.y - t.height * 0.87;
                const d = dist(this.x, this.y, tx, ty);
                if (d > MAX_GRAPPLE_RANGE || d < 20 * DPR) continue;

                const score = this._scoreAnchor({ x: tx, y: ty }, dirX, dirY);
                if (score > bestScore) {
                    bestScore = score;
                    best = { x: tx, y: ty, titan: t };
                }
            }
        }

        return best;
    }

    _scoreAnchor(anchor, dirX, dirY) {
        const dx = anchor.x - this.x;
        const dy = anchor.y - this.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 1) return -Infinity;
        const nx = dx / d;
        const ny = dy / d;
        const dirLen = Math.sqrt(dirX * dirX + dirY * dirY);
        const dot = (nx * dirX + ny * dirY) / dirLen;
        return dot * 100 - d * 0.2;
    }

    _releaseGrapple() {
        this.isGrappled = false;
        this.grappleTarget = null;
    }

    _tryGasBoost() {
        if (this._consumeGas(5)) {
            this.sm.changeState('GAS_BOOST');
        }
    }

    _consumeGas(amount) {
        if (this.gas <= 0) return false;
        this.gas = Math.max(0, this.gas - amount * 0.5);
        return true;
    }

    _refillGas(dt) {
        // Fast refill while grounded — full tank in ~2 seconds at 60fps
        if (this.isGrounded && this.gas < 100) {
            this.gas = Math.min(100, this.gas + 1.0 * dt);
        }
    }

    _consumeBlade(amount) {
        this.bladeDurability -= amount;
        if (this.bladeDurability <= 0) {
            this.bladeDurability = 0;
            if (this.bladeSets > 0) {
                this.bladeSets--;
                this.bladeDurability = 100;
            }
        }
    }

    _performSlash() {
        this._consumeBlade(5 + this.comboCount * 2);

        // Spawn slash arc visual
        const slashX = this.x + this.facing * 16 * DPR;
        const slashY = this.y - this.height / 2;
        this.scene.spawnEffect('slash', slashX, slashY, this.facing);

        // Check for titan hits (full body is hittable, nape is critical)
        if (this.scene.titans) {
            let hit = false;
            for (let i = 0; i < this.scene.titans.length; i++) {
                const titan = this.scene.titans[i];
                if (titan.isDead) continue;

                const bodyBounds = titan.getBodyBounds();
                const napeBounds = titan.getNapeBounds();
                const slashBounds = {
                    x: this.x + this.facing * 4 * DPR - 24 * DPR,
                    y: this.y - this.height - 16 * DPR,
                    w: 48 * DPR,
                    h: 40 * DPR
                };

                if (rectOverlap(slashBounds, bodyBounds)) {
                    const isNapeHit = rectOverlap(slashBounds, napeBounds);
                    const angle = this._calculateApproachAngle(titan);
                    let dmg = this.charDef.bladeStrength;
                    dmg *= angle.multiplier;
                    if (this.comboCount >= 3) dmg *= 1.5;
                    if (this.bladeDurability <= 0 && this.bladeSets <= 0) dmg *= 0.1;
                    if (this.specialActive && this.charId === 'mikasa') dmg *= 2;
                    if (this.specialActive && this.charId === 'eren') dmg *= 2;

                    // Body hits do less damage than nape hits
                    if (!isNapeHit) dmg *= 0.4;

                    titan.takeNapeDamage(dmg);
                    this.hitStopFrames = HIT_STOP_FRAMES;
                    hit = true;

                    // Blood burst and slash effect
                    const effectX = isNapeHit ? napeBounds.x + napeBounds.w / 2 : slashX;
                    const effectY = isNapeHit ? napeBounds.y + napeBounds.h / 2 : slashY;
                    this.scene.spawnEffect('blood_burst', effectX, effectY);
                    if (isNapeHit) {
                        this.scene.spawnEffect('nape_slash', slashX, slashY, this.facing);
                    }
                    this.scene.cameras.main.shake(80, isNapeHit ? 0.008 : 0.004);

                    if (titan.isDead) {
                        this.killCount++;
                        this.score += titan.def.score;
                        if (titan.isAberrant) this.score = Math.floor(this.score * 1.5);
                    }
                    break;
                }
            }
        }
    }

    _performSpinSlash() {
        // Levi spin slash — hit all nearby titans
        this._consumeBlade(25);
        const range = 80 * DPR;
        if (this.scene.titans) {
            for (let i = 0; i < this.scene.titans.length; i++) {
                const titan = this.scene.titans[i];
                if (titan.isDead) continue;
                const d = dist(this.x, this.y, titan.x, titan.y);
                if (d < range) {
                    titan.takeNapeDamage(this.charDef.bladeStrength * 3);
                    this.scene.spawnEffect('blood_burst', titan.x, titan.y - titan.height * 0.8);
                    if (titan.isDead) {
                        this.killCount++;
                        this.score += titan.def.score;
                    }
                }
            }
        }
        this.scene.cameras.main.shake(150, 0.015);
        // Spawn multiple slash arcs
        for (let a = 0; a < 4; a++) {
            this.scene.spawnEffect('slash', this.x + Math.cos(a * 1.57) * 20 * DPR, this.y - 16 * DPR + Math.sin(a * 1.57) * 20 * DPR, 1);
        }
    }

    _calculateApproachAngle(titan) {
        const dx = this.x - titan.x;
        const behindSide = (titan.facing > 0 && dx < 0) || (titan.facing < 0 && dx > 0);
        if (behindSide) return { name: 'behind', multiplier: 1.0 };

        const absDx = Math.abs(dx);
        if (absDx > titan.width * 0.3) return { name: 'side', multiplier: 0.75 };
        return { name: 'front', multiplier: 0.1 };
    }

    _trySpecial() {
        if (this.specialCharges <= 0) return;
        if (this.charId === 'levi' && (this.bladeDurability <= 0 && this.bladeSets <= 0)) return;
        this.specialCharges--;
        this.sm.changeState('SPECIAL');
    }

    _spawnGasParticle() {
        this.gasParticles.push({
            x: this.x - this.facing * 4 * DPR + randFloat(-3, 3) * DPR,
            y: this.y - 10 * DPR + randFloat(-3, 3) * DPR,
            vx: -this.vx * 0.3 + randFloat(-0.5, 0.5) * DPR,
            vy: randFloat(-0.5, 0.5) * DPR,
            life: randInt(8, 14),
            maxLife: 14,
        });
    }

    takeDamage(amount) {
        if (this.isInvulnerable || this.isDead) return;
        this.health -= amount;
        this.damageTaken += amount;
        this.scene.cameras.main.shake(100, 0.01);

        if (this.health <= 0) {
            this.health = 0;
            this.sm.changeState('DEAD');
        } else {
            this.sm.changeState('HIT_STUN');
        }
    }

    resupply(gasAmt, bladeAmt) {
        this.gas = Math.min(100, this.gas + gasAmt);
        this.bladeDurability = Math.min(100, this.bladeDurability + bladeAmt);
        if (this.bladeSets < 8) this.bladeSets = Math.min(8, this.bladeSets + 4);
    }

    updateLockOn() {
        if (this.keys.lockOn.isDown && this.scene.titans) {
            let nearest = null;
            let nearDist = 999999;
            for (let i = 0; i < this.scene.titans.length; i++) {
                const t = this.scene.titans[i];
                if (t.isDead) continue;
                const d = dist(this.x, this.y, t.x, t.y);
                if (d < nearDist) {
                    nearDist = d;
                    nearest = t;
                }
            }
            this.lockedTarget = nearest;
        } else {
            this.lockedTarget = null;
        }
    }

    update(dt) {
        if (this.isDead) return;
        this.dt = dt; // store for helper methods

        if (this.hitStopFrames > 0) {
            this.hitStopFrames -= dt;
            return;
        }

        // Lock-on
        this.updateLockOn();

        // Save previous position
        this.prevX = this.x;
        this.prevY = this.y;

        // State machine
        this.sm.update(dt);

        // Auto-refill gas while grounded
        this._refillGas(dt);
        // Apply velocity with dt (grapple sets position directly)
        if (!this.isGrappled) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
        }

        // Tilemap collision
        if (this.scene.stage) {
            this.scene.stage.resolveCollision(this);
        }

        // Invulnerability timer
        if (this.invulnerableTimer > 0) {
            this.invulnerableTimer -= dt;
            this.flashTimer += dt;
            if (this.invulnerableTimer <= 0) {
                this.isInvulnerable = false;
                this.sprite.setAlpha(1);
            }
        }

        // Supply station check
        if (this.scene.stage) {
            this.scene.stage.checkSupplyStations(this);
        }

        // Update gas particles
        for (let i = this.gasParticles.length - 1; i >= 0; i--) {
            const p = this.gasParticles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) {
                this.gasParticles.splice(i, 1);
            }
        }

        // Update sprite
        this.sprite.x = this.x;
        this.sprite.y = this.y;
        this.sprite.setFlipX(this.facing < 0);

        // Invulnerability flash
        if (this.isInvulnerable) {
            this.sprite.setAlpha(this.flashTimer % 4 < 2 ? 0.3 : 1);
        }
    }

    render() {
        // Draw grapple line
        this.grappleLine.clear();
        if (this.grappleTarget && (this.isGrappled || this.sm.isInState('GRAPPLE_FIRE'))) {
            this.grappleLine.lineStyle(2 * DPR, COLORS.BLADE_STEEL, 1);
            this.grappleLine.beginPath();
            this.grappleLine.moveTo(this.x, this.y - this.height / 2);
            this.grappleLine.lineTo(this.grappleTarget.x, this.grappleTarget.y);
            this.grappleLine.strokePath();

            // Glint effect
            const t = (Date.now() % 500) / 500;
            const gx = lerp(this.x, this.grappleTarget.x, t);
            const gy = lerp(this.y - this.height / 2, this.grappleTarget.y, t);
            this.grappleLine.fillStyle(0xFFFFFF, 0.9);
            this.grappleLine.fillCircle(gx, gy, 2 * DPR);
        }

        // Draw gas particles
        for (let i = 0; i < this.gasParticles.length; i++) {
            const p = this.gasParticles[i];
            const alpha = p.life / p.maxLife;
            this.grappleLine.fillStyle(0xFFFFFF, alpha * 0.5);
            this.grappleLine.fillCircle(p.x, p.y, (2 + alpha) * DPR);
        }

        // Draw lock-on reticle
        if (this.lockedTarget && !this.lockedTarget.isDead) {
            const nape = this.lockedTarget.getNapeBounds();
            const cx = nape.x + nape.w / 2;
            const cy = nape.y + nape.h / 2;
            const pulse = Math.sin(Date.now() * 0.01) * 3 * DPR;
            this.grappleLine.lineStyle(2 * DPR, COLORS.NAPE_RED, 0.8);
            this.grappleLine.strokeRect(cx - 8 * DPR - pulse, cy - 8 * DPR - pulse, 16 * DPR + pulse * 2, 16 * DPR + pulse * 2);
        }
    }

    destroy() {
        this.sprite.destroy();
        this.grappleLine.destroy();
    }
}
// ---- TITAN CLASS ----
class Titan {
    constructor(scene, x, y, className, isAberrant) {
        this.scene = scene;
        this.def = TITAN_DEFS[className];
        this.className = className;
        this.isAberrant = isAberrant || false;

        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.width = this.def.width;
        this.height = this.def.height;
        this.facing = Math.random() > 0.5 ? 1 : -1;

        this.napeHealth = this.def.napeHealth;
        this.napeMaxHealth = this.def.napeHealth;
        this.isDead = false;
        this.deathTimer = 0;
        this.isGrounded = true;

        this.targetEntity = null;
        this.wanderDir = this.facing;
        this.wanderTimer = randInt(60, 180);
        this.attackCooldown = 0;
        this.grabbing = null; // player being held
        this.grabTimer = 0;
        this.staggerTimer = 0;

        // Aberrant speed modifier
        this.speedMul = isAberrant ? 1.6 : 1.0;

        // Sprite (texture already generated at DPR-scaled dimensions)
        this.sprite = scene.add.image(x, y, 'titan_' + className);
        this.sprite.setOrigin(0.5, 1);
        this.sprite.setDepth(40);
        if (isAberrant) {
            this.sprite.setTint(0xFFBBBB);
        }

        // Nape flash
        this.napeFlash = scene.add.rectangle(0, 0, 0, 0, COLORS.NAPE_RED);
        this.napeFlash.setDepth(41);
        this.napeFlash.setAlpha(0);

        // Steam particles for death
        this.steamParticles = [];

        // State machine
        this.sm = new StateMachine(this);
        this._initStates();
        this.sm.changeState('WANDER');
    }

    _initStates() {
        const self = this;

        this.sm.addState('WANDER', {
            enter() {
                self.wanderDir = Math.random() > 0.5 ? 1 : -1;
                self.wanderTimer = randInt(90, 240);
            },
            execute(dt) {
                self.wanderTimer--;
                self.vx = self.wanderDir * self.def.speed * 0.5 * self.speedMul;
                self.facing = self.wanderDir;

                if (self.wanderTimer <= 0) {
                    self.wanderDir *= -1;
                    self.wanderTimer = randInt(90, 240);
                }

                // Check for player in detection radius
                const player = self._findNearestPlayer();
                if (player) {
                    const d = dist(self.x, self.y, player.x, player.y);
                    if (d < self.def.detectRadius) {
                        self.targetEntity = player;
                        self.sm.changeState('PURSUE');
                    }
                }
            },
            exit() {}
        });

        this.sm.addState('PURSUE', {
            enter() {},
            execute(dt) {
                if (!self.targetEntity || self.targetEntity.isDead) {
                    self.sm.changeState('WANDER');
                    return;
                }

                const player = self.targetEntity;
                const d = dist(self.x, self.y, player.x, player.y);

                // Lost interest
                if (d > self.def.detectRadius * 1.5) {
                    self.targetEntity = null;
                    self.sm.changeState('WANDER');
                    return;
                }

                // Move toward player
                if (player.x < self.x - 5) {
                    self.vx = -self.def.speed * self.speedMul;
                    self.facing = -1;
                } else if (player.x > self.x + 5) {
                    self.vx = self.def.speed * self.speedMul;
                    self.facing = 1;
                } else {
                    self.vx = 0;
                }

                // Attempt grab if player is close and low enough
                if (d < self.def.grabRange && self.attackCooldown <= 0) {
                    if (player.y > self.y - self.height * 0.9) {
                        self.sm.changeState('GRAB_ATTEMPT');
                        return;
                    }
                }

                // Swipe if player is in mid-range and airborne (10m+ only)
                if (self.className !== '3m' && d < self.def.grabRange * 1.5 && self.attackCooldown <= 0) {
                    if (player.y < self.y - self.height * 0.5) {
                        self.sm.changeState('SWIPE');
                        return;
                    }
                }
            },
            exit() {}
        });

        this.sm.addState('GRAB_ATTEMPT', {
            enter() {
                self.vx = 0;
                self.attackCooldown = 60;
            },
            execute(dt) {
                // Wind-up (10 frames)
                if (this.elapsed < 10) return;

                // Active grab window (frame 10-16)
                if (this.elapsed >= 10 && this.elapsed <= 16) {
                    const player = self.targetEntity;
                    if (player && !player.isDead && !player.isInvulnerable) {
                        const d = dist(self.x, self.y, player.x, player.y);
                        if (d < self.def.grabRange * 1.2 && player.y > self.y - self.height * 0.9) {
                            // Grabbed!
                            self.grabbing = player;
                            self.sm.changeState('HOLDING');
                            return;
                        }
                    }
                }

                // Recovery
                if (this.elapsed > 24) {
                    self.sm.changeState('PURSUE');
                }
            },
            exit() {}
        });

        this.sm.addState('HOLDING', {
            enter() {
                self.grabTimer = 0;
                if (self.grabbing) {
                    self.grabbing.sm.changeState('GRABBED');
                }
            },
            execute(dt) {
                self.grabTimer++;

                if (self.grabbing) {
                    // Hold player at hand position
                    self.grabbing.x = self.x + self.facing * self.width * 0.4;
                    self.grabbing.y = self.y - self.height * 0.5;
                }

                // Player escaped?
                if (self.grabbing && !self.grabbing.sm.isInState('GRABBED')) {
                    self.grabbing = null;
                    self.sm.changeState('PURSUE');
                    return;
                }

                // Bite / crush after holding too long
                if (self.grabTimer > 60) {
                    if (self.grabbing) {
                        self.grabbing.takeDamage(self.def.damage);
                    }
                    self.grabbing = null;
                    self.sm.changeState('PURSUE');
                }
            },
            exit() {
                self.grabbing = null;
            }
        });

        this.sm.addState('SWIPE', {
            enter() {
                self.vx = 0;
                self.attackCooldown = 45;
            },
            execute(dt) {
                // Wind-up
                if (this.elapsed < 12) return;

                // Active hitbox (frame 12-18)
                if (this.elapsed >= 12 && this.elapsed <= 18) {
                    const player = self.targetEntity;
                    if (player && !player.isDead && !player.isInvulnerable) {
                        const swipeBounds = {
                            x: self.x - self.width,
                            y: self.y - self.height,
                            w: self.width * 2,
                            h: self.height * 0.6
                        };
                        const playerBounds = {
                            x: player.x - player.width / 2,
                            y: player.y - player.height,
                            w: player.width,
                            h: player.height
                        };
                        if (rectOverlap(swipeBounds, playerBounds)) {
                            player.takeDamage(self.def.damage);
                        }
                    }
                }

                if (this.elapsed > 30) {
                    self.sm.changeState('PURSUE');
                }
            },
            exit() {}
        });

        this.sm.addState('STAGGER', {
            enter() {
                self.vx = -self.facing * 1;
                self.staggerTimer = 30;
            },
            execute(dt) {
                self.staggerTimer--;
                self.vx *= Math.pow(0.95, dt);
                if (self.staggerTimer <= 0) {
                    self.sm.changeState('PURSUE');
                }
            },
            exit() {}
        });

        this.sm.addState('DYING', {
            enter() {
                self.isDead = true;
                self.vx = 0;
                self.deathTimer = 0;
                self.sprite.setTint(0xFFDDDD);
            },
            execute(dt) {
                self.deathTimer++;

                // Steam particles
                if (self.deathTimer % 3 === 0) {
                    self.steamParticles.push({
                        x: self.x + randFloat(-self.width / 2, self.width / 2),
                        y: self.y - randFloat(0, self.height),
                        vy: randFloat(-1.5, -0.5) * DPR,
                        vx: randFloat(-0.3, 0.3) * DPR,
                        life: randInt(20, 40),
                        maxLife: 40,
                        size: randFloat(4, 10) * DPR,
                    });
                }

                // Fade out
                const alpha = 1 - (self.deathTimer / 90);
                self.sprite.setAlpha(Math.max(0, alpha));

                if (self.deathTimer > 90) {
                    self._destroy();
                }
            },
            exit() {}
        });
    }

    _findNearestPlayer() {
        if (!this.scene.player) return null;
        if (this.scene.player.isDead) return null;
        return this.scene.player;
    }

    getNapeBounds() {
        const napeW = Math.max(12, this.width * 0.45);
        const napeH = Math.max(10, this.height * 0.15);
        return {
            x: this.x - napeW / 2,
            y: this.y - this.height + this.height * 0.03,
            w: napeW,
            h: napeH,
        };
    }

    getBodyBounds() {
        return {
            x: this.x - this.width / 2,
            y: this.y - this.height,
            w: this.width,
            h: this.height,
        };
    }

    takeNapeDamage(amount) {
        if (this.isDead) return;
        this.napeHealth -= amount;
        this.scene.cameras.main.shake(50, 0.005);

        if (this.napeHealth <= 0) {
            this.sm.changeState('DYING');
        } else {
            // Flash red
            this.sprite.setTint(0xFF8888);
            this.scene.time.delayedCall(100, () => {
                if (!this.isDead) {
                    this.sprite.clearTint();
                    if (this.isAberrant) this.sprite.setTint(0xFFBBBB);
                }
            });
        }
    }

    update(dt) {
        if (this.attackCooldown > 0) this.attackCooldown -= dt;

        this.sm.update(dt);

        // Apply gravity
        if (!this.isGrounded) {
            this.vy += GRAVITY * dt;
            if (this.vy > TERMINAL_VELOCITY) this.vy = TERMINAL_VELOCITY;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Ground check
        if (this.scene.stage) {
            this.scene.stage.resolveTitanCollision(this);
        }

        // Update sprite
        this.sprite.x = this.x;
        this.sprite.y = this.y;
        this.sprite.setFlipX(this.facing < 0);

        // Nape flash indicator
        if (!this.isDead) {
            const nape = this.getNapeBounds();
            this.napeFlash.x = nape.x + nape.w / 2;
            this.napeFlash.y = nape.y + nape.h / 2;
            this.napeFlash.width = nape.w;
            this.napeFlash.height = nape.h;
            const flashCycle = Math.sin(Date.now() * 0.008);
            this.napeFlash.setAlpha(flashCycle > 0 ? 0.6 : 0.2);
        } else {
            this.napeFlash.setAlpha(0);
        }

        // Update steam particles
        for (let i = this.steamParticles.length - 1; i >= 0; i--) {
            const p = this.steamParticles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) {
                this.steamParticles.splice(i, 1);
            }
        }

        // Contact damage to player (if player walks into titan body)
        if (!this.isDead && this.scene.player && !this.scene.player.isDead && !this.scene.player.isInvulnerable) {
            const p = this.scene.player;
            const bodyBounds = {
                x: this.x - this.width * 0.4,
                y: this.y - this.height,
                w: this.width * 0.8,
                h: this.height
            };
            const playerBounds = {
                x: p.x - p.width / 2,
                y: p.y - p.height,
                w: p.width,
                h: p.height
            };
            if (rectOverlap(bodyBounds, playerBounds) && p.isGrounded && !p.sm.isInState('GRABBED')) {
                // Only grab, don't damage on contact
                if (this.sm.isInState('PURSUE') && this.attackCooldown <= 0) {
                    this.targetEntity = p;
                    this.sm.changeState('GRAB_ATTEMPT');
                }
            }
        }
    }

    render(graphics) {
        // Draw steam particles
        for (let i = 0; i < this.steamParticles.length; i++) {
            const p = this.steamParticles[i];
            const alpha = (p.life / p.maxLife) * 0.5;
            graphics.fillStyle(COLORS.STEAM_WHITE, alpha);
            graphics.fillCircle(p.x, p.y, p.size * (p.life / p.maxLife));
        }

        // Draw grab indicator
        if (this.sm.isInState('GRAB_ATTEMPT')) {
            const progress = this.sm.currentState.elapsed / 10;
            if (progress < 1) {
                graphics.lineStyle(2, 0xFF0000, 0.5);
                graphics.strokeCircle(this.x, this.y - this.height * 0.5, this.def.grabRange * progress);
            }
        }
    }

    _destroy() {
        this.sprite.destroy();
        this.napeFlash.destroy();
    }
}
// ---- STAGE / LEVEL CLASS ----
class Stage {
    constructor(scene, stageConfig) {
        this.scene = scene;
        this.config = stageConfig;
        this.worldWidth = stageConfig.worldWidth || 3200;
        this.worldHeight = stageConfig.worldHeight || 800;
        this.tilesX = Math.ceil(this.worldWidth / TILE_SIZE);
        this.tilesY = Math.ceil(this.worldHeight / TILE_SIZE);

        // Tile grid: 0=empty, 1=ground, 2=building, 3=roof, 4=wall
        this.tiles = [];
        for (let i = 0; i < this.tilesX * this.tilesY; i++) {
            this.tiles.push(0);
        }

        // Anchor points (grapple targets) - computed from building tops and roof edges
        this.anchors = [];

        // Supply stations
        this.supplyStations = [];

        // Tile sprites container
        this.tileContainer = scene.add.container(0, 0);
        this.tileContainer.setDepth(10);

        // Background layers
        this.bgContainer = scene.add.container(0, 0);
        this.bgContainer.setDepth(1);

        // Generate the level
        this._generate();
    }

    _setTile(tx, ty, val) {
        if (tx < 0 || tx >= this.tilesX || ty < 0 || ty >= this.tilesY) return;
        this.tiles[ty * this.tilesX + tx] = val;
    }

    _getTile(tx, ty) {
        if (tx < 0 || tx >= this.tilesX || ty < 0 || ty >= this.tilesY) return 0;
        return this.tiles[ty * this.tilesX + tx];
    }

    _generate() {
        const groundY = this.tilesY - 2; // 2 tiles of ground at bottom

        // Ground layer
        for (let x = 0; x < this.tilesX; x++) {
            this._setTile(x, groundY, 1);
            this._setTile(x, groundY + 1, 1);
        }

        // Generate buildings — short near spawn, taller further in
        const buildings = [];
        let bx = 10; // Leave clear spawn zone (tiles 0-9 are open ground)
        let buildingIndex = 0;
        while (bx < this.tilesX - 5) {
            const bWidth = randInt(3, 5);
            const gap = randInt(4, 7);

            // Progressive height: first few buildings are very short (easy to reach)
            let minH, maxH;
            if (buildingIndex < 3) {
                minH = 2; maxH = 3;  // Very short starter buildings
            } else if (buildingIndex < 8) {
                minH = 3; maxH = 5;  // Medium
            } else {
                minH = 3; maxH = 7;  // Taller further in
            }
            const bHeight = randInt(minH, maxH);

            // Don't build beyond world
            if (bx + bWidth >= this.tilesX - 2) break;

            buildings.push({
                x: bx,
                y: groundY - bHeight,
                w: bWidth,
                h: bHeight,
            });

            // Fill building tiles
            for (let by = groundY - bHeight; by < groundY; by++) {
                for (let bxx = bx; bxx < bx + bWidth; bxx++) {
                    this._setTile(bxx, by, 2);
                }
            }

            // Roof
            for (let bxx = bx; bxx < bx + bWidth; bxx++) {
                this._setTile(bxx, groundY - bHeight - 1, 3);
            }

            // Anchor points at roof center and both edges
            this.anchors.push({
                x: (bx + bWidth / 2) * TILE_SIZE,
                y: (groundY - bHeight - 1) * TILE_SIZE,
            });
            this.anchors.push({
                x: bx * TILE_SIZE,
                y: (groundY - bHeight) * TILE_SIZE,
            });
            this.anchors.push({
                x: (bx + bWidth) * TILE_SIZE,
                y: (groundY - bHeight) * TILE_SIZE,
            });

            // No floating anchors — grapple only attaches to structures

            bx += bWidth + gap;
            buildingIndex++;
        }

        // Add wall segments at the start and end
        const wallHeight = 8;
        // Left wall (shorter, climbable)
        for (let wy = groundY - wallHeight; wy < groundY; wy++) {
            this._setTile(0, wy, 4);
            this._setTile(1, wy, 4);
        }
        this.anchors.push({ x: TILE_SIZE, y: (groundY - wallHeight) * TILE_SIZE });

        // Right wall
        for (let wy = groundY - wallHeight; wy < groundY; wy++) {
            this._setTile(this.tilesX - 1, wy, 4);
            this._setTile(this.tilesX - 2, wy, 4);
        }
        this.anchors.push({ x: (this.tilesX - 1) * TILE_SIZE, y: (groundY - wallHeight) * TILE_SIZE });

        // No floating sky anchors — grapple only works on structures

        // Place supply stations — one on every 3rd building
        const supplyInterval = 3;
        for (let i = 0; i < buildings.length; i++) {
            if (i % supplyInterval === 1) {
                const bld = buildings[i];
                this.supplyStations.push({
                    x: (bld.x + bld.w / 2) * TILE_SIZE,
                    y: bld.y * TILE_SIZE,
                    usesLeft: 2,
                    sprite: null,
                });
            }
        }

        // Render tiles
        this._renderTiles();
        this._renderBackground();
        this._renderSupplyStations();
    }

    _renderTiles() {
        for (let ty = 0; ty < this.tilesY; ty++) {
            for (let tx = 0; tx < this.tilesX; tx++) {
                const tile = this._getTile(tx, ty);
                if (tile === 0) continue;

                let textureKey = 'ground';
                if (tile === 2) {
                    // Alternate between windowed and solid building tiles
                    textureKey = ((tx + ty) % 3 === 0) ? 'building' : 'building_solid';
                }
                else if (tile === 3) textureKey = 'roof';
                else if (tile === 4) textureKey = 'wall';

                const img = this.scene.add.image(
                    tx * TILE_SIZE + TILE_SIZE / 2,
                    ty * TILE_SIZE + TILE_SIZE / 2,
                    textureKey
                );
                this.tileContainer.add(img);
            }
        }
    }

    _renderBackground() {
        // Sky gradient
        const skyGfx = this.scene.add.graphics();
        skyGfx.fillGradientStyle(COLORS.SKY_TOP, COLORS.SKY_TOP, COLORS.SKY_BLUE, COLORS.SKY_BLUE);
        skyGfx.fillRect(0, 0, this.worldWidth, this.worldHeight);
        this.bgContainer.add(skyGfx);

        // Distant buildings (parallax layer - drawn as simple shapes)
        const distGfx = this.scene.add.graphics();
        distGfx.setAlpha(0.3);
        for (let i = 0; i < 30; i++) {
            const dx = i * 120 + randInt(-20, 20);
            const dh = randInt(60, 180);
            const dw = randInt(30, 60);
            distGfx.fillStyle(0x6A5A4A);
            distGfx.fillRect(dx, this.worldHeight - 64 - dh, dw, dh);
        }
        this.bgContainer.add(distGfx);

        // Clouds
        const cloudGfx = this.scene.add.graphics();
        cloudGfx.setAlpha(0.5);
        for (let i = 0; i < 10; i++) {
            const cx = randInt(0, this.worldWidth);
            const cy = randInt(20, 120);
            cloudGfx.fillStyle(0xFFFFFF);
            cloudGfx.fillEllipse(cx, cy, randInt(60, 150), randInt(20, 40));
        }
        this.bgContainer.add(cloudGfx);
    }

    _renderSupplyStations() {
        for (let i = 0; i < this.supplyStations.length; i++) {
            const ss = this.supplyStations[i];
            ss.sprite = this.scene.add.image(ss.x, ss.y, 'supply').setScale(DPR);
            ss.sprite.setOrigin(0.5, 1);
            ss.sprite.setDepth(35);
        }
    }

    isSolid(tx, ty) {
        const tile = this._getTile(tx, ty);
        return tile === 1 || tile === 2 || tile === 3 || tile === 4;
    }

    checkGrounded(entity) {
        const footTileX = Math.floor(entity.x / TILE_SIZE);
        const footTileY = Math.floor(entity.y / TILE_SIZE);

        // Check the tile just below the feet
        if (this.isSolid(footTileX, footTileY)) {
            entity.y = footTileY * TILE_SIZE;
            entity.vy = 0;
            entity.isGrounded = true;
            return true;
        }

        // Also check slightly to the left and right for edge cases
        const leftTileX = Math.floor((entity.x - entity.width * 0.3) / TILE_SIZE);
        const rightTileX = Math.floor((entity.x + entity.width * 0.3) / TILE_SIZE);

        if (this.isSolid(leftTileX, footTileY) || this.isSolid(rightTileX, footTileY)) {
            entity.y = footTileY * TILE_SIZE;
            entity.vy = 0;
            entity.isGrounded = true;
            return true;
        }

        entity.isGrounded = false;
        return false;
    }

    resolveCollision(entity) {
        // X-axis collision
        const headTileY = Math.floor((entity.y - entity.height) / TILE_SIZE);
        const midTileY = Math.floor((entity.y - entity.height / 2) / TILE_SIZE);
        const leftEdge = Math.floor((entity.x - entity.width / 2) / TILE_SIZE);
        const rightEdge = Math.floor((entity.x + entity.width / 2) / TILE_SIZE);

        // Left wall
        if (this.isSolid(leftEdge, midTileY) || this.isSolid(leftEdge, headTileY)) {
            entity.x = (leftEdge + 1) * TILE_SIZE + entity.width / 2;
            entity.vx = 0;
        }

        // Right wall
        if (this.isSolid(rightEdge, midTileY) || this.isSolid(rightEdge, headTileY)) {
            entity.x = rightEdge * TILE_SIZE - entity.width / 2;
            entity.vx = 0;
        }

        // Ceiling
        const headTileX = Math.floor(entity.x / TILE_SIZE);
        const headTileYAbove = Math.floor((entity.y - entity.height - 2) / TILE_SIZE);
        if (this.isSolid(headTileX, headTileYAbove) && entity.vy < 0) {
            entity.y = (headTileYAbove + 1) * TILE_SIZE + entity.height;
            entity.vy = 0;
        }

        // Ground
        this.checkGrounded(entity);

        // World bounds
        entity.x = clamp(entity.x, entity.width / 2, this.worldWidth - entity.width / 2);
    }

    resolveTitanCollision(titan) {
        // Simple ground check for titans
        const footTileY = Math.floor(titan.y / TILE_SIZE);
        const footTileX = Math.floor(titan.x / TILE_SIZE);

        if (this.isSolid(footTileX, footTileY)) {
            titan.y = footTileY * TILE_SIZE;
            titan.vy = 0;
            titan.isGrounded = true;
        } else {
            titan.isGrounded = false;
        }

        // World bounds
        titan.x = clamp(titan.x, titan.width, this.worldWidth - titan.width);

        // Don't walk through buildings (simple version - just block at edges)
        const bodyTileY = Math.floor((titan.y - titan.height * 0.5) / TILE_SIZE);
        const leftTileX = Math.floor((titan.x - titan.width * 0.5) / TILE_SIZE);
        const rightTileX = Math.floor((titan.x + titan.width * 0.5) / TILE_SIZE);

        if (this.isSolid(leftTileX, bodyTileY) && this._getTile(leftTileX, bodyTileY) === 2) {
            titan.x = (leftTileX + 1) * TILE_SIZE + titan.width * 0.5;
            titan.vx *= -1;
            titan.facing *= -1;
        }
        if (this.isSolid(rightTileX, bodyTileY) && this._getTile(rightTileX, bodyTileY) === 2) {
            titan.x = rightTileX * TILE_SIZE - titan.width * 0.5;
            titan.vx *= -1;
            titan.facing *= -1;
        }
    }

    findAnchor(fromX, fromY, dirX, dirY, maxRange) {
        let bestAnchor = null;
        let bestScore = -Infinity;

        for (let i = 0; i < this.anchors.length; i++) {
            const a = this.anchors[i];
            const d = dist(fromX, fromY, a.x, a.y);
            if (d > maxRange || d < 20) continue;

            // Anchor must be above or at same height (can't grapple downward much)
            if (a.y > fromY + 30) continue;

            // Direction score: how well does this anchor match the desired direction?
            const toX = a.x - fromX;
            const toY = a.y - fromY;
            const toLen = Math.sqrt(toX * toX + toY * toY);
            const normToX = toX / toLen;
            const normToY = toY / toLen;

            const dirLen = Math.sqrt(dirX * dirX + dirY * dirY);
            const normDirX = dirX / dirLen;
            const normDirY = dirY / dirLen;

            const dotProduct = normToX * normDirX + normToY * normDirY;

            // Score: direction alignment - distance penalty
            const score = dotProduct * 100 - d * 0.2;

            if (score > bestScore) {
                bestScore = score;
                bestAnchor = { x: a.x, y: a.y };
            }
        }

        return bestAnchor;
    }

    checkSupplyStations(player) {
        for (let i = 0; i < this.supplyStations.length; i++) {
            const ss = this.supplyStations[i];
            if (ss.usesLeft <= 0) continue;

            const d = dist(player.x, player.y, ss.x, ss.y);
            if (d < 40 * DPR && player.isGrounded) {
                if (player.gas < 100 || player.bladeDurability < 100) {
                    player.resupply(50, 50);
                    ss.usesLeft--;
                    if (ss.usesLeft <= 0 && ss.sprite) {
                        ss.sprite.setTint(0x666666);
                    }
                    // Visual feedback
                    this.scene.cameras.main.flash(100, 100, 255, 100);
                }
            }
        }
    }

    getTitanSpawnPoints(count) {
        const points = [];
        const groundY = (this.tilesY - 2) * TILE_SIZE;
        const spacing = this.worldWidth / (count + 1);

        for (let i = 0; i < count; i++) {
            const sx = spacing * (i + 1) + randFloat(-50, 50);
            points.push({ x: sx, y: groundY });
        }
        return points;
    }

    destroy() {
        this.tileContainer.destroy(true);
        this.bgContainer.destroy(true);
        for (let i = 0; i < this.supplyStations.length; i++) {
            if (this.supplyStations[i].sprite) {
                this.supplyStations[i].sprite.destroy();
            }
        }
    }
}
// ---- CUTSCENE SYSTEM ----
class Cutscene {
    constructor(scene) {
        this.scene = scene;
        this.active = false;
        this.beats = [];
        this.currentBeat = 0;
        this.beatTimer = 0;
        this.barHeight = 0;
        this.targetBarHeight = GAME_HEIGHT * 0.12;
        this.onComplete = null;
        this.container = scene.add.container(0, 0);
        this.container.setDepth(200);
        this.container.setScrollFactor(0);
        this.container.setVisible(false);

        // Top & bottom letterbox bars
        this.topBar = scene.add.rectangle(GAME_WIDTH / 2, 0, GAME_WIDTH, 1, 0x000000);
        this.topBar.setOrigin(0.5, 0);
        this.container.add(this.topBar);

        this.botBar = scene.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT, GAME_WIDTH, 1, 0x000000);
        this.botBar.setOrigin(0.5, 1);
        this.container.add(this.botBar);

        // Speaker name
        this.speakerText = scene.add.text(sz(30), GAME_HEIGHT - 1, '', {
            fontSize: fs(11), fontFamily: 'monospace', color: '#FFCC00', fontStyle: 'bold',
        }).setOrigin(0, 1);
        this.container.add(this.speakerText);

        // Dialogue text
        this.dialogText = scene.add.text(sz(30), GAME_HEIGHT - 1, '', {
            fontSize: fs(10), fontFamily: 'monospace', color: '#FFFFFF',
            wordWrap: { width: GAME_WIDTH - sz(60) },
        }).setOrigin(0, 1);
        this.container.add(this.dialogText);

        // Text reveal state
        this.fullText = '';
        this.revealedChars = 0;
        this.revealSpeed = 0.8; // chars per frame-tick
    }

    play(beats, onComplete) {
        this.beats = beats;
        this.currentBeat = -1;
        this.onComplete = onComplete;
        this.active = true;
        this.barHeight = 0;
        this.phase = 'bars_in'; // bars_in → playing → bars_out
        this.container.setVisible(true);
        this.scene.cameras.main.stopFollow();
    }

    _startBeat(index) {
        this.currentBeat = index;
        const beat = this.beats[index];
        this.beatTimer = 0;

        // Camera pan
        if (beat.camX !== undefined && beat.camY !== undefined) {
            this.scene.tweens.add({
                targets: this.scene.cameras.main,
                scrollX: beat.camX - GAME_WIDTH / 2,
                scrollY: beat.camY - GAME_HEIGHT / 2,
                duration: beat.panDuration || 1500,
                ease: 'Sine.easeInOut',
            });
        }

        // Text
        this.speakerText.setText(beat.speaker || '');
        this.fullText = beat.text || '';
        this.revealedChars = 0;
        this.dialogText.setText('');
    }

    update(dt) {
        if (!this.active) return;

        if (this.phase === 'bars_in') {
            this.barHeight = Math.min(this.barHeight + 2 * S * dt, this.targetBarHeight);
            this._updateBars();
            if (this.barHeight >= this.targetBarHeight) {
                this.phase = 'playing';
                this._startBeat(0);
            }
            return;
        }

        if (this.phase === 'bars_out') {
            this.barHeight = Math.max(this.barHeight - 2 * S * dt, 0);
            this._updateBars();
            if (this.barHeight <= 0) {
                this.active = false;
                this.container.setVisible(false);
                if (this.onComplete) this.onComplete();
            }
            return;
        }

        // Playing beats
        const beat = this.beats[this.currentBeat];
        this.beatTimer += dt;

        // Text reveal
        if (this.revealedChars < this.fullText.length) {
            this.revealedChars = Math.min(this.revealedChars + this.revealSpeed * dt, this.fullText.length);
            this.dialogText.setText(this.fullText.substring(0, Math.floor(this.revealedChars)));
        }

        // Beat duration (in dt-ticks, ~60 = 1 second)
        const duration = beat.duration || 180;
        if (this.beatTimer >= duration) {
            if (this.currentBeat < this.beats.length - 1) {
                this._startBeat(this.currentBeat + 1);
            } else {
                this.phase = 'bars_out';
            }
        }
    }

    _updateBars() {
        this.topBar.setSize(GAME_WIDTH, this.barHeight);
        this.botBar.setSize(GAME_WIDTH, this.barHeight);
        this.botBar.setPosition(GAME_WIDTH / 2, GAME_HEIGHT);

        // Position text inside bottom bar
        const textY = GAME_HEIGHT - this.barHeight * 0.15;
        this.speakerText.setPosition(sz(30), textY - sz(14));
        this.dialogText.setPosition(sz(30), textY);
    }

    skip() {
        if (!this.active) return;
        // If text is still revealing, finish it instantly
        if (this.revealedChars < this.fullText.length) {
            this.revealedChars = this.fullText.length;
            this.dialogText.setText(this.fullText);
            return;
        }
        // Otherwise skip to next beat or end
        if (this.currentBeat < this.beats.length - 1) {
            this._startBeat(this.currentBeat + 1);
        } else {
            this.phase = 'bars_out';
        }
    }
}

// ---- HUD CLASS ----
class HUD {
    constructor(scene) {
        this.scene = scene;
        this.container = scene.add.container(0, 0);
        this.container.setDepth(100);
        this.container.setScrollFactor(0);

        this.hearts = [];
        this.displayGas = 100;
        this.displayBlade = 100;

        this._build();
    }

    _build() {
        // Background strip at top
        const topBg = this.scene.add.rectangle(GAME_WIDTH / 2, sz(16), GAME_WIDTH, sz(32), COLORS.UI_BG, 0.6);
        this.container.add(topBg);

        // Background strip at bottom
        const botBg = this.scene.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT - sz(20), GAME_WIDTH, sz(40), COLORS.UI_BG, 0.6);
        this.container.add(botBg);

        // --- TOP LEFT: Health ---
        const portraitFrame = this.scene.add.rectangle(sz(24), sz(16), sz(28), sz(28), COLORS.UI_BG, 0.8);

        this.bladeBarBg.setStrokeStyle(sz(1), COLORS.UI_BORDER);

        this.container.add(this.bladeBarFill);

        this.bladeSetText = this.scene.add.text(GAME_WIDTH - sz(48), GAME_HEIGHT - sz(18), 'x8', {
            fontSize: fs(10), fontFamily: 'monospace', color: '#AAAAAA',
        }).setOrigin(0, 0.5);
        this.container.add(this.bladeSetText);

        // --- BOTTOM CENTER: Special Ability ---
        this.specialBg = this.scene.add.rectangle(GAME_WIDTH / 2, GAME_HEIGHT - sz(20), sz(80), sz(24), COLORS.UI_BG, 0.8);
        this.specialBg.setStrokeStyle(sz(1), COLORS.UI_BORDER);
        this.container.add(this.specialBg);

        this.specialText = this.scene.add.text(GAME_WIDTH / 2, GAME_HEIGHT - sz(20), '[A] SPECIAL', {
            fontSize: fs(9), fontFamily: 'monospace', color: '#FFCC00',
        }).setOrigin(0.5);
        this.container.add(this.specialText);

        // --- STATE INDICATOR ---
        this.stateText = this.scene.add.text(GAME_WIDTH / 2, sz(30), '', {
            fontSize: fs(10), fontFamily: 'monospace', color: '#FFFFFF',
        }).setOrigin(0.5).setAlpha(0.6);
        this.container.add(this.stateText);

        // --- CONTROLS HINT ---
        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        const controlsMsg = isMobile
            ? 'D-PAD: Move  |  B: Jump  |  Y: Attack  |  X: Grapple  |  L: Dodge  |  R: Lock-On  |  A: Special'
            : 'ARROWS: Move  |  Z: Jump  |  X: Attack  |  C: Grapple  |  S: Dodge  |  D: Lock-On  |  A: Special';
        this.controlsText = this.scene.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 + sz(100), 
            controlsMsg, {
            fontSize: fs(10), fontFamily: 'monospace', color: '#FFFFFF', backgroundColor: '#000000AA',
            padding: { x: sz(8), y: sz(4) },
        }).setOrigin(0.5).setAlpha(1);
        this.container.add(this.controlsText);

        // Fade out controls after 5 seconds
        this.scene.time.delayedCall(5000, () => {
            this.scene.tweens.add({
                targets: this.controlsText,
                alpha: 0,
                duration: 1000,
            });
        });

        // Message text
        this.messageText = this.scene.add.text(GAME_WIDTH / 2, sz(50), '', {
            fontSize: fs(12), fontFamily: 'monospace', color: '#FFFFFF',
            backgroundColor: '#000000BB', padding: { x: sz(10), y: sz(4) },
            wordWrap: { width: GAME_WIDTH * 0.8 },
        }).setOrigin(0.5, 0).setAlpha(0);
        this.container.add(this.messageText);
    }

    showMessage(speaker, text, duration) {
        const fullText = speaker ? `${speaker}: "${text}"` : text;
        this.messageText.setText(fullText);
        this.messageText.setAlpha(1);
        this.scene.time.delayedCall(duration || 3000, () => {
            this.scene.tweens.add({
                targets: this.messageText,
                alpha: 0,
                duration: 500,
            });
        });
    }

    update(player) {
        if (!player) return;

        // Health hearts
        for (let i = 0; i < 5; i++) {
            this.hearts[i].full.setVisible(i < player.health);
            // Pulse last heart when low
            if (i === player.health - 1 && player.health <= 2) {
                this.hearts[i].full.setScale(0.9 + Math.sin(Date.now() * 0.01) * 0.15);
            }
        }

        // Portrait letter
        this.portraitText.setText(player.charId.charAt(0).toUpperCase());

        // Score
        this.scoreText.setText('SCORE: ' + player.score);
        this.killText.setText('KILLS: ' + player.killCount);

        // Gas meter (smooth interpolation)
        this.displayGas = lerp(this.displayGas, player.gas, 0.15);
        const gasPercent = this.displayGas / 100;
        this.gasBarFill.width = Math.max(0, sz(98) * gasPercent);

        let gasColor = COLORS.GAS_GREEN;
        if (this.displayGas < 30) gasColor = COLORS.GAS_RED;
        else if (this.displayGas < 60) gasColor = COLORS.GAS_YELLOW;
        this.gasBarFill.fillColor = gasColor;
        this.gasText.setText(Math.floor(this.displayGas) + '%');

        // Flash gas bar when empty
        if (player.gas <= 0) {
            this.gasBarBg.setStrokeStyle(1, Math.sin(Date.now() * 0.01) > 0 ? 0xFF0000 : COLORS.UI_BORDER);
        }

        // Blade meter
        this.displayBlade = lerp(this.displayBlade, player.bladeDurability, 0.15);
        const bladePercent = this.displayBlade / 100;
        this.bladeBarFill.width = Math.max(0, sz(98) * bladePercent);

        let bladeColor = COLORS.BLADE_STEEL;
        if (this.displayBlade < 30) bladeColor = COLORS.GAS_RED;
        this.bladeBarFill.fillColor = bladeColor;
        this.bladeSetText.setText('x' + player.bladeSets);

        // Special charges
        if (player.specialCharges > 0 && player.specialCharges < 90) {
            this.specialText.setText('[A] ' + player.charDef.specialName + ' x' + player.specialCharges);
            this.specialText.setColor('#FFCC00');
        } else if (player.specialCharges >= 90) {
            this.specialText.setText('[A] ' + player.charDef.specialName);
            this.specialText.setColor('#FFCC00');
        } else {
            this.specialText.setText(player.charDef.specialName + ' ---');
            this.specialText.setColor('#666666');
        }
    }

    destroy() {
        this.container.destroy(true);
    }
}
