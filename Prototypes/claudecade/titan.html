<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Attack on Titan: SNES Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        /* Game canvas container — fills entire viewport */
        #game-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            width: 100dvw; height: 100dvh;
            z-index: 1;
        }
        #game-container canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
            width: 100dvw !important;
            height: 100dvh !important;
            touch-action: none;
        }

        /* ---- VIRTUAL CONTROLLER ---- */
        #vcontroller {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1000;
            -webkit-tap-highlight-color: transparent;
        }
        #vcontroller.active {
            display: block;
        }

        /* D-Pad */
        .dpad-zone {
            position: absolute;
            bottom: 16px;
            left: 10px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
            touch-action: none;
        }
        .dpad-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(30,30,40,0.5);
            border: 2px solid rgba(100,100,120,0.3);
        }
        .dpad-btn {
            position: absolute;
            background: rgba(160,160,180,0.28);
            border: 1.5px solid rgba(160,160,180,0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.55);
            font-size: 16px;
            font-family: monospace;
            transition: background 0.05s;
            touch-action: none;
            pointer-events: auto;
        }
        .dpad-btn.pressed {
            background: rgba(255,255,255,0.38);
            border-color: rgba(255,255,255,0.5);
        }
        .dpad-up {
            width: 46px; height: 46px;
            top: 2px; left: 50%;
            transform: translateX(-50%);
            border-radius: 10px 10px 4px 4px;
        }
        .dpad-down {
            width: 46px; height: 46px;
            bottom: 2px; left: 50%;
            transform: translateX(-50%);
            border-radius: 4px 4px 10px 10px;
        }
        .dpad-left {
            width: 46px; height: 46px;
            top: 50%; left: 2px;
            transform: translateY(-50%);
            border-radius: 10px 4px 4px 10px;
        }
        .dpad-right {
            width: 46px; height: 46px;
            top: 50%; right: 2px;
            transform: translateY(-50%);
            border-radius: 4px 10px 10px 4px;
        }
        .dpad-center {
            width: 36px; height: 36px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 6px;
            background: rgba(50,50,60,0.35);
            border: 1px solid rgba(80,80,90,0.25);
            pointer-events: none;
        }

        /* Face Buttons */
        .face-zone {
            position: absolute;
            bottom: 16px;
            right: 10px;
            width: 150px;
            height: 150px;
            pointer-events: none;
        }
        .face-btn {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(160,160,180,0.22);
            border: 2px solid rgba(160,160,180,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: auto;
            touch-action: none;
            transition: background 0.05s;
        }
        .face-btn.pressed {
            background: rgba(255,255,255,0.4);
            border-color: rgba(255,255,255,0.55);
        }
        .face-label {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: bold;
            font-family: monospace;
            line-height: 1;
        }
        .face-sub {
            color: rgba(255,255,255,0.35);
            font-size: 7px;
            font-family: monospace;
            line-height: 1;
            margin-top: 1px;
        }
        /* SNES diamond: X top, Y left, A right, B bottom */
        .face-x { top: 0; left: 50%; transform: translateX(-50%);
            background: rgba(50,90,170,0.3); border-color: rgba(70,120,210,0.3); }
        .face-y { top: 50%; left: 0; transform: translateY(-50%);
            background: rgba(50,170,70,0.3); border-color: rgba(70,210,90,0.3); }
        .face-a { top: 50%; right: 0; transform: translateY(-50%);
            background: rgba(170,40,50,0.3); border-color: rgba(210,60,70,0.3); }
        .face-b { bottom: 0; left: 50%; transform: translateX(-50%);
            background: rgba(190,170,40,0.3); border-color: rgba(230,210,60,0.3); }

        /* Shoulder Buttons */
        .shoulder-zone {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 52px;
            pointer-events: none;
            padding: 0 8px;
            padding-top: env(safe-area-inset-top, 4px);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .shoulder-btn {
            width: 64px;
            height: 36px;
            border-radius: 8px;
            background: rgba(100,100,120,0.3);
            border: 1.5px solid rgba(130,130,150,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: auto;
            touch-action: none;
            transition: background 0.05s;
            margin-top: 4px;
        }
        .shoulder-btn.pressed {
            background: rgba(255,255,255,0.35);
            border-color: rgba(255,255,255,0.5);
        }
        .shoulder-label {
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            line-height: 1;
        }
        .shoulder-sub {
            color: rgba(255,255,255,0.3);
            font-size: 6px;
            font-family: monospace;
            line-height: 1;
            margin-top: 1px;
        }

        /* Center Buttons (Start/Select) */
        .center-zone {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: none;
        }
        .center-btn {
            width: 48px;
            height: 22px;
            border-radius: 11px;
            background: rgba(80,80,90,0.35);
            border: 1px solid rgba(120,120,130,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            transition: background 0.05s;
        }
        .center-btn.pressed {
            background: rgba(255,255,255,0.3);
        }
        .center-label {
            color: rgba(255,255,255,0.45);
            font-size: 7px;
            font-family: monospace;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* safe area padding for bottom */
        @supports (padding: env(safe-area-inset-bottom)) {
            .dpad-zone, .face-zone {
                bottom: calc(12px + env(safe-area-inset-bottom));
            }
            .center-zone {
                bottom: calc(2px + env(safe-area-inset-bottom));
            }
        }

        /* Portrait orientation hint */
        #orient-hint {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #AAA;
            font-family: monospace;
        }
        #orient-hint .icon {
            font-size: 48px;
            animation: rotate-hint 1.5s ease-in-out infinite;
        }
        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        #orient-hint .msg {
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }
        #orient-hint .dismiss {
            font-size: 11px;
            color: #666;
            margin-top: 12px;
            cursor: pointer;
        }
        /* Only show on mobile in portrait */
        @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
            #orient-hint { display: flex; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
</head>
<body>

<!-- Game canvas container - full screen -->
<div id="game-container"></div>

<!-- Portrait mode hint -->
<div id="orient-hint">
    <div class="icon">📱</div>
    <div class="msg">Rotate your device to landscape<br>for the best experience</div>
    <div class="dismiss" onclick="document.getElementById('orient-hint').style.display='none'">Tap to dismiss</div>
</div>

<!-- Virtual Controller Overlay -->
<div id="vcontroller">
    <!-- D-Pad -->
    <div class="dpad-zone" id="dpadZone">
        <div class="dpad-bg"></div>
        <div class="dpad-btn dpad-up"    data-key="up">▲</div>
        <div class="dpad-btn dpad-down"  data-key="down">▼</div>
        <div class="dpad-btn dpad-left"  data-key="left">◄</div>
        <div class="dpad-btn dpad-right" data-key="right">►</div>
        <div class="dpad-center"></div>
    </div>

    <!-- Face Buttons (SNES diamond) -->
    <div class="face-zone">
        <div class="face-btn face-x" data-key="grapple">
            <span class="face-label">X</span>
            <span class="face-sub">GRPL</span>
        </div>
        <div class="face-btn face-y" data-key="attack">
            <span class="face-label">Y</span>
            <span class="face-sub">ATK</span>
        </div>
        <div class="face-btn face-a" data-key="special">
            <span class="face-label">A</span>
            <span class="face-sub">SPCL</span>
        </div>
        <div class="face-btn face-b" data-key="jump">
            <span class="face-label">B</span>
            <span class="face-sub">JUMP</span>
        </div>
    </div>

    <!-- Shoulder Buttons -->
    <div class="shoulder-zone">
        <div class="shoulder-btn" data-key="dodge">
            <span class="shoulder-label">L</span>
            <span class="shoulder-sub">DODGE</span>
        </div>
        <div class="shoulder-btn" data-key="lockOn">
            <span class="shoulder-label">R</span>
            <span class="shoulder-sub">LOCK</span>
        </div>
    </div>

    <!-- Start / Select -->
    <div class="center-zone">
        <div class="center-btn" data-key="select">
            <span class="center-label">SELECT</span>
        </div>
        <div class="center-btn" data-key="start">
            <span class="center-label">START</span>
        </div>
    </div>
</div>
<script>
// ============================================================
// ATTACK ON TITAN: WINGS OF FREEDOM — SNES-Style Phaser 3 Game
// ============================================================

// ---- CONSTANTS ----
const DPR = window.devicePixelRatio || 1;
const GAME_WIDTH = Math.floor(window.innerWidth * DPR);
const GAME_HEIGHT = Math.floor(window.innerHeight * DPR);
// Scale factor for UI — keeps elements proportionally sized
const S = Math.min(GAME_WIDTH / 400, GAME_HEIGHT / 300);
function fs(px) { return Math.max(8, Math.round(px * S)) + 'px'; }
function sz(px) { return Math.round(px * S); }
const TILE_SIZE = Math.round(32 * DPR);
const GRAVITY = 0.45 * DPR;
const TERMINAL_VELOCITY = 10 * DPR;
const GRAPPLE_DAMPING = 0.997;
const MAX_GRAPPLE_RANGE = 500 * DPR;
const HIT_STOP_FRAMES = 5;

const COLORS = {
    SURVEY_GREEN: 0x55783B,
    TITAN_FLESH: 0xD2AF96,
    TITAN_FLESH_DARK: 0xB08A6E,
    BLADE_STEEL: 0xC3CDD7,
    DANGER_RED: 0x8C1E1E,
    NAPE_RED: 0xFF3333,
    WALL_STONE: 0xB4A58C,
    WALL_STONE_DARK: 0x8A7A64,
    SKY_BLUE: 0x7AB8D4,
    SKY_TOP: 0x4A90B8,
    BUILDING_TAN: 0xC4A882,
    BUILDING_DARK: 0x8B7355,
    BUILDING_ROOF: 0x7A4A3A,
    WOOD_BROWN: 0x6B4226,
    GAS_GREEN: 0x44CC44,
    GAS_YELLOW: 0xCCCC44,
    GAS_RED: 0xCC4444,
    BLOOD_RED: 0xCC2222,
    STEAM_WHITE: 0xEBE6DC,
    NIGHT_BLUE: 0x1A1A3E,
    COBBLE_GRAY: 0x888888,
    COBBLE_DARK: 0x666666,
    SCARF_RED: 0xCC2244,
    UI_BG: 0x111111,
    UI_BORDER: 0x888888,
    WHITE: 0xFFFFFF,
    BLACK: 0x000000,
    YELLOW: 0xFFCC00,
    CRYSTAL_BLUE: 0xAADDFF,
};

const CHAR_DEFS = {
    eren: {
        id: 'eren',
        name: 'Eren Jaeger',
        bladeStrength: 3,
        speed: 3,
        gasEfficiency: 3,
        maxHealth: 5,
        color: 0x5B3A1A, // hair
        eyeColor: 0x22AA44,
        specialName: 'Titan Shift',
        specialCharges: 1,
    },
    mikasa: {
        id: 'mikasa',
        name: 'Mikasa Ackerman',
        bladeStrength: 4,
        speed: 5,
        gasEfficiency: 2,
        maxHealth: 5,
        color: 0x1A1A2E, // hair
        eyeColor: 0x222222,
        specialName: 'Ackerman Instinct',
        specialCharges: 3,
    },
    levi: {
        id: 'levi',
        name: 'Levi Ackerman',
        bladeStrength: 5,
        speed: 5,
        gasEfficiency: 4,
        maxHealth: 5,
        color: 0x1A1A1A,
        eyeColor: 0x444466,
        specialName: 'Spin Slash',
        specialCharges: 99,
    },
};

const TITAN_DEFS = {
    '3m': { className: '3m', width: 56 * DPR, height: 80 * DPR, napeHealth: 1, speed: 0.4 * DPR, detectRadius: 180 * DPR, grabRange: 40 * DPR, damage: 1, score: 100 },
    '7m': { className: '7m', width: 72 * DPR, height: 128 * DPR, napeHealth: 2, speed: 0.6 * DPR, detectRadius: 240 * DPR, grabRange: 55 * DPR, damage: 1, score: 250 },
    '10m': { className: '10m', width: 96 * DPR, height: 180 * DPR, napeHealth: 3, speed: 0.7 * DPR, detectRadius: 300 * DPR, grabRange: 70 * DPR, damage: 2, score: 500 },
    '15m': { className: '15m', width: 128 * DPR, height: 260 * DPR, napeHealth: 5, speed: 0.5 * DPR, detectRadius: 350 * DPR, grabRange: 90 * DPR, damage: 2, score: 1000 },
};

// ---- UTILITY FUNCTIONS ----
function rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function pointInRect(px, py, rx, ry, rw, rh) {
    return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
}

function dist(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
}

function angleBetween(x1, y1, x2, y2) {
    return Math.atan2(y2 - y1, x2 - x1);
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
}

function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randFloat(min, max) {
    return Math.random() * (max - min) + min;
}
// ---- PROCEDURAL TEXTURE GENERATION ----
class TextureGenerator {
    constructor(scene) {
        this.scene = scene;
    }

    generateAll() {
        this.generatePlayerTextures();
        this.generateTitanTextures();
        this.generateEnvironmentTextures();
        this.generateUITextures();
        this.generateEffectTextures();
    }

    generatePlayerTextures() {
        for (let charId in CHAR_DEFS) {
            const def = CHAR_DEFS[charId];
            this._drawPlayer(charId, def);
        }
    }

    _drawPlayer(id, def) {
        const w = 20;
        const h = 32;
        const g = this.scene.make.graphics({ x: 0, y: 0, add: false });

        // Boots
        g.fillStyle(0x333333);
        g.fillRect(4, 27, 5, 5);
        g.fillRect(11, 27, 5, 5);

        // Pants (white uniform)
        g.fillStyle(0xDDDDCC);
        g.fillRect(5, 20, 4, 8);
        g.fillRect(11, 20, 4, 8);

        // ODM harness on legs
        g.fillStyle(0x554433);
        g.fillRect(4, 22, 2, 5);
        g.fillRect(14, 22, 2, 5);

        // Torso (jacket)
        g.fillStyle(0xAA9977);
        g.fillRect(5, 12, 10, 9);

        // Survey Corps cloak
        g.fillStyle(COLORS.SURVEY_GREEN);
        g.fillRect(3, 12, 3, 10);
        g.fillRect(14, 12, 3, 10);

        // Belt
        g.fillStyle(0x554433);
        g.fillRect(5, 19, 10, 2);

        // ODM gear on hips
        g.fillStyle(COLORS.BLADE_STEEL);
        g.fillRect(2, 18, 3, 4);
        g.fillRect(15, 18, 3, 4);

        // Neck
        g.fillStyle(0xDDB896);
        g.fillRect(8, 10, 4, 3);

        // Head
        g.fillStyle(0xDDB896);
        g.fillRect(6, 2, 8, 9);

        // Hair
        g.fillStyle(def.color);
        g.fillRect(6, 1, 8, 4);
        g.fillRect(5, 2, 2, 5);
        g.fillRect(13, 2, 2, 5);

        // Eyes
        g.fillStyle(def.eyeColor);
        g.fillRect(7, 5, 2, 2);
        g.fillRect(11, 5, 2, 2);

        // Mouth
        g.fillStyle(0xBB8866);
        g.fillRect(9, 8, 2, 1);

        // Mikasa scarf
        if (id === 'mikasa') {
            g.fillStyle(COLORS.SCARF_RED);
            g.fillRect(6, 10, 8, 2);
        }

        // Blades in hands
        g.fillStyle(COLORS.BLADE_STEEL);
        g.fillRect(1, 14, 2, 8);
        g.fillRect(17, 14, 2, 8);

        g.generateTexture('player_' + id, w, h);
        g.destroy();

        // Slash frame
        const gs = this.scene.make.graphics({ x: 0, y: 0, add: false });
        gs.fillStyle(COLORS.BLADE_STEEL);
        gs.fillRect(5, 12, 10, 9);
        gs.fillStyle(0xDDB896);
        gs.fillRect(6, 2, 8, 9);
        gs.fillStyle(def.color);
        gs.fillRect(6, 1, 8, 4);
        gs.fillRect(5, 2, 2, 5);
        gs.fillRect(13, 2, 2, 5);
        gs.fillStyle(def.eyeColor);
        gs.fillRect(7, 5, 2, 2);
        gs.fillRect(11, 5, 2, 2);
        gs.fillStyle(0xDDDDCC);
        gs.fillRect(5, 20, 4, 8);
        gs.fillRect(11, 20, 4, 8);
        gs.fillStyle(0x333333);
        gs.fillRect(4, 27, 5, 5);
        gs.fillRect(11, 27, 5, 5);
        if (id === 'mikasa') {
            gs.fillStyle(COLORS.SCARF_RED);
            gs.fillRect(6, 10, 8, 2);
        }
        // Extended blade swing
        gs.fillStyle(0xFFFFFF);
        gs.fillRect(0, 8, 20, 2);
        gs.fillRect(17, 6, 3, 6);
        gs.generateTexture('player_' + id + '_slash', w, h);
        gs.destroy();
    }

    generateTitanTextures() {
        for (let cls in TITAN_DEFS) {
            const def = TITAN_DEFS[cls];
            this._drawTitan(cls, def);
        }
    }

    _drawTitan(cls, def) {
        const w = def.width;
        const h = def.height;
        const g = this.scene.make.graphics({ x: 0, y: 0, add: false });

        const skin = COLORS.TITAN_FLESH;
        const skinDark = COLORS.TITAN_FLESH_DARK;

        // Body proportions based on class
        const headH = Math.floor(h * 0.2);
        const torsoH = Math.floor(h * 0.35);
        const legH = h - headH - torsoH;
        const torsoW = Math.floor(w * 0.6);
        const headW = Math.floor(w * 0.4);
        const legW = Math.floor(w * 0.2);
        const cx = Math.floor(w / 2);

        // Legs
        g.fillStyle(skinDark);
        g.fillRect(cx - torsoW / 2, headH + torsoH, legW, legH);
        g.fillRect(cx + torsoW / 2 - legW, headH + torsoH, legW, legH);

        // Torso
        g.fillStyle(skin);
        g.fillRect(cx - torsoW / 2, headH, torsoW, torsoH);

        // Muscle lines on torso
        g.fillStyle(skinDark);
        g.fillRect(cx - 1, headH + 4, 2, torsoH - 8);

        // Arms
        const armW = Math.floor(w * 0.15);
        g.fillStyle(skin);
        g.fillRect(cx - torsoW / 2 - armW, headH + 2, armW, torsoH - 4);
        g.fillRect(cx + torsoW / 2, headH + 2, armW, torsoH - 4);

        // Head
        g.fillStyle(skin);
        g.fillRect(cx - headW / 2, 0, headW, headH);

        // Face - creepy grin
        g.fillStyle(0x000000);
        // Eyes (wide, unsettling)
        const eyeY = Math.floor(headH * 0.35);
        const eyeSize = Math.max(2, Math.floor(headW * 0.15));
        g.fillRect(cx - headW / 4 - eyeSize / 2, eyeY, eyeSize, eyeSize);
        g.fillRect(cx + headW / 4 - eyeSize / 2, eyeY, eyeSize, eyeSize);

        // Mouth (wide grin)
        const mouthY = Math.floor(headH * 0.65);
        const mouthW = Math.floor(headW * 0.6);
        g.fillRect(cx - mouthW / 2, mouthY, mouthW, Math.max(2, Math.floor(headH * 0.15)));

        // Nape target zone (back of neck - shown as a slight highlight)
        g.fillStyle(COLORS.NAPE_RED);
        const napeW = Math.max(4, Math.floor(headW * 0.5));
        const napeH = Math.max(3, Math.floor(headH * 0.3));
        g.fillRect(cx - napeW / 2, headH - napeH, napeW, napeH);

        g.generateTexture('titan_' + cls, w, h);
        g.destroy();
    }

    generateEnvironmentTextures() {
        // Building tile
        let g = this.scene.make.graphics({ x: 0, y: 0, add: false });
        g.fillStyle(COLORS.BUILDING_TAN);
        g.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
        g.fillStyle(COLORS.BUILDING_DARK);
        g.fillRect(0, 0, TILE_SIZE, 1);
