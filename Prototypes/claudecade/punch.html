class SFX {
    constructor() { this.c = null; }
    init() {
        if (this.c) return;
        try { this.c = new (window.AudioContext || window.webkitAudioContext)(); if(this.c.state==='suspended')this.c.resume(); } catch(e){}
    }
    _n(d,v,f0,f1) { if(!this.c)return; const o=this.c.createOscillator(),g=this.c.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(f0,this.c.currentTime); o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),this.c.currentTime+d); g.gain.setValueAtTime(v,this.c.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.c.currentTime+d); o.connect(g);g.connect(this.c.destination);o.start();o.stop(this.c.currentTime+d); }
    _b(d,v) { if(!this.c)return; const n=this.c.sampleRate*d,buf=this.c.createBuffer(1,n,this.c.sampleRate),dat=buf.getChannelData(0); for(let i=0;i<n;i++)dat[i]=(Math.random()*2-1)*(1-i/n); const s=this.c.createBufferSource(),g=this.c.createGain(); s.buffer=buf; g.gain.setValueAtTime(v,this.c.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.c.currentTime+d); s.connect(g);g.connect(this.c.destination);s.start(); }
    punch(){this._b(.12,.5);this._n(.08,.3,200,80)}

    dodge(){this._n(.15,.2,800,2000)}

    victory(){ if(!this.c)return; const ns=[523,659,784,1047]; for(let i=0;i<ns.length;i++){ const o=this.c.createOscillator(),g=this.c.createGain(); o.type='square';o.frequency.value=ns[i]; g.gain.setValueAtTime(0,this.c.currentTime+i*.15); g.gain.linearRampToValueAtTime(.15,this.c.currentTime+i*.15+.02); g.gain.exponentialRampToValueAtTime(.001,this.c.currentTime+i*.15+.3); o.connect(g);g.connect(this.c.destination); o.start(this.c.currentTime+i*.15);o.stop(this.c.currentTime+i*.15+.3); } }
}

class ComboTracker {
    constructor(){this.buf=[];this.lt=0;}
    add(d,t){if(t-this.lt>800)this.buf=[];this.buf.push(d);this.lt=t;if(this.buf.length>6)this.buf.shift();

}

// ══════════════ DOM GESTURE RECOGNIZER ══════════════
class Gesture {
    constructor(cb, zoneFn) {
        this.cb = cb; this.zoneFn = zoneFn; this.on = false;
    }
    enable() {
        if (this.on) return; this.on = true;
        this._ts = (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].clientY < this.zoneFn()) {
                    this.cb();
                    return;
                }
            }
        };
        this._md = (e) => { if (e.clientY < this.zoneFn()) this.cb(); };
        document.addEventListener('touchstart', this._ts, {passive:false});
        document.addEventListener('mousedown', this._md);
    }
    disable() {
        this.on = false;
        document.removeEventListener('touchstart', this._ts);
        document.removeEventListener('mousedown', this._md);
    }
}

    g.fillStyle(0x107070); g.fillCircle(ew2/2,38,36);
    // CROWN FIN - 5 spikes on top
    g.fillStyle(0x20AAAA);
    g.fillTriangle(ew2/2-24,12,ew2/2-18,-12,ew2/2-12,12);
    g.fillTriangle(ew2/2-10,8,ew2/2-4,-18,ew2/2+2,8);
    g.fillTriangle(ew2/2+4,10,ew2/2+10,-14,ew2/2+16,10);
    g.fillTriangle(ew2/2+14,12,ew2/2+20,-10,ew2/2+26,12);
    g.fillStyle(0x0A4848); g.fillCircle(ew2/2,40,28);
    // yellow eyes (larger, more fish-like)
    g.fillStyle(0xFFDD00); g.fillEllipse(ew2/2-14,35,14,10); g.fillEllipse(ew2/2+14,35,14,10);
    g.fillStyle(0x000000); g.fillCircle(ew2/2-14,35,4); g.fillCircle(ew2/2+14,35,4);
    // wide grinning mouth
    g.fillStyle(0x082828); g.fillRoundedRect(ew2/2-22,48,44,16,5);
    g.fillStyle(0xFFFFFF);
    for(let i=0;i<7;i++) g.fillTriangle(ew2/2-20+i*6,48,ew2/2-17+i*6,56,ew2/2-14+i*6,48);
    for(let i=0;i<7;i++) g.fillTriangle(ew2/2-20+i*6,64,ew2/2-17+i*6,56,ew2/2-14+i*6,64);

    const br=LY.BR;
    g.clear(); g.fillStyle(C.BD); g.fillCircle(br,br,br); g.lineStyle(3,0x4488DD); g.strokeCircle(br,br,br-2);
    g.fillStyle(0xFFF); g.fillTriangle(br-20,br,br+10,br-18,br+10,br+18);
    g.generateTexture('bdl',br*2,br*2);

    g.clear(); g.fillStyle(C.BD); g.fillCircle(br,br,br); g.lineStyle(3,0x4488DD); g.strokeCircle(br,br,br-2);
    g.fillStyle(0xFFF); g.fillTriangle(br+20,br,br-10,br-18,br-10,br+18);

// ══════════════ COMBAT (SINGLE SCENE) ══════════════
class CombatScene extends Phaser.Scene {
    constructor(){super({key:'Combat'});}
    init(d){this.ek=d.ek||'vaccine_man';}

    create(){
        const ec = ENEMIES[this.ek];
        this.r = this.add.container(0,0);

        // state
        this.pHP=100; this.pMHP=100; this.eHP=ec.hp; this.eMHP=ec.hp;
        this.stam=100; this.mStam=100; this.pAtk=25;
        this.post='idle'; this.held={l:false,r:false,b:false};
        this.stunned=false; this.bpTime=0;
        this.cst='intro'; // intro|eturn|tel|atkwin|ended
        this.curPat=null; this.curSI=0; this.curS=null;
        this.combo=new ComboTracker(); this.jabF=false;
        this.ec=ec;

        // bg
        this.r.add(this.add.rectangle(GW/2,GH/2,GW,GH,C.BG));
        const fl=this.add.graphics(); fl.fillStyle(C.FL);fl.fillRect(0,580,GW,340);
        fl.lineStyle(1,C.LN,.3);
        for(let i=0;i<12;i++){const x=(i/11)*GW;fl.lineBetween(x,580,GW/2+(x-GW/2)*.3,380);}
        for(let i=0;i<5;i++){const y=580+i*70;const q=1-(y-580)/600;fl.lineBetween(GW/2-400*(1-q*.5),y,GW/2+400*(1-q*.5),y);}
        this.r.add(fl);

        // sprites - use enemy-specific textures via prefix
        this.tx = ec.tx; // 'v' or 'd'
        this.es=this.add.image(GW/2,LY.EY,this.tx+'i').setScale(1.5); this.r.add(this.es);
        this.ps=this.add.image(GW/2,LY.PY,'pi').setScale(1.6); this.r.add(this.ps);
        this.fx=this.add.particles(0,0,'pt',{speed:{min:150,max:400},lifespan:300,scale:{start:1.5,end:0},alpha:{start:1,end:0},tint:[0xFFFFFF,0xFFDD44,0xFF8800],emitting:false,gravityY:200});
        this.r.add(this.fx);
        this.glow=this.add.rectangle(GW/2,LY.PY-60,GW-40,8,0xFF8800,0); this.r.add(this.glow);

        // HUD
        this.r.add(this.add.text(GW/2,LY.EHP-25,ec.name,{fontFamily:'Impact,Arial Black',fontSize:'24px',color:'#FF4444',stroke:'#000',strokeThickness:2}).setOrigin(.5));
        this.ehpB=this.add.rectangle(GW/2,LY.EHP,400,24,C.HPB).setOrigin(.5);
        this.ehpF=this.add.rectangle(GW/2-200,LY.EHP,400,24,C.HPR).setOrigin(0,.5);
        this.r.add([this.ehpB,this.ehpF,this.add.rectangle(GW/2,LY.EHP,400,24).setStrokeStyle(2,0x888).setOrigin(.5)]);

        this.r.add(this.add.text(GW/2,LY.PHP-25,'SAITAMA',{fontFamily:'Impact,Arial Black',fontSize:'24px',color:'#FFD700',stroke:'#000',strokeThickness:2}).setOrigin(.5));
        this.phpB=this.add.rectangle(GW/2,LY.PHP,400,24,C.HPB).setOrigin(.5);
        this.phpF=this.add.rectangle(GW/2-200,LY.PHP,400,24,C.HPG).setOrigin(0,.5);
        this.r.add([this.phpB,this.phpF,this.add.rectangle(GW/2,LY.PHP,400,24).setStrokeStyle(2,0x888).setOrigin(.5)]);

        this.stmB=this.add.rectangle(GW/2,LY.STM,300,14,C.HPB).setOrigin(.5);
        this.stmF=this.add.rectangle(GW/2-150,LY.STM,300,14,C.STM).setOrigin(0,.5);
        this.r.add([this.stmB,this.stmF,this.add.rectangle(GW/2,LY.STM,300,14).setStrokeStyle(1,0x666).setOrigin(.5)]);

        this.telT=this.add.text(GW/2,LY.EHP+40,'',{fontFamily:'Impact',fontSize:'28px',color:'#FF6644',stroke:'#000',strokeThickness:3}).setOrigin(.5).setAlpha(0);
        this.r.add(this.telT);
        this.swpH=this.add.text(GW/2,LY.BY-LY.BR-40,'TAP or SWIPE to ATTACK',{fontFamily:'Arial',fontSize:'20px',color:'#FF8844'}).setOrigin(.5).setAlpha(0);
        this.r.add(this.swpH);

        // buttons
        this.bDL=this.add.image(LY.BLX,LY.BY,'bdl').setInteractive().setAlpha(.85);
        this.bBL=this.add.image(LY.BMX,LY.BY,'bbl').setInteractive().setAlpha(.85);
        this.bDR=this.add.image(LY.BRX,LY.BY,'bdr').setInteractive().setAlpha(.85);
        this.r.add([this.bDL,this.bBL,this.bDR]);
        const ls={fontFamily:'Arial',fontSize:'16px',color:'#AACCFF'};
        this.r.add([this.add.text(LY.BLX,LY.BY+LY.BR+14,'DODGE',ls).setOrigin(.5),
            this.add.text(LY.BMX,LY.BY+LY.BR+14,'BLOCK',{fontFamily:'Arial',fontSize:'16px',color:'#DDCC66'}).setOrigin(.5),
            this.add.text(LY.BRX,LY.BY+LY.BR+14,'DODGE',ls).setOrigin(.5)]);

        this._bindBtn(this.bDL,'l'); this._bindBtn(this.bDR,'r'); this._bindBtn(this.bBL,'b');

        // gesture (DOM)
        this.gest = new Gesture(()=>this._onAtk(), ()=>this._btnZoneY());
        this.gest.enable();

        this._sc(); this.scale.on('resize',this._sc,this);
        this.cameras.main.fadeIn(500);

        // fight intro
        const ft=this.add.text(GW/2,GH/2-100,'FIGHT!',{fontFamily:'Impact,Arial Black',fontSize:'100px',color:'#FFD700',stroke:'#000',strokeThickness:10,shadow:{offsetX:4,offsetY:4,color:'#000',blur:10,fill:true}}).setOrigin(.5).setScale(0).setDepth(50);
        this.r.add(ft);
        this.tweens.add({targets:ft,scaleX:1.2,scaleY:1.2,duration:400,ease:'Back.easeOut',onComplete:()=>{
            this.tweens.add({targets:ft,alpha:0,scaleX:2,scaleY:2,duration:600,delay:400,ease:'Power2',onComplete:()=>ft.destroy()});}});

        this.time.delayedCall(1500,()=>this._eTurn());
    }

    _bindBtn(btn,k){
        btn.on('pointerdown',()=>{btn.setAlpha(1).setScale(.9);this._bd(k);});
        btn.on('pointerup',()=>{btn.setAlpha(.85).setScale(1);this._bu(k);});
        btn.on('pointerout',()=>{btn.setAlpha(.85).setScale(1);this._bu(k);});
    }

    _btnZoneY(){const r=this.r;if(!r)return window.innerHeight*.75;return r.y+(LY.BY-LY.BR-30)*r.scaleY;}
    _sc(){const s=Math.min(this.scale.width/GW,this.scale.height/GH);this.r.setScale(s).setPosition((this.scale.width-GW*s)/2,(this.scale.height-GH*s)/2);}

    update(t,dt){
        if(this.cst==='ended')return;
        if(this.stam<this.mStam){this.stam=Math.min(this.mStam,this.stam+18*dt/1000);this._dStm();}
    }

    // ── posture ──
    _bd(k){if(this.cst==='ended')return;this.held[k]=true;
        if(k==='b')this.bpTime=Date.now();
        if((k==='l'||k==='r')&&this.stam>=15){this.stam-=15;this._dStm();sfx.dodge();}
        this._uPost();}
    _bu(k){this.held[k]=false;this._uPost();}
    _rPost(){if(this.held.l)return'dl';if(this.held.r)return'dr';if(this.held.b)return'bl';return'idle';}
    _uPost(){if(this.stunned||this.cst==='ended')return;const p=this._rPost();if(p===this.post)return;this.post=p;this._dPost();}
    _dPost(){
        this.tweens.killTweensOf(this.ps); this.ps.clearTint().setScale(1.6).setY(LY.PY);
        if(this.post==='dl'){this.ps.setTexture('pd').setFlipX(true);this.tweens.add({targets:this.ps,x:GW/2-120,duration:100,ease:'Power2'});}
        else if(this.post==='dr'){this.ps.setTexture('pd').setFlipX(false);this.tweens.add({targets:this.ps,x:GW/2+120,duration:100,ease:'Power2'});}
        else if(this.post==='bl'){this.ps.setTexture('pb').setFlipX(false);this.tweens.add({targets:this.ps,x:GW/2,duration:80,ease:'Power2'});}
        else{this.ps.setTexture('pi').setFlipX(false);this.tweens.add({targets:this.ps,x:GW/2,duration:120,ease:'Power2'});}
    }

    // ── attack input ──
    _onAtk(){
        if(this.cst==='ended')return;
        if(this.stunned)return;
        if(this.held.l||this.held.r||this.held.b)return; // button held = no attack
        if(this.stam<8)return; this.stam-=8; this._dStm();

        // Enemy parry: if enemy is idle (between turns), chance to block
        if(this.cst==='eturn' && Math.random() < this.ec.parry){
            sfx.block();
            this._punchFX(); // player still animates the punch
            // Enemy blocks — show block pose, no damage
            this.tweens.killTweensOf(this.es);
            this.es.setTexture(this.tx+'bl').setY(LY.EY).setScale(1.5).setTint(0x88FFFF);
            this.time.delayedCall(300,()=>{
                this.es.clearTint();
                // Counter-attack: enemy hits back
                sfx.hit();
                this._eAtkFX();
                this._dmgP(this.ec.counterDmg);
                if(this.cst==='ended')return;
                this.stunned=true; this.post='idle';
                this.ps.setTexture('pi').setFlipX(false);
                this._hitFX();
                this.time.delayedCall(400,()=>{
                    if(this.cst==='ended')return;
                    this.stunned=false; this.post=this._rPost(); this._dPost();
                    this.es.setTexture(this.tx+'i');
                });
            });
            return;
        }

        sfx.punch();
        this._punchFX(); this._dmgE(this.pAtk);
    }

    // ── combat flow ──
    _phase(){const p=this.eHP/this.eMHP;let ph=this.ec.phases[0];for(let i=0;i<this.ec.phases.length;i++){if(p<=this.ec.phases[i].hp)ph=this.ec.phases[i];}return ph;}

    _eTurn(){
        if(this.cst==='ended')return; this.cst='eturn'; this.combo.reset();
        const ph=this._phase(); const pk=ph.pats[Math.floor(Math.random()*ph.pats.length)];
        this.curPat=this.ec.pats[pk]; this.curSI=0;
        this.time.delayedCall(500,()=>{if(this.cst!=='ended')this._nxt();});
    }

    _nxt(){
        if(this.cst==='ended')return;
        if(this.curSI>=this.curPat.length){this._eTurn();return;}
        this.curS=this.curPat[this.curSI]; this.cst='tel';
        const ph=this._phase(); const ms=this.ec.telMs*ph.tm;
        this._telFX(this.curS,ms);
        this.time.delayedCall(ms,()=>this._eStrike());
    }

    _eStrike(){
        if(this.cst==='ended')return;
        const s=this.curS, p=this.post;
        this._eAtkFX(); this.telT.setAlpha(0);

        if(p==='dl'||p==='dr'){
            const dd=p==='dl'?'left':'right';
            if(s.esc==='any'||s.esc===dd){this._openAtk(1800);return;}
            this._hit(s);return;
        }
        if(p==='bl'){
            if(!s.blk){this._hit(s);return;}
            if(Date.now()-this.bpTime<=250){sfx.parry();this._parryFX();this._openAtk(2800);return;}
            sfx.block(); this._dmgP(Math.floor(s.dmg*.25));
            if(this.cst==='ended')return;
            this.curSI++; this.time.delayedCall(350,()=>this._nxt()); return;
        }
        this._hit(s);
    }

    _hit(s){
        sfx.hit(); this._hitFX(); this._dmgP(s.dmg);
        if(this.cst==='ended')return;
        this.stunned=true; this.post='idle'; this.ps.setTexture('pi').setFlipX(false);
        this.time.delayedCall(500,()=>{
            if(this.cst==='ended')return;
            this.stunned=false; this.post=this._rPost(); this._dPost();
            this.curSI++; this._nxt();
        });
    }

    _openAtk(dur){
        if(this.cst==='ended')return; this.cst='atkwin'; this.combo.reset();
        this.tweens.killTweensOf(this.es); this.es.setY(LY.EY).setScale(1.5).clearTint();
        if(dur>=2800)this.es.setTexture(this.tx+'s');
        this.swpH.setAlpha(1); this.tweens.add({targets:this.swpH,alpha:.3,duration:500,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
        this.glow.setAlpha(.8); this.tweens.add({targets:this.glow,alpha:.3,duration:400,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
        this.time.delayedCall(dur,()=>{if(this.cst!=='ended')this._closeAtk();});
    }

    _closeAtk(){
        this.tweens.killTweensOf(this.glow); this.glow.setAlpha(0);
        this.tweens.killTweensOf(this.swpH); this.swpH.setAlpha(0);
        this.tweens.killTweensOf(this.es); this.es.setTexture(this.tx+'i').setY(LY.EY).setScale(1.5).clearTint();
        this.curSI=0; this._eTurn();
    }

    _dmgP(a){this.pHP=Math.max(0,this.pHP-a);this._dPHP();if(this.pHP<=0)this._end('defeat');}
    _dmgE(a){this.eHP=Math.max(0,this.eHP-a);this._dEHP();if(this.eHP<=0)this._end('victory');}

    _end(res){
        this.cst='ended'; this.stunned=false; this.held={l:false,r:false,b:false};
        this.gest.disable();
        this.tweens.killTweensOf(this.glow);this.glow.setAlpha(0);
        this.tweens.killTweensOf(this.swpH);this.swpH.setAlpha(0);
        const w=res==='victory';
        if(w){sfx.ko();this.es.setTexture(this.tx+'s');this.tweens.add({targets:this.es,y:LY.EY+100,alpha:.3,duration:800,ease:'Power2'});}
        else{sfx.hit();this.ps.setTint(0x884444);this.tweens.add({targets:this.ps,y:LY.PY+60,alpha:.5,duration:800,ease:'Power2'});}

        this.time.delayedCall(1000,()=>{
            this.r.add(this.add.rectangle(GW/2,GH/2,GW,GH,0x000000,.6).setDepth(100));
            const rt=this.add.text(GW/2,GH/2-80,w?'K.O.!':'DEFEATED',{fontFamily:'Impact,Arial Black',fontSize:w?'120px':'90px',color:w?'#FFD700':'#FF4444',stroke:'#000',strokeThickness:10,shadow:{offsetX:4,offsetY:4,color:'#000',blur:12,fill:true}}).setOrigin(.5).setDepth(101).setScale(0);
            this.r.add(rt); this.tweens.add({targets:rt,scaleX:1,scaleY:1,duration:500,ease:'Back.easeOut'});
            if(w)this.time.delayedCall(600,()=>sfx.victory());
            const ct=this.add.text(GW/2,GH/2+60,'TAP TO CONTINUE',{fontFamily:'Arial',fontSize:'28px',color:'#AAA'}).setOrigin(.5).setDepth(101).setAlpha(0);
            this.r.add(ct); this.tweens.add({targets:ct,alpha:1,duration:600,delay:800,yoyo:true,repeat:-1});
            this.time.delayedCall(800,()=>{this.input.once('pointerdown',()=>{sfx.menu();this.cameras.main.fadeOut(400,0,0,0);this.cameras.main.once('camerafadeoutcomplete',()=>this.scene.start('Menu'));});});
        });
    }

    // ── HUD draws ──
    _dPHP(){const r=Math.max(0,this.pHP/this.pMHP);this.tweens.add({targets:this.phpF,displayWidth:400*r,duration:200,ease:'Power2'});this.phpF.setFillStyle(r<.3?C.HPR:C.HPG);}
    _dEHP(){const r=Math.max(0,this.eHP/this.eMHP);this.tweens.add({targets:this.ehpF,displayWidth:400*r,duration:200,ease:'Power2'});}
    _dStm(){const r=Math.max(0,this.stam/this.mStam);this.stmF.displayWidth=300*r;this.stmF.setFillStyle(r<.2?0xCC4444:C.STM);}

    // ── FX ──
    _telFX(s,dur){
        this.tweens.killTweensOf(this.es); this.es.setY(LY.EY).setScale(1.5).clearTint();
        this.es.setTexture(this.tx+s.tex);
        if(!s.blk)this.es.setTint(0xFF6644);
        this.tweens.add({targets:this.es,scaleX:1.58,scaleY:1.55,duration:dur*.4,yoyo:true,repeat:1,ease:'Sine.easeInOut'});
        const lb={left:'◀ LEFT',right:'RIGHT ▶',overhead:'▼ OVERHEAD',grab:'✋ GRAB! DODGE!'};
        this.telT.setText(lb[s.dir]||'!').setColor(s.blk?'#FF8844':'#FF2222').setAlpha(1);
        this.tweens.add({targets:this.telT,alpha:.5,duration:200,yoyo:true,repeat:2,ease:'Sine.easeInOut',onComplete:()=>this.telT.setAlpha(1)});
    }
    _eAtkFX(){
        this.tweens.killTweensOf(this.es); this.es.clearTint().setTexture(this.tx+'i').setY(LY.EY).setScale(1.5);
        this.tweens.add({targets:this.es,y:LY.EY+60,scaleX:1.65,scaleY:1.65,duration:120,yoyo:true,ease:'Power2',onComplete:()=>{this.es.setY(LY.EY).setScale(1.5);}});
    }
    _parryFX(){
        this.tweens.killTweensOf(this.ps); this.ps.setX(GW/2).setScale(1.6).setTexture('pb').setFlipX(false).setTint(0xFFFF44);
        this.cameras.main.flash(200,255,255,100); this.cameras.main.shake(200,.01);
        this.time.delayedCall(300,()=>this.ps.clearTint());
    }
    _hitFX(){
        this.tweens.killTweensOf(this.ps); this.ps.setScale(1.6).setFlipX(false).setTint(0xFF4444);
        this.tweens.add({targets:this.ps,x:GW/2,y:LY.PY+20,duration:100,yoyo:true,ease:'Power2',onComplete:()=>{this.ps.clearTint();this.ps.setY(LY.PY);}});
        this.cameras.main.shake(150,.015);
    }
    _punchFX(){
        this.tweens.killTweensOf(this.ps); this.ps.setX(GW/2).setTexture('pp');
        this.jabF=!this.jabF; this.ps.setFlipX(this.jabF);
        this.tweens.add({targets:this.ps,y:LY.PY-30,scaleX:1.7,scaleY:1.7,duration:80,yoyo:true,ease:'Power3',onComplete:()=>{this.post=this._rPost();this._dPost();}});
        this.fx.explode(8,GW/2+Phaser.Math.Between(-40,40),LY.EY+40);
        this.es.setTint(0xFF8888);
        this.tweens.add({targets:this.es,y:LY.EY-15,duration:80,yoyo:true,ease:'Power2',onComplete:()=>this.es.clearTint()});
        this.cameras.main.shake(80,.005);
    }
    _comboFX(name,dmg){
        const ct=this.add.text(GW/2,LY.PY-160,name,{fontFamily:'Impact,Arial Black',fontSize:'38px',color:'#FFD700',stroke:'#000',strokeThickness:5,shadow:{offsetX:2,offsetY:2,color:'#000',blur:6,fill:true}}).setOrigin(.5);
        const dt=this.add.text(GW/2,LY.PY-120,dmg+' DMG!',{fontFamily:'Impact',fontSize:'30px',color:'#FF4444',stroke:'#000',strokeThickness:3}).setOrigin(.5);
        this.r.add([ct,dt]);
        this.tweens.add({targets:[ct,dt],y:'-=80',alpha:0,duration:1200,ease:'Power2',onComplete:()=>{ct.destroy();dt.destroy();}});
        this.cameras.main.shake(200,.02); this.fx.explode(20,GW/2,LY.EY);
    }

    shutdown(){if(this.gest)this.gest.disable();this.scale.off('resize',this._sc,this);}
}

// ══════════════ BOOT ══════════════
const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-container',
    scale: { mode:Phaser.Scale.RESIZE, width:window.innerWidth, height:window.innerHeight, autoRound:false },
    render: { pixelArt:false, antialias:true, resolution:window.devicePixelRatio||1 },
    backgroundColor: '#0a0a0a',
    scene: [PreloaderScene, MenuScene, CombatScene],
    input: { activePointers:3 }
});
</script>
