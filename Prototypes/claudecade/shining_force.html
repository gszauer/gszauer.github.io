class ExplorationScene extends Phaser.Scene {
  constructor() { super('exploration'); }

  create() {
    this.mx = 0;
    this.my = 0;
    this.px = TOWN_MAP.start.x;
    this.py = TOWN_MAP.start.y;
    this.facing = 'down';
    this.moving = false;
    this.uiStack = [];

    this.tileSprites = [];
    for (let y = 0; y < TOWN_MAP.rows; y++) {
      for (let x = 0; x < TOWN_MAP.cols; x++) {
        const tid = TOWN_MAP.tiles[y][x];
        const spr = this.add.image(this.mx + x*TILE + TILE/2, this.my + y*TILE + TILE/2, 'tile_'+tid);
        this.tileSprites.push(spr);
      }
    }

    this.npcSprites = {};
    this.refreshNPCs();

    this.playerSprite = this.add.image(
      this.mx + this.px*TILE + TILE/2,
      this.my + this.py*TILE + TILE/2,
      'hero_down'
    ).setDepth(10);

    this.cameras.main.setBounds(0, 0, TOWN_MAP.cols * TILE, TOWN_MAP.rows * TILE);
    this.cameras.main.startFollow(this.playerSprite, true, 0.15, 0.15);

    this.dialogContainer = null;
    this.dialogTexts = [];
    this.dialogLines = [];
    this.dialogIndex = 0;
    this.dialogCallback = null;
    this.dialogActive = false;
    this.typewriterText = '';
    this.typewriterIndex = 0;
    this.typewriterDone = false;

    this.menuContainer = null;
    this.menuOptions = [];
    this.menuCursor = 0;
    this.menuCallback = null;
    this.menuCancelCallback = null;

    this.goldText = this.add.text(4, SH - 14, 'Gold: ' + GS.gold, {
      fontSize:'10px', fontFamily:'monospace', color:'#ffcc00'
    }).setDepth(50).setScrollFactor(0);

    this.keys = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.UP,
      down: Phaser.Input.Keyboard.KeyCodes.DOWN,
      left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      z: Phaser.Input.Keyboard.KeyCodes.Z,
      x: Phaser.Input.Keyboard.KeyCodes.X,
      enter: Phaser.Input.Keyboard.KeyCodes.ENTER,
    });
  }

  refreshNPCs() {
    for (const k in this.npcSprites) {
      if (this.npcSprites[k]) this.npcSprites[k].destroy();
    }
    this.npcSprites = {};
    for (const npc of TOWN_NPCS) {
      const visible = npc.always || (npc.vis && npc.vis());
      if (visible) {
        const tex = npc.rid ? 'recruit_'+npc.rid : 'npc_'+npc.id;
        const spr = this.add.image(
          this.mx + npc.x*TILE + TILE/2,
          this.my + npc.y*TILE + TILE/2,
          tex
        ).setDepth(5);
        this.npcSprites[npc.id] = spr;
      }
    }
  }

  update() {
    this.goldText.setText('Gold: ' + GS.gold);

    if (this.uiStack.length > 0) {
      const top = this.uiStack[this.uiStack.length - 1];
      top.call(this);
      return;
    }

    if (this.moving) return;

    let dx = 0, dy = 0;
    if (Phaser.Input.Keyboard.JustDown(this.keys.up))    { dy = -1; this.facing = 'up'; }
    else if (Phaser.Input.Keyboard.JustDown(this.keys.down))  { dy = 1; this.facing = 'down'; }
    else if (Phaser.Input.Keyboard.JustDown(this.keys.left))  { dx = -1; this.facing = 'left'; }
    else if (Phaser.Input.Keyboard.JustDown(this.keys.right)) { dx = 1; this.facing = 'right'; }

    if (dx !== 0 || dy !== 0) {
      this.playerSprite.setTexture('hero_'+this.facing);
      const nx = this.px + dx;
      const ny = this.py + dy;
      if (nx >= 0 && ny >= 0 && nx < TOWN_MAP.cols && ny < TOWN_MAP.rows) {
        const tid = TOWN_MAP.tiles[ny][nx];
        const tileData = TILES[tid];
        const npcThere = this.getNPCAt(nx, ny);
        if (tileData.walk && !npcThere) {
          this.moving = true;
          this.px = nx; this.py = ny;
          this.tweens.add({
            targets: this.playerSprite,
            x: this.mx + nx*TILE + TILE/2,
            y: this.my + ny*TILE + TILE/2,
            duration: 150,
            onComplete: () => {
              this.moving = false;
              this.checkBattleTrigger();
            }
          });
        }
      }
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      const facingDir = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
      const fd = facingDir[this.facing];
      const tx = this.px + fd.x;
      const ty = this.py + fd.y;
      const npc = this.getNPCAt(tx, ty);
      if (npc) this.interactNPC(npc);
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.enter)) {
      this.openMainMenu();
    }
  }

  getNPCAt(x, y) {
    for (const npc of TOWN_NPCS) {
      const visible = npc.always || (npc.vis && npc.vis());
      if (visible && npc.x === x && npc.y === y) return npc;
    }
    return null;
  }

  checkBattleTrigger() {
    if (this.px === 19 && this.py === 7) {
      const next = getNextBattle();
      if (next) {
        this.showDialogue(['Heading into battle...'], () => {
          this.scene.start('battle', { battleId: next });
        });
      } else {
        this.showDialogue(['All battles have been won!','Peace reigns in the land.'], () => {
          this.scene.start('title');
        });
      }
    }
  }

  // ---- DIALOGUE SYSTEM ----

  showDialogue(lines, callback) {
    this.dialogLines = lines;
    this.dialogIndex = 0;
    this.dialogCallback = callback || null;
    this.dialogActive = true;
    this.typewriterDone = false;
    this.typewriterIndex = 0;
    this.typewriterText = lines[0];

    if (this.dialogContainer) this.dialogContainer.destroy();

    this.dialogContainer = this.add.container(0, 0).setDepth(100).setScrollFactor(0);
    const bg = this.add.graphics();
    bg.fillStyle(0x000033, 0.9);
    bg.fillRoundedRect(8, SH - 58, SW - 16, 52, 6);
    bg.lineStyle(2, 0x4444aa, 1);
    bg.strokeRoundedRect(8, SH - 58, SW - 16, 52, 6);
    this.dialogContainer.add(bg);

    this.dialogTextObj = this.add.text(16, SH - 54, '', {
      fontSize:'10px', fontFamily:'monospace', color:'#ffffff',
      wordWrap:{width:SW-40}
    });
    this.dialogContainer.add(this.dialogTextObj);

    this.dialogPrompt = this.add.text(SW - 24, SH - 16, 'Z', {
      fontSize:'8px', fontFamily:'monospace', color:'#ffcc00'
    });
    this.dialogContainer.add(this.dialogPrompt);

    this.uiStack.push(this.handleDialogueInput);
  }

  handleDialogueInput() {
    if (!this.dialogActive) return;

    if (!this.typewriterDone) {
      this.typewriterIndex += 2;
      if (this.typewriterIndex >= this.typewriterText.length) {
        this.typewriterIndex = this.typewriterText.length;
        this.typewriterDone = true;
      }
      this.dialogTextObj.setText(this.typewriterText.substring(0, this.typewriterIndex));

      if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
        this.typewriterIndex = this.typewriterText.length;
        this.typewriterDone = true;
        this.dialogTextObj.setText(this.typewriterText);
      }
      return;
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      this.dialogIndex++;
      if (this.dialogIndex < this.dialogLines.length) {
        this.typewriterText = this.dialogLines[this.dialogIndex];
        this.typewriterIndex = 0;
        this.typewriterDone = false;
      } else {
        this.dialogActive = false;
        if (this.dialogContainer) { this.dialogContainer.destroy(); this.dialogContainer = null; }
        this.uiStack.pop();
        if (this.dialogCallback) {
          const cb = this.dialogCallback;
          this.dialogCallback = null;
          cb();
        }
      }
    }
  }

  // ---- MENU SYSTEM ----

  showMenu(x, y, options, onSelect, onCancel) {
    if (this.menuContainer) this.menuContainer.destroy();

    this.menuOptions = options;
    this.menuCursor = 0;
    this.menuCallback = onSelect;
    this.menuCancelCallback = onCancel;

    const w = 160;
    const h = options.length * 20 + 12;
    this.menuContainer = this.add.container(0, 0).setDepth(110).setScrollFactor(0);
    const bg = this.add.graphics();
    bg.fillStyle(0x000033, 0.95);
    bg.fillRoundedRect(x, y, w, h, 4);
    bg.lineStyle(2, 0x4444aa, 1);
    bg.strokeRoundedRect(x, y, w, h, 4);
    this.menuContainer.add(bg);

    this.menuTextObjs = [];
    for (let i = 0; i < options.length; i++) {
      const col = options[i].disabled ? '#666666' : '#ffffff';
      const t = this.add.text(x + 18, y + 6 + i*20, options[i].label, {
        fontSize:'10px', fontFamily:'monospace', color:col
      });
      this.menuContainer.add(t);
      this.menuTextObjs.push(t);
    }

    this.menuCursorText = this.add.text(x + 6, y + 6, '>', {
      fontSize:'10px', fontFamily:'monospace', color:'#ffcc00'
    });
    this.menuContainer.add(this.menuCursorText);

    while (this.menuOptions[this.menuCursor] && this.menuOptions[this.menuCursor].disabled) {
      this.menuCursor++;
      if (this.menuCursor >= this.menuOptions.length) { this.menuCursor = 0; break; }
    }
    this.menuCursorText.y = y + 6 + this.menuCursor * 20;

    this.uiStack.push(this.handleMenuInput);
  }

  handleMenuInput() {
    if (Phaser.Input.Keyboard.JustDown(this.keys.up)) {
      let next = this.menuCursor - 1;
      while (next >= 0 && this.menuOptions[next].disabled) next--;
      if (next >= 0) this.menuCursor = next;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keys.down)) {
      let next = this.menuCursor + 1;
      while (next < this.menuOptions.length && this.menuOptions[next].disabled) next++;
      if (next < this.menuOptions.length) this.menuCursor = next;
    }

    const baseY = this.menuCursorText.y - this.menuCursor * 20 + this.menuCursor * 20;
    this.menuCursorText.y = (this.menuTextObjs[0] ? this.menuTextObjs[0].y : 6) + this.menuCursor * 20;

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      const sel = this.menuOptions[this.menuCursor];
      if (sel && !sel.disabled) {
        this.closeMenu();
        if (this.menuCallback) this.menuCallback(sel.value);
      }
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.x)) {
      this.closeMenu();
      if (this.menuCancelCallback) this.menuCancelCallback();
    }
  }

  closeMenu() {
    if (this.menuContainer) { this.menuContainer.destroy(); this.menuContainer = null; }
    this.uiStack.pop();
  }

  // ---- NPC INTERACTIONS ----

  interactNPC(npc) {
    // Remove icon after talking
    const spr = this.npcSprites[npc.id];
    if (spr) {
      if (npc.rid) {
        spr.setTexture('recruit_'+npc.rid+'_talked');
      } else {
        spr.setTexture('npc_'+npc.id+'_talked');
      }
    }

    if (npc.type === 'talk') {
      this.showDialogue(npc.dialog, null);
    } else if (npc.type === 'recruit') {
      this.showDialogue(npc.dialog, () => {
        this.showMenu(SW/2 - 80, SH/2 - 40,
          [{label:'Yes, join us!', value:'yes'}, {label:'Not now', value:'no'}],
          (val) => {
            if (val === 'yes') {
              recruit(npc.rid);
              this.showDialogue([npc.rid.charAt(0).toUpperCase()+npc.rid.slice(1)+' joined the force!'], () => {
                this.refreshNPCs();
              });
            }
          }, null);
      });
    } else if (npc.type === 'shop') {
      this.showDialogue(npc.dialog, () => { this.openShop(); });
    } else if (npc.type === 'church') {
      this.showDialogue(npc.dialog, () => { this.openChurch(); });
    } else if (npc.type === 'hq') {
      this.showDialogue(npc.dialog, () => { this.openHQ(); });
    }
  }

  // ---- SHOP ----

  openShop() {
    this.showMenu(10, 100,
      [{label:'Buy', value:'buy'}, {label:'Sell', value:'sell'}, {label:'Leave', value:'leave'}],
      (val) => {
        if (val === 'buy') this.shopBuy();
        else if (val === 'sell') this.shopSell();
      }, null);
  }

  shopBuy() {
    const weapons = getShopWeapons();
    const items = getShopItems();
    const all = [...weapons, ...items];
    const opts = all.map(id => {
      const it = ITEMS[id];
      const canAfford = GS.gold >= it.price;
      return { label: it.name + ' (' + it.price + 'g)', value: id, disabled: !canAfford };
    });
    opts.push({label:'Back', value:'back'});

    this.showMenu(10, 30, opts, (val) => {
      if (val === 'back') { this.openShop(); return; }
      const item = ITEMS[val];
      if (item.type === 'weapon') {
        this.shopEquipWeapon(val);
      } else {
        this.shopBuyConsumable(val);
      }
    }, () => { this.openShop(); });
  }

  shopEquipWeapon(weaponId) {
    const item = ITEMS[weaponId];
    const eligible = GS.activeIds.filter(id => {
      const ch = GS.allChars[id];
      const classWeapons = CLASS_WEAPONS[ch.baseClass] || [];
      return classWeapons.includes(item.wtype);
    });
    if (eligible.length === 0) {
      this.showDialogue(['No one in your party can use this weapon.'], () => { this.shopBuy(); });
      return;
    }
    const opts = eligible.map(id => {
      const ch = GS.allChars[id];
      const current = ch.weapon ? ITEMS[ch.weapon].name : 'None';
      return { label: ch.name + ' (has: ' + current + ')', value: id };
    });
    opts.push({label:'Cancel', value:'cancel'});
    this.showMenu(170, 50, opts, (val) => {
      if (val === 'cancel') { this.shopBuy(); return; }
      const ch = GS.allChars[val];
      let refund = 0;
      if (ch.weapon) {
        refund = Math.floor(ITEMS[ch.weapon].price / 2);
      }
      GS.gold -= item.price;
      GS.gold += refund;
      ch.weapon = weaponId;
      const msg = ch.name + ' equipped ' + item.name + '!';
      const refMsg = refund > 0 ? ' (Old weapon sold for ' + refund + 'g)' : '';
      this.showDialogue([msg + refMsg], () => { this.shopBuy(); });
    }, () => { this.shopBuy(); });
  }

  shopBuyConsumable(itemId) {
    const item = ITEMS[itemId];
    const eligible = GS.activeIds.filter(id => {
      const ch = GS.allChars[id];
      return ch.inventory.some(s => s === null);
    });
    if (eligible.length === 0) {
      this.showDialogue(['No one has room in their inventory.'], () => { this.shopBuy(); });
      return;
    }
    const opts = eligible.map(id => ({label:GS.allChars[id].name, value:id}));
    opts.push({label:'Cancel', value:'cancel'});
    this.showMenu(170, 50, opts, (val) => {
      if (val === 'cancel') { this.shopBuy(); return; }
      const ch = GS.allChars[val];
      const slot = ch.inventory.indexOf(null);
      if (slot !== -1) {
        ch.inventory[slot] = itemId;
        GS.gold -= item.price;
        this.showDialogue([ch.name + ' got ' + item.name + '!'], () => { this.shopBuy(); });
      }
    }, () => { this.shopBuy(); });
  }

  shopSell() {
    const opts = GS.activeIds.map(id => ({label:GS.allChars[id].name, value:id}));
    opts.push({label:'Back', value:'back'});
    this.showMenu(10, 50, opts, (val) => {
      if (val === 'back') { this.openShop(); return; }
      const ch = GS.allChars[val];
      const invOpts = [];
      for (let i = 0; i < MAX_INV; i++) {
        if (ch.inventory[i]) {
          const it = ITEMS[ch.inventory[i]];
          const price = Math.floor(it.price / 2);
          invOpts.push({label:it.name + ' (' + price + 'g)', value:i});
        }
      }
      if (invOpts.length === 0) {
        this.showDialogue([ch.name + ' has nothing to sell.'], () => { this.shopSell(); });
        return;
      }
      invOpts.push({label:'Cancel', value:'cancel'});
      this.showMenu(170, 50, invOpts, (idx) => {
        if (idx === 'cancel') { this.shopSell(); return; }
        const it = ITEMS[ch.inventory[idx]];
        const price = Math.floor(it.price / 2);
        GS.gold += price;
        ch.inventory[idx] = null;
        this.showDialogue(['Sold ' + it.name + ' for ' + price + 'g!'], () => { this.shopSell(); });
      }, () => { this.shopSell(); });
    }, () => { this.openShop(); });
  }

  // ---- CHURCH ----

  openChurch() {
    this.showMenu(10, 100,
      [{label:'Save Game', value:'save'}, {label:'Revive', value:'revive'}, {label:'Promote', value:'promote'}, {label:'Leave', value:'leave'}],
      (val) => {
        if (val === 'save') {
          saveGame();
          this.showDialogue(['Game saved!'], null);
        } else if (val === 'revive') {
          this.churchRevive();
        } else if (val === 'promote') {
          this.churchPromote();
        }
      }, null);
  }

  churchRevive() {
    const dead = GS.activeIds.filter(id => !GS.allChars[id].alive);
    if (dead.length === 0) {
      this.showDialogue(['All members are alive and well.'], () => { this.openChurch(); });
      return;
    }
    const opts = dead.map(id => {
      const ch = GS.allChars[id];
      const cost = ch.level * 10;
      return {label: ch.name + ' (' + cost + 'g)', value: id, disabled: GS.gold < cost};
    });
    opts.push({label:'Cancel', value:'cancel'});
    this.showMenu(10, 50, opts, (val) => {
      if (val === 'cancel') { this.openChurch(); return; }
      const ch = GS.allChars[val];
      const cost = ch.level * 10;
      GS.gold -= cost;
      ch.alive = true;
      ch.currentHp = ch.stats.hp;
      ch.currentMp = ch.stats.mp;
      this.showDialogue([ch.name + ' has been revived!'], () => { this.churchRevive(); });
    }, () => { this.openChurch(); });
  }

  churchPromote() {
    const eligible = GS.activeIds.filter(id => {
      const ch = GS.allChars[id];
      return ch.level >= PROMOTE_LV && !ch.promoted;
    });
    if (eligible.length === 0) {
      this.showDialogue(['No one is eligible for promotion.','(Need level 10+)'], () => { this.openChurch(); });
      return;
    }
    const opts = eligible.map(id => ({label:GS.allChars[id].name + ' Lv' + GS.allChars[id].level, value:id}));
    opts.push({label:'Cancel', value:'cancel'});
    this.showMenu(10, 50, opts, (val) => {
      if (val === 'cancel') { this.openChurch(); return; }
      const ch = GS.allChars[val];
      Combat.promote(ch);
      this.showDialogue([ch.name + ' promoted to ' + ch.cls + '!'], () => { this.churchPromote(); });
    }, () => { this.openChurch(); });
  }

  // ---- HQ ----

  openHQ() {
    this.showMenu(10, 100,
      [{label:'Add Member', value:'add'}, {label:'Remove Member', value:'remove'}, {label:'Leave', value:'leave'}],
      (val) => {
        if (val === 'add') this.hqAdd();
        else if (val === 'remove') this.hqRemove();
      }, null);
  }

  hqAdd() {
    if (GS.activeIds.length >= MAX_PARTY) {
      this.showDialogue(['Party is full! Remove someone first.'], () => { this.openHQ(); });
      return;
    }
    const reserves = GS.recruitedIds.filter(id => !GS.activeIds.includes(id));
    if (reserves.length === 0) {
      this.showDialogue(['No reserves available.'], () => { this.openHQ(); });
      return;
    }
    const opts = reserves.map(id => ({label:GS.allChars[id].name + ' (' + GS.allChars[id].cls + ')', value:id}));
    opts.push({label:'Cancel', value:'cancel'});
    this.showMenu(10, 50, opts, (val) => {
      if (val === 'cancel') { this.openHQ(); return; }
      GS.activeIds.push(val);
      this.showDialogue([GS.allChars[val].name + ' added to the force!'], () => { this.hqAdd(); });
    }, () => { this.openHQ(); });
  }

  hqRemove() {
    const removable = GS.activeIds.filter(id => id !== 'max');
    if (removable.length === 0) {
      this.showDialogue(['Cannot remove Max from the party.'], () => { this.openHQ(); });
      return;
    }
    const opts = removable.map(id => ({label:GS.allChars[id].name, value:id}));
    opts.push({label:'Cancel', value:'cancel'});
    this.showMenu(10, 50, opts, (val) => {
      if (val === 'cancel') { this.openHQ(); return; }
      GS.activeIds = GS.activeIds.filter(id => id !== val);
      this.showDialogue([GS.allChars[val].name + ' moved to reserves.'], () => { this.hqRemove(); });
    }, () => { this.openHQ(); });
  }

  // ---- MAIN MENU (ENTER) ----

  openMainMenu() {
    this.showMenu(SW/2 - 80, 40,
      [{label:'Status', value:'status'}, {label:'Save', value:'save'}, {label:'Cancel', value:'cancel'}],
      (val) => {
        if (val === 'status') this.showStatus();
        else if (val === 'save') {
          saveGame();
          this.showDialogue(['Game saved!'], null);
        }
      }, null);
  }

  showStatus() {
    const lines = [];
    for (const id of GS.activeIds) {
      const ch = GS.allChars[id];
      const wpn = ch.weapon ? ITEMS[ch.weapon].name : 'None';
      lines.push(ch.name + ' L' + ch.level + ' ' + ch.cls + ' HP' + ch.currentHp + '/' + ch.stats.hp +
        ' MP' + ch.currentMp + '/' + ch.stats.mp + ' A' + ch.stats.atk + ' D' + ch.stats.def);
    }
    lines.push('Gold: ' + GS.gold);
    this.showDialogue(lines, null);
  }
}


// ============================================================
// SECTION 10: BATTLE SCENE
// ============================================================

const BS = { INIT:0, TURN_START:1, MOVE:2, ACTION:3, TARGET:4, SPELL_SEL:5,
             ITEM_SEL:6, ANIMATING:7, LEVEL_UP:8, ENEMY:9, VICTORY:10, DEFEAT:11 };

class BattleScene extends Phaser.Scene {
  constructor() { super('battle'); }

  init(data) {
    this.battleId = data.battleId;
    this.battleData = BATTLES[this.battleId];
    this.state = BS.INIT;
    this.playerUnits = [];
    this.enemyUnits = [];
    this.allUnits = [];
    this.turnOrder = [];
    this.turnIndex = 0;
    this.currentUnit = null;
    this.cursorX = 0;
    this.cursorY = 0;
    this.moveRange = null;
    this.preMovePos = null;
    this.attackMode = null;
    this.selectedSpell = null;
    this.validTargets = [];
    this.targetIndex = 0;
    this.animating = false;
    this.pendingLevelUp = null;
    this.pendingCallback = null;
  }

  create() {
    const bd = this.battleData;
    this.mapCols = bd.cols;
    this.mapRows = bd.rows;
    this.mx = 0;
    this.my = 0;

    for (let y = 0; y < bd.rows; y++) {
      for (let x = 0; x < bd.cols; x++) {
        const tid = bd.tiles[y][x];
        this.add.image(this.mx + x*TILE + TILE/2, this.my + y*TILE + TILE/2, 'tile_'+tid);
      }
    }

    this.highlightGfx = this.add.graphics().setDepth(5);
    this.cursorGfx = this.add.graphics().setDepth(20);
    this.cursorBlink = 0;

    const activeChars = GS.activeIds.filter(id => GS.allChars[id] && GS.allChars[id].alive);
    for (let i = 0; i < activeChars.length && i < bd.spawns.length; i++) {
      const id = activeChars[i];
      const ch = GS.allChars[id];
      const sp = bd.spawns[i];
      const spr = this.add.image(this.mx + sp.x*TILE + TILE/2, this.my + sp.y*TILE + TILE/2, 'char_'+id).setDepth(10);
      const unit = {
        ...ch, gx:sp.x, gy:sp.y, sprite:spr, isEnemy:false, acted:false,
        textureKey:'char_'+id, charId:id,
      };
      this.playerUnits.push(unit);
    }

    let enemyCount = 0;
    for (const e of bd.enemies) {
      const tmpl = ENEMIES[e.t];
      const eid = 'enemy_' + enemyCount;
      const spr = this.add.image(this.mx + e.x*TILE + TILE/2, this.my + e.y*TILE + TILE/2, 'enemy_'+e.t).setDepth(10);
      const unit = {
        id:eid, name:tmpl.name, cls:'Enemy', baseClass:'Enemy',
        promoted:false, level:1, exp:0,
        stats:{hp:tmpl.hp,mp:tmpl.mp,atk:tmpl.atk,def:tmpl.def,agi:tmpl.agi,mov:tmpl.mov},
        currentHp:tmpl.hp, currentMp:tmpl.mp,
        growth:{hp:[0,0],mp:[0,0],atk:[0,0],def:[0,0],agi:[0,0]},
        spellSchedule:[], spells:[...(tmpl.spells||[])],
        weapon:null, inventory:[null,null,null,null],
        wtype:null, isFlying:false,
        alive:true, boostTurns:0, boostAmt:0,
        gx:e.x, gy:e.y, sprite:spr, isEnemy:true, acted:false,
        ai:tmpl.ai, expValue:tmpl.exp, goldValue:tmpl.gold,
        isBoss:tmpl.isBoss||false, templateId:e.t,
        textureKey:'enemy_'+e.t,
      };
      this.enemyUnits.push(unit);
      enemyCount++;
    }

    this.allUnits = [...this.playerUnits, ...this.enemyUnits];

    this.infoPanelBg = this.add.graphics().setDepth(50).setScrollFactor(0);
    this.infoPanelBg.fillStyle(0x000022, 0.9);
    this.infoPanelBg.fillRoundedRect(4, SH - 108, 180, 104, 4);
    this.infoPanelBg.lineStyle(2, 0x4444aa, 1);
    this.infoPanelBg.strokeRoundedRect(4, SH - 108, 180, 104, 4);

    this.infoText = this.add.text(10, SH - 104, '', {
      fontSize:'8px', fontFamily:'monospace', color:'#ffffff', lineSpacing:3
    }).setDepth(51).setScrollFactor(0);

    this.terrainText = this.add.text(10, SH - 12, '', {
      fontSize:'7px', fontFamily:'monospace', color:'#aaaaaa'
    }).setDepth(51).setScrollFactor(0);

    this.turnText = this.add.text(SW/2, 4, '', {
      fontSize:'9px', fontFamily:'monospace', color:'#ffcc00'
    }).setOrigin(0.5, 0).setDepth(51).setScrollFactor(0);

    this.msgText = this.add.text(SW/2, SH/2, '', {
      fontSize:'12px', fontFamily:'monospace', color:'#ffffff'
    }).setOrigin(0.5).setDepth(200).setVisible(false).setScrollFactor(0);

    this.menuContainer = null;
    this.menuOptions = [];
    this.menuCursor = 0;

    this.dialogContainer = null;
    this.dialogLines = [];
    this.dialogIndex = 0;
    this.dialogCallback = null;
    this.dialogActive = false;
    this.typewriterText = '';
    this.typewriterIndex = 0;
    this.typewriterDone = false;
    this.dialogTextObj = null;

    this.keys = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.UP,
      down: Phaser.Input.Keyboard.KeyCodes.DOWN,
      left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      z: Phaser.Input.Keyboard.KeyCodes.Z,
      x: Phaser.Input.Keyboard.KeyCodes.X,
    });

    this.state = BS.INIT;
    this.showBattleDialogue(bd.before, () => {
      this.buildTurnOrder();
      this.state = BS.TURN_START;
    });
  }

  update() {
    this.cursorBlink = (this.cursorBlink + 1) % 40;
    this.drawCursor();

    switch (this.state) {
      case BS.INIT: this.updateDialogue(); break;
      case BS.TURN_START: this.handleTurnStart(); break;
      case BS.MOVE: this.handleMove(); break;
      case BS.ACTION: this.handleAction(); break;
      case BS.TARGET: this.handleTarget(); break;
      case BS.SPELL_SEL: this.handleSpellSel(); break;
      case BS.ITEM_SEL: this.handleItemSel(); break;
      case BS.ANIMATING: break;
      case BS.LEVEL_UP: this.handleLevelUp(); break;
      case BS.ENEMY: break;
      case BS.VICTORY: this.updateDialogue(); break;
      case BS.DEFEAT: break;
    }

    this.updateInfoPanel();
  }

  // ---- CURSOR ----

  drawCursor() {
    this.cursorGfx.clear();
    if (this.state === BS.MOVE || this.state === BS.TARGET) {
      const alpha = this.cursorBlink < 20 ? 1 : 0.4;
      this.cursorGfx.lineStyle(2, 0xffff00, alpha);
      this.cursorGfx.strokeRect(
        this.mx + this.cursorX*TILE, this.my + this.cursorY*TILE, TILE, TILE
      );
    }
  }

  // ---- INFO PANEL ----

  updateInfoPanel() {
    const unitHere = this.allUnits.find(u => u.alive && u.gx === this.cursorX && u.gy === this.cursorY);
    if (unitHere) {
      const wpn = unitHere.weapon ? ITEMS[unitHere.weapon].name : '-';
      const hpPct = Math.floor(unitHere.currentHp / unitHere.stats.hp * 100);
      let info = unitHere.name + ' (' + (unitHere.cls || 'Enemy') + ') L' + (unitHere.level||1) + '\n';
      info += 'HP:' + unitHere.currentHp + '/' + unitHere.stats.hp + ' MP:' + unitHere.currentMp + '/' + unitHere.stats.mp + '\n';
      info += 'ATK:' + unitHere.stats.atk + ' DEF:' + unitHere.stats.def + '\n';
      info += 'AGI:' + unitHere.stats.agi + ' MOV:' + unitHere.stats.mov + '\n';
      info += 'W:' + wpn;
      this.infoText.setText(info);
    } else {
      this.infoText.setText('');
    }

    if (this.cursorX >= 0 && this.cursorY >= 0 && this.cursorX < this.mapCols && this.cursorY < this.mapRows) {
      const tid = this.battleData.tiles[this.cursorY][this.cursorX];
      const t = TILES[tid];
      this.terrainText.setText(t.name + (t.def > 0 ? ' (DEF+' + t.def + ')' : ''));
    }
  }

  // ---- TURN ORDER ----

  buildTurnOrder() {
    const alive = this.allUnits.filter(u => u.alive);
    alive.forEach(u => { u.acted = false; });
    this.turnOrder = alive.sort((a, b) => {
      const aa = a.stats.agi + randInt(0, 3);
      const ba = b.stats.agi + randInt(0, 3);
      return ba - aa;
    });
    this.turnIndex = 0;
  }

  handleTurnStart() {
    while (this.turnIndex < this.turnOrder.length) {
      const unit = this.turnOrder[this.turnIndex];
      if (unit.alive && !unit.acted) {
        this.currentUnit = unit;
        if (unit.boostTurns > 0) {
          unit.boostTurns--;
          if (unit.boostTurns <= 0) unit.boostAmt = 0;
        }

        if (unit.isEnemy) {
          this.state = BS.ANIMATING;
          this.turnText.setText(unit.name + "'s turn");
          this.time.delayedCall(500, () => { this.executeEnemyTurn(unit); });
        } else {
          this.turnText.setText(unit.name + "'s turn");
          this.cursorX = unit.gx;
          this.cursorY = unit.gy;
          this.state = BS.ANIMATING;
          this.showMessage(unit.name + "'s turn!", () => {
            this.startPlayerMove(unit);
          });
        }
        return;
      }
      this.turnIndex++;
    }
    this.buildTurnOrder();
  }

  showMessage(text, callback) {
    this.msgText.setText(text).setVisible(true);
    this.time.delayedCall(600, () => {
      this.msgText.setVisible(false);
      if (callback) callback();
    });
  }

  // ---- PLAYER MOVE STATE ----

  startPlayerMove(unit) {
    this.moveRange = getMovRange(
      this.battleData.tiles, this.mapCols, this.mapRows,
      unit.gx, unit.gy, unit.stats.mov, this.allUnits, unit, unit.isFlying||false
    );
    this.drawHighlights();
    this.cursorX = unit.gx;
    this.cursorY = unit.gy;
    this.state = BS.MOVE;
  }

  drawHighlights() {
    this.highlightGfx.clear();
    if (this.moveRange) {
      for (const [k] of this.moveRange) {
        const [x, y] = k.split(',').map(Number);
        this.highlightGfx.fillStyle(0x3355ff, 0.3);
        this.highlightGfx.fillRect(this.mx + x*TILE, this.my + y*TILE, TILE, TILE);
      }
    }
  }

  handleMove() {
    if (Phaser.Input.Keyboard.JustDown(this.keys.up)) this.cursorY = Math.max(0, this.cursorY - 1);
    if (Phaser.Input.Keyboard.JustDown(this.keys.down)) this.cursorY = Math.min(this.mapRows - 1, this.cursorY + 1);
    if (Phaser.Input.Keyboard.JustDown(this.keys.left)) this.cursorX = Math.max(0, this.cursorX - 1);
    if (Phaser.Input.Keyboard.JustDown(this.keys.right)) this.cursorX = Math.min(this.mapCols - 1, this.cursorX + 1);

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      const k = this.cursorX + ',' + this.cursorY;
      if (this.moveRange && this.moveRange.has(k)) {
        this.preMovePos = { x: this.currentUnit.gx, y: this.currentUnit.gy };
        this.highlightGfx.clear();
        this.moveUnitTo(this.currentUnit, this.cursorX, this.cursorY, () => {
          this.openActionMenu();
        });
      }
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.x)) {
      this.preMovePos = { x: this.currentUnit.gx, y: this.currentUnit.gy };
      this.highlightGfx.clear();
      this.openActionMenu();
    }
  }

  moveUnitTo(unit, tx, ty, callback) {
    this.state = BS.ANIMATING;
    const path = findPath(this.battleData.tiles, this.mapCols, this.mapRows, unit.gx, unit.gy, tx, ty, unit.isFlying||false);
    if (path.length === 0) {
      unit.gx = tx; unit.gy = ty;
      unit.sprite.x = this.mx + tx*TILE + TILE/2;
      unit.sprite.y = this.my + ty*TILE + TILE/2;
      if (callback) callback();
      return;
    }

    let stepIndex = 0;
    const stepNext = () => {
      if (stepIndex >= path.length) {
        unit.gx = tx; unit.gy = ty;
        if (callback) callback();
        return;
      }
      const step = path[stepIndex];
      stepIndex++;
      this.tweens.add({
        targets: unit.sprite,
        x: this.mx + step.x*TILE + TILE/2,
        y: this.my + step.y*TILE + TILE/2,
        duration: 80,
        onComplete: () => {
          unit.gx = step.x;
          unit.gy = step.y;
          stepNext();
        }
      });
    };
    stepNext();
  }

  // ---- ACTION MENU ----

  openActionMenu() {
    const unit = this.currentUnit;
    const opts = [];
    opts.push({ label: 'Attack', value: 'attack' });

    const hasSpells = unit.spells && unit.spells.length > 0 && unit.spells.some(sid => {
      const sp = SPELLS[sid];
      return sp && unit.currentMp >= sp.mp;
    });
    if (unit.spells && unit.spells.length > 0) {
      opts.push({ label: 'Magic', value: 'magic', disabled: !hasSpells });
    }

    const hasItems = unit.inventory && unit.inventory.some(it => it !== null);
    if (hasItems) {
      opts.push({ label: 'Item', value: 'item' });
    }

    opts.push({ label: 'Stay', value: 'stay' });

    this.showBattleMenu(opts, (val) => {
      if (val === 'attack') this.startTargeting('attack');
      else if (val === 'magic') this.openSpellSelect();
      else if (val === 'item') this.openItemSelect();
      else if (val === 'stay') this.unitDone();
    }, () => {
      if (this.preMovePos) {
        this.moveUnitTo(this.currentUnit, this.preMovePos.x, this.preMovePos.y, () => {
          this.preMovePos = null;
          this.startPlayerMove(this.currentUnit);
        });
      }
    });
    this.state = BS.ACTION;
  }

  showBattleMenu(options, onSelect, onCancel) {
    if (this.menuContainer) this.menuContainer.destroy();

    this.menuOptions = options;
    this.menuCursor = 0;
    this._menuOnSelect = onSelect;
    this._menuOnCancel = onCancel;

    const x = SW - 150;
    const y = SH - 108;
    const w = 140;
    const h = options.length * 20 + 12;
    this.menuContainer = this.add.container(0, 0).setDepth(110).setScrollFactor(0);
    const bg = this.add.graphics();
    bg.fillStyle(0x000033, 0.95);
    bg.fillRoundedRect(x, y, w, h, 4);
    bg.lineStyle(2, 0x4444aa, 1);
    bg.strokeRoundedRect(x, y, w, h, 4);
    this.menuContainer.add(bg);

    this.menuTextObjs = [];
    for (let i = 0; i < options.length; i++) {
      const col = options[i].disabled ? '#666666' : '#ffffff';
      const t = this.add.text(x + 18, y + 6 + i*20, options[i].label, {
        fontSize:'10px', fontFamily:'monospace', color:col
      });
      this.menuContainer.add(t);
      this.menuTextObjs.push(t);
    }

    this.menuCursorText = this.add.text(x + 6, y + 6, '>', {
      fontSize:'10px', fontFamily:'monospace', color:'#ffcc00'
    });
    this.menuContainer.add(this.menuCursorText);

    while (this.menuOptions[this.menuCursor] && this.menuOptions[this.menuCursor].disabled) {
      this.menuCursor++;
      if (this.menuCursor >= this.menuOptions.length) { this.menuCursor = 0; break; }
    }
  }

  handleAction() {
    if (!this.menuContainer) return;

    if (Phaser.Input.Keyboard.JustDown(this.keys.up)) {
      let next = this.menuCursor - 1;
      while (next >= 0 && this.menuOptions[next].disabled) next--;
      if (next >= 0) this.menuCursor = next;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keys.down)) {
      let next = this.menuCursor + 1;
      while (next < this.menuOptions.length && this.menuOptions[next].disabled) next++;
      if (next < this.menuOptions.length) this.menuCursor = next;
    }

    if (this.menuTextObjs[0]) {
      this.menuCursorText.y = this.menuTextObjs[0].y + this.menuCursor * 20;
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      const sel = this.menuOptions[this.menuCursor];
      if (sel && !sel.disabled) {
        const cb = this._menuOnSelect;
        this.closeBattleMenu();
        if (cb) cb(sel.value);
      }
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.x)) {
      const cb = this._menuOnCancel;
      this.closeBattleMenu();
      if (cb) cb();
    }
  }

  closeBattleMenu() {
    if (this.menuContainer) { this.menuContainer.destroy(); this.menuContainer = null; }
  }

  // ---- TARGETING ----

  startTargeting(mode) {
    this.attackMode = mode;
    const unit = this.currentUnit;
    this.validTargets = [];
    this.highlightGfx.clear();

    if (mode === 'attack') {
      const range = Combat.getAtkRange(unit);
      for (const enemy of this.allUnits) {
        if (enemy.alive && enemy.isEnemy !== unit.isEnemy) {
          if (manhattan(unit.gx, unit.gy, enemy.gx, enemy.gy) <= range) {
            this.validTargets.push(enemy);
          }
        }
      }
    } else if (mode === 'spell') {
      const spell = SPELLS[this.selectedSpell];
      if (spell.type === 'attack') {
        for (const enemy of this.allUnits) {
          if (enemy.alive && enemy.isEnemy !== unit.isEnemy) {
            if (manhattan(unit.gx, unit.gy, enemy.gx, enemy.gy) <= spell.range) {
              this.validTargets.push(enemy);
            }
          }
        }
      } else if (spell.type === 'heal') {
        if (spell.range === 0) {
          this.validTargets.push(unit);
        } else {
          for (const ally of this.allUnits) {
            if (ally.alive && ally.isEnemy === unit.isEnemy) {
              if (manhattan(unit.gx, unit.gy, ally.gx, ally.gy) <= spell.range) {
                this.validTargets.push(ally);
              }
            }
          }
        }
      } else if (spell.type === 'buff') {
        for (const ally of this.allUnits) {
          if (ally.alive && ally.isEnemy === unit.isEnemy) {
            if (manhattan(unit.gx, unit.gy, ally.gx, ally.gy) <= spell.range) {
              this.validTargets.push(ally);
            }
          }
        }
      } else if (spell.type === 'utility') {
        this.validTargets.push(unit);
      }
    }

    if (this.validTargets.length === 0) {
      this.showMessage('No valid targets!', () => {
        this.openActionMenu();
      });
      return;
    }

    this.targetIndex = 0;
    this.cursorX = this.validTargets[0].gx;
    this.cursorY = this.validTargets[0].gy;
    this.drawTargetHighlights();
    this.state = BS.TARGET;
  }

  drawTargetHighlights() {
    this.highlightGfx.clear();
    for (const t of this.validTargets) {
      const color = (this.attackMode === 'attack' || (this.attackMode === 'spell' && SPELLS[this.selectedSpell] && SPELLS[this.selectedSpell].type === 'attack')) ? 0xff3333 : 0x33ff33;
      this.highlightGfx.fillStyle(color, 0.3);
      this.highlightGfx.fillRect(this.mx + t.gx*TILE, this.my + t.gy*TILE, TILE, TILE);
    }

    if (this.attackMode === 'spell' && this.selectedSpell) {
      const spell = SPELLS[this.selectedSpell];
      if (spell.aoe > 0 && this.validTargets[this.targetIndex]) {
        const ct = this.validTargets[this.targetIndex];
        const aoeTiles = Combat.getAoETiles(ct.gx, ct.gy, spell.aoe);
        for (const at of aoeTiles) {
          if (at.x >= 0 && at.y >= 0 && at.x < this.mapCols && at.y < this.mapRows) {
            this.highlightGfx.fillStyle(0xffaa00, 0.2);
            this.highlightGfx.fillRect(this.mx + at.x*TILE, this.my + at.y*TILE, TILE, TILE);
          }
        }
      }
    }
  }

  handleTarget() {
    if (Phaser.Input.Keyboard.JustDown(this.keys.left) || Phaser.Input.Keyboard.JustDown(this.keys.up)) {
      this.targetIndex = (this.targetIndex - 1 + this.validTargets.length) % this.validTargets.length;
      this.cursorX = this.validTargets[this.targetIndex].gx;
      this.cursorY = this.validTargets[this.targetIndex].gy;
      this.drawTargetHighlights();
    }
    if (Phaser.Input.Keyboard.JustDown(this.keys.right) || Phaser.Input.Keyboard.JustDown(this.keys.down)) {
      this.targetIndex = (this.targetIndex + 1) % this.validTargets.length;
      this.cursorX = this.validTargets[this.targetIndex].gx;
      this.cursorY = this.validTargets[this.targetIndex].gy;
      this.drawTargetHighlights();
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      this.highlightGfx.clear();
      const target = this.validTargets[this.targetIndex];
      if (this.attackMode === 'attack') {
        this.executeAttack(this.currentUnit, target);
      } else if (this.attackMode === 'spell') {
        this.executeSpell(this.currentUnit, this.selectedSpell, target);
      }
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.x)) {
      this.highlightGfx.clear();
      this.openActionMenu();
    }
  }

  // ---- SPELL SELECT ----

  openSpellSelect() {
    const unit = this.currentUnit;
    const opts = unit.spells.map(sid => {
      const sp = SPELLS[sid];
      return { label: sp.name + ' (MP:' + sp.mp + ')', value: sid, disabled: unit.currentMp < sp.mp };
    });
    opts.push({ label: 'Cancel', value: 'cancel' });

    this.showBattleMenu(opts, (val) => {
      if (val === 'cancel') { this.openActionMenu(); return; }
      this.selectedSpell = val;
      const spell = SPELLS[val];
      if (spell.type === 'utility' && spell === SPELLS.egress) {
        unit.currentMp -= spell.mp;
        this.showMessage('Egress!', () => {
          this.scene.start('exploration');
        });
        return;
      }
      this.startTargeting('spell');
    }, () => { this.openActionMenu(); });
    this.state = BS.ACTION;
  }

  // ---- ITEM SELECT ----

  openItemSelect() {
    const unit = this.currentUnit;
    const opts = [];
    for (let i = 0; i < MAX_INV; i++) {
      if (unit.inventory[i]) {
        const it = ITEMS[unit.inventory[i]];
        opts.push({ label: it.name, value: i });
      }
    }
    opts.push({ label: 'Cancel', value: 'cancel' });

    this.showBattleMenu(opts, (val) => {
      if (val === 'cancel') { this.openActionMenu(); return; }
      const itemId = unit.inventory[val];
      const item = ITEMS[itemId];
      if (item.effect === 'heal') {
        unit.currentHp = Math.min(unit.stats.hp, unit.currentHp + item.value);
        unit.inventory[val] = null;
        this.showMessage(unit.name + ' healed ' + item.value + ' HP!', () => {
          this.unitDone();
        });
      } else if (item.effect === 'egress') {
        unit.inventory[val] = null;
        this.showMessage('Retreat!', () => {
          this.scene.start('exploration');
        });
      }
    }, () => { this.openActionMenu(); });
    this.state = BS.ACTION;
  }


  // ---- EXECUTE ATTACK ----

  executeAttack(attacker, defender) {
    this.state = BS.ANIMATING;
    const result = Combat.calcDamage(attacker, defender);

    const overlay = this.add.container(0, 0).setDepth(1000).setScrollFactor(0);
    const bg = this.add.graphics();
    bg.fillStyle(0x000000, 0.85);
    bg.fillRect(0, 0, SW, SH);
    overlay.add(bg);

    const atkKey = attacker.isEnemy ? 'eportrait_' + attacker.templateId : 'portrait_' + attacker.charId;
    const defKey = defender.isEnemy ? 'eportrait_' + defender.templateId : 'portrait_' + defender.charId;

    let atkPortrait = null;
    let defPortrait = null;
    try { atkPortrait = this.add.image(120, SH/2, atkKey); overlay.add(atkPortrait); } catch(e) {}
    try { defPortrait = this.add.image(360, SH/2, defKey); overlay.add(defPortrait); } catch(e) {}

    if (!atkPortrait) {
      atkPortrait = this.add.rectangle(120, SH/2, 64, 96, attacker.isEnemy ? 0x882222 : 0x222288);
      overlay.add(atkPortrait);
    }
    if (!defPortrait) {
      defPortrait = this.add.rectangle(360, SH/2, 64, 96, defender.isEnemy ? 0x882222 : 0x222288);
      overlay.add(defPortrait);
    }

    const atkName = this.add.text(120, SH/2 + 58, attacker.name, {
      fontSize:'10px', fontFamily:'monospace', color:'#ffffff'
    }).setOrigin(0.5);
    overlay.add(atkName);

    const defName = this.add.text(360, SH/2 + 58, defender.name, {
      fontSize:'10px', fontFamily:'monospace', color:'#ffffff'
    }).setOrigin(0.5);
    overlay.add(defName);

    const atkLabel = this.add.text(120, SH/2 - 58, 'ATK: ' + (attacker.stats.atk + Combat.getWeaponAtk(attacker)), {
      fontSize:'8px', fontFamily:'monospace', color:'#aaaaaa'
    }).setOrigin(0.5);
    overlay.add(atkLabel);

    const defLabel = this.add.text(360, SH/2 - 58, 'DEF: ' + defender.stats.def, {
      fontSize:'8px', fontFamily:'monospace', color:'#aaaaaa'
    }).setOrigin(0.5);
    overlay.add(defLabel);

    const vsText = this.add.text(SW/2, SH/2 - 10, 'VS', {
      fontSize:'18px', fontFamily:'serif', color:'#ffcc00', fontStyle:'bold'
    }).setOrigin(0.5);
    overlay.add(vsText);

    this.tweens.add({
      targets: atkPortrait,
      x: atkPortrait.x + 40,
      duration: 200,
      yoyo: true,
      onComplete: () => {
        let dmgText;
        if (result.miss) {
          dmgText = this.add.text(360, SH/2 - 30, 'MISS!', {
            fontSize:'14px', fontFamily:'monospace', color:'#aaaaff', fontStyle:'bold'
          }).setOrigin(0.5);
        } else {
          dmgText = this.add.text(360, SH/2 - 30, '-' + result.damage, {
            fontSize:'16px', fontFamily:'monospace', color:'#ff4444', fontStyle:'bold'
          }).setOrigin(0.5);
        }
        overlay.add(dmgText);

        this.tweens.add({
          targets: dmgText,
          y: dmgText.y - 30,
          alpha: 0,
          duration: 800,
        });

        if (result.crit) {
          const critText = this.add.text(SW/2, SH/2 + 14, 'CRITICAL!', {
            fontSize:'12px', fontFamily:'monospace', color:'#ffaa00', fontStyle:'bold'
          }).setOrigin(0.5);
          overlay.add(critText);
        }

        if (!result.miss) {
          this.tweens.add({
            targets: defPortrait,
            alpha: 0.3,
            duration: 100,
            yoyo: true,
            repeat: 2,
          });
        }

        defender.currentHp -= result.damage;
        if (defender.currentHp <= 0) {
          defender.currentHp = 0;
          defender.alive = false;
          this.tweens.add({
            targets: defPortrait,
            alpha: 0,
            duration: 500,
            delay: 300,
          });
        }

        this.time.delayedCall(1500, () => {
          overlay.destroy();

          if (!defender.alive) {
            defender.sprite.setVisible(false);
          }

          let expGain = 0;
          if (!attacker.isEnemy) {
            if (!defender.alive) {
              expGain = (defender.expValue || 10) + 10;
            } else if (!result.miss) {
              expGain = 5;
            } else {
              expGain = 1;
            }
          }

          if (expGain > 0) {
            const lvResult = Combat.gainExp(attacker, expGain);
            if (lvResult) {
              this.pendingLevelUp = { unit: attacker, gains: lvResult.gains, newSpells: lvResult.newSpells };
              this.showMessage(attacker.name + ' gained ' + expGain + ' EXP!', () => {
                this.state = BS.LEVEL_UP;
              });
              return;
            }
            this.showMessage(attacker.name + ' gained ' + expGain + ' EXP!', () => {
              this.afterCombatAction(attacker);
            });
          } else {
            this.afterCombatAction(attacker);
          }
        });
      }
    });
  }

  // ---- EXECUTE SPELL ----

  executeSpell(caster, spellId, target) {
    this.state = BS.ANIMATING;
    const spell = SPELLS[spellId];
    caster.currentMp -= spell.mp;

    const aoeTiles = Combat.getAoETiles(target.gx, target.gy, spell.aoe);
    const affected = [];
    for (const at of aoeTiles) {
      const hit = this.allUnits.find(u => u.alive && u.gx === at.x && u.gy === at.y);
      if (hit) {
        if (spell.type === 'attack' && hit.isEnemy !== caster.isEnemy) affected.push(hit);
        else if (spell.type === 'heal' && hit.isEnemy === caster.isEnemy) affected.push(hit);
        else if (spell.type === 'buff' && hit.isEnemy === caster.isEnemy) affected.push(hit);
      }
    }

    if (affected.length === 0 && spell.type === 'heal' && spell.range === 0) {
      affected.push(caster);
    }

    const overlay = this.add.container(0, 0).setDepth(1000).setScrollFactor(0);
    const bg = this.add.graphics();
    bg.fillStyle(0x000000, 0.85);
    bg.fillRect(0, 0, SW, SH);
    overlay.add(bg);

    const spellName = this.add.text(SW/2, 30, spell.name, {
      fontSize:'16px', fontFamily:'serif', color:'#ffcc00', fontStyle:'bold'
    }).setOrigin(0.5);
    overlay.add(spellName);

    const casterName = this.add.text(SW/2, 55, caster.name + ' casts ' + spell.name + '!', {
      fontSize:'10px', fontFamily:'monospace', color:'#ffffff'
    }).setOrigin(0.5);
    overlay.add(casterName);

    const spellGfx = this.add.graphics();
    overlay.add(spellGfx);

    if (spell.type === 'attack') {
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const radius = 40;
        const px = SW/2 + Math.cos(angle) * radius;
        const py = SH/2 + Math.sin(angle) * radius;
        const color = spellId.includes('blaze') ? 0xff4400 : 0x4488ff;
        spellGfx.fillStyle(color, 0.8);
        spellGfx.fillCircle(px, py, 5);
      }
    } else if (spell.type === 'heal') {
      spellGfx.fillStyle(0x44ff44, 0.5);
      for (let i = 0; i < 8; i++) {
        const px = SW/2 + randInt(-50, 50);
        const py = SH/2 + randInt(-30, 30);
        spellGfx.fillCircle(px, py, 4);
      }
    } else if (spell.type === 'buff') {
      spellGfx.fillStyle(0xffaa00, 0.5);
      for (let i = 0; i < 6; i++) {
        const px = SW/2 + randInt(-40, 40);
        const py = SH/2 + randInt(-30, 30);
        spellGfx.fillTriangle(px, py-7, px-5, py+4, px+5, py+4);
      }
    }

    let totalExpGain = 0;
    const results = [];
    for (const a of affected) {
      if (spell.type === 'attack') {
        const dmg = Combat.calcSpellDmg(caster, spell);
        a.currentHp -= dmg;
        results.push({ unit: a, value: -dmg });
        if (a.currentHp <= 0) {
          a.currentHp = 0;
          a.alive = false;
          if (!caster.isEnemy) totalExpGain += (a.expValue || 10) + 10;
        } else {
          if (!caster.isEnemy) totalExpGain += 5;
        }
      } else if (spell.type === 'heal') {
        const heal = Combat.calcHeal(caster, spell);
        const before = a.currentHp;
        a.currentHp = Math.min(a.stats.hp, a.currentHp + heal);
        results.push({ unit: a, value: a.currentHp - before });
        if (!caster.isEnemy) totalExpGain += 5;
      } else if (spell.type === 'buff') {
        a.boostAmt = spell.pow;
        a.boostTurns = 3;
        results.push({ unit: a, value: spell.pow, buff: true });
        if (!caster.isEnemy) totalExpGain += 5;
      }
    }

    let resultStr = '';
    for (const r of results) {
      if (r.buff) {
        resultStr += r.unit.name + ' ATK +' + r.value + '  ';
      } else if (r.value < 0) {
        resultStr += r.unit.name + ' ' + r.value + ' HP  ';
      } else {
        resultStr += r.unit.name + ' +' + r.value + ' HP  ';
      }
    }
    const resultText = this.add.text(SW/2, SH/2 + 60, resultStr, {
      fontSize:'9px', fontFamily:'monospace', color:'#ffffff', wordWrap:{width:SW-40}
    }).setOrigin(0.5);
    overlay.add(resultText);

    this.time.delayedCall(1800, () => {
      overlay.destroy();

      for (const a of affected) {
        if (!a.alive) a.sprite.setVisible(false);
      }

      if (totalExpGain > 0 && !caster.isEnemy) {
        const lvResult = Combat.gainExp(caster, totalExpGain);
        if (lvResult) {
          this.pendingLevelUp = { unit: caster, gains: lvResult.gains, newSpells: lvResult.newSpells };
          this.showMessage(caster.name + ' gained ' + totalExpGain + ' EXP!', () => {
            this.state = BS.LEVEL_UP;
          });
          return;
        }
        this.showMessage(caster.name + ' gained ' + totalExpGain + ' EXP!', () => {
          this.afterCombatAction(caster);
        });
      } else {
        this.afterCombatAction(caster);
      }
    });
  }

  // ---- LEVEL UP ----

  handleLevelUp() {
    if (!this.pendingLevelUp) { this.state = BS.TURN_START; return; }
    if (!this._levelUpShown) {
      this._levelUpShown = true;
      const lu = this.pendingLevelUp;
      const g = lu.gains;
      let txt = lu.unit.name + ' LEVEL UP! (Lv ' + lu.unit.level + ')\n';
      txt += 'HP +' + g.hp + '  MP +' + g.mp + '  ATK +' + g.atk + '\n';
      txt += 'DEF +' + g.def + '  AGI +' + g.agi;
      if (lu.newSpells && lu.newSpells.length > 0) {
        txt += '\nLearned: ' + lu.newSpells.map(s => SPELLS[s].name).join(', ');
      }

      if (this._levelUpOverlay) this._levelUpOverlay.destroy();
      this._levelUpOverlay = this.add.container(0, 0).setDepth(200).setScrollFactor(0);
      const bg = this.add.graphics();
      bg.fillStyle(0x000033, 0.9);
      bg.fillRoundedRect(SW/2 - 130, SH/2 - 45, 260, 90, 6);
      bg.lineStyle(2, 0xffcc00, 1);
      bg.strokeRoundedRect(SW/2 - 130, SH/2 - 45, 260, 90, 6);
      this._levelUpOverlay.add(bg);
      const t = this.add.text(SW/2, SH/2, txt, {
        fontSize:'9px', fontFamily:'monospace', color:'#ffffff', align:'center', lineSpacing:4
      }).setOrigin(0.5);
      this._levelUpOverlay.add(t);
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      if (this._levelUpOverlay) this._levelUpOverlay.destroy();
      this._levelUpShown = false;
      const unit = this.pendingLevelUp.unit;
      this.pendingLevelUp = null;
      this.afterCombatAction(unit);
    }
  }

  // ---- AFTER COMBAT ACTION ----

  afterCombatAction(unit) {
    if (this.checkVictory()) return;
    if (this.checkDefeat()) return;
    this.unitDone();
  }

  unitDone() {
    if (this.currentUnit) {
      this.currentUnit.acted = true;
      if (!this.currentUnit.isEnemy) {
        this.currentUnit.sprite.setAlpha(0.5);
      }
    }
    this.turnIndex++;
    this.highlightGfx.clear();
    this.state = BS.TURN_START;
  }

  // ---- VICTORY / DEFEAT ----

  checkVictory() {
    const enemiesAlive = this.enemyUnits.filter(u => u.alive);
    const bossAlive = this.enemyUnits.filter(u => u.alive && u.isBoss);
    const hasBoss = this.enemyUnits.some(u => u.isBoss);

    if (enemiesAlive.length === 0 || (hasBoss && bossAlive.length === 0)) {
      this.state = BS.VICTORY;
      GS.gold += this.battleData.gold;

      for (const pu of this.playerUnits) {
        const ch = GS.allChars[pu.charId];
        if (ch) {
          ch.currentHp = pu.currentHp;
          ch.currentMp = pu.currentMp;
          ch.exp = pu.exp;
          ch.level = pu.level;
          ch.stats = { ...pu.stats };
          ch.spells = [...(pu.spells || [])];
          ch.weapon = pu.weapon;
          ch.inventory = [...(pu.inventory || [null,null,null,null])];
          ch.boostTurns = pu.boostTurns || 0;
          ch.boostAmt = pu.boostAmt || 0;
        }
      }

      for (const id of GS.activeIds) {
        const ch = GS.allChars[id];
        if (ch && !ch.alive) {
          ch.alive = true;
          ch.currentHp = 1;
        }
      }

      GS.battlesCompleted.push(this.battleId);

      this.time.delayedCall(500, () => {
        const afterLines = [...this.battleData.after];
        afterLines.push('Gained ' + this.battleData.gold + ' gold!');
        this.showBattleDialogue(afterLines, () => {
          if (this.battleId === 'battle3') {
            this.scene.start('title');
          } else {
            this.scene.start('exploration');
          }
        });
      });
      return true;
    }
    return false;
  }

  checkDefeat() {
    const max = this.playerUnits.find(u => u.charId === 'max');
    if (max && !max.alive) {
      this.state = BS.DEFEAT;

      for (const pu of this.playerUnits) {
        const ch = GS.allChars[pu.charId];
        if (ch) {
          ch.currentHp = pu.currentHp;
          ch.currentMp = pu.currentMp;
          ch.exp = pu.exp;
          ch.level = pu.level;
          ch.stats = { ...pu.stats };
          ch.spells = [...(pu.spells || [])];
        }
      }

      this.time.delayedCall(1000, () => {
        this.scene.start('gameover');
      });
      return true;
    }
    return false;
  }

  // ---- ENEMY AI TURN ----

  executeEnemyTurn(unit) {
    const decision = aiDecide(unit, this.allUnits, this.battleData);

    if (decision.moveTo.x === unit.gx && decision.moveTo.y === unit.gy) {
      this.executeEnemyAction(unit, decision);
      return;
    }

    this.moveUnitTo(unit, decision.moveTo.x, decision.moveTo.y, () => {
      this.executeEnemyAction(unit, decision);
    });
  }

  executeEnemyAction(unit, decision) {
    if (decision.action === 'attack' && decision.target) {
      this.executeAttack(unit, decision.target);
    } else if (decision.action === 'spell' && decision.target && decision.spell) {
      this.executeSpell(unit, decision.spell, decision.target);
    } else {
      this.unitDone();
    }
  }

  // ---- BATTLE DIALOGUE ----

  showBattleDialogue(lines, callback) {
    this.dialogLines = lines;
    this.dialogIndex = 0;
    this.dialogCallback = callback;
    this.dialogActive = true;
    this.typewriterDone = false;
    this.typewriterIndex = 0;
    this.typewriterText = lines[0];

    if (this.dialogContainer) this.dialogContainer.destroy();
    this.dialogContainer = this.add.container(0, 0).setDepth(500).setScrollFactor(0);
    const bg = this.add.graphics();
    bg.fillStyle(0x000033, 0.9);
    bg.fillRoundedRect(8, SH - 58, SW - 16, 52, 6);
    bg.lineStyle(2, 0x4444aa, 1);
    bg.strokeRoundedRect(8, SH - 58, SW - 16, 52, 6);
    this.dialogContainer.add(bg);

    this.dialogTextObj = this.add.text(16, SH - 54, '', {
      fontSize:'10px', fontFamily:'monospace', color:'#ffffff', wordWrap:{width:SW-40}
    });
    this.dialogContainer.add(this.dialogTextObj);
  }

  updateDialogue() {
    if (!this.dialogActive) return;

    if (!this.typewriterDone) {
      this.typewriterIndex += 2;
      if (this.typewriterIndex >= this.typewriterText.length) {
        this.typewriterIndex = this.typewriterText.length;
        this.typewriterDone = true;
      }
      if (this.dialogTextObj) {
        this.dialogTextObj.setText(this.typewriterText.substring(0, this.typewriterIndex));
      }
      if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
        this.typewriterIndex = this.typewriterText.length;
        this.typewriterDone = true;
        if (this.dialogTextObj) this.dialogTextObj.setText(this.typewriterText);
      }
      return;
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.z)) {
      this.dialogIndex++;
      if (this.dialogIndex < this.dialogLines.length) {
        this.typewriterText = this.dialogLines[this.dialogIndex];
        this.typewriterIndex = 0;
        this.typewriterDone = false;
      } else {
        this.dialogActive = false;
        if (this.dialogContainer) { this.dialogContainer.destroy(); this.dialogContainer = null; }
        if (this.dialogCallback) {
          const cb = this.dialogCallback;
          this.dialogCallback = null;
          cb();
        }
      }
    }
  }
}

// ============================================================
// SECTION 11: GAME OVER SCENE
// ============================================================

class GameOverScene extends Phaser.Scene {
  constructor() { super('gameover'); }

  create() {
    this.cameras.main.setBackgroundColor('#000000');

    this.add.text(SW/2, SH/2 - 60, 'GAME OVER', {
      fontSize:'28px', fontFamily:'serif', color:'#cc2222', fontStyle:'bold'
    }).setOrigin(0.5);

    this.add.text(SW/2, SH/2 - 20, 'Max has fallen...', {
      fontSize:'12px', fontFamily:'serif', color:'#aaaaaa'
    }).setOrigin(0.5);

    this.menuItems = [];
    this.hasSave = !!localStorage.getItem('sfSave');
    if (this.hasSave) this.menuItems.push('Continue');
    this.menuItems.push('New Game');

    this.menuTexts = [];
    for (let i = 0; i < this.menuItems.length; i++) {
      const t = this.add.text(SW/2, SH/2 + 30 + i*28, this.menuItems[i], {
        fontSize:'16px', fontFamily:'serif', color:'#ffffff'
      }).setOrigin(0.5);
      this.menuTexts.push(t);
    }

    this.cursor = 0;
    this.cursorText = this.add.text(SW/2 - 70, SH/2 + 30, '>', {
      fontSize:'16px', fontFamily:'serif', color:'#ffcc00'
    }).setOrigin(0.5);

    this.keys = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.UP,
      down: Phaser.Input.Keyboard.KeyCodes.DOWN,
      z: Phaser.Input.Keyboard.KeyCodes.Z,
      enter: Phaser.Input.Keyboard.KeyCodes.ENTER,
    });
  }

  update() {
    if (Phaser.Input.Keyboard.JustDown(this.keys.up)) {
      this.cursor = (this.cursor - 1 + this.menuItems.length) % this.menuItems.length;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keys.down)) {
      this.cursor = (this.cursor + 1) % this.menuItems.length;
    }
    this.cursorText.y = SH/2 + 30 + this.cursor * 28;

    if (Phaser.Input.Keyboard.JustDown(this.keys.z) || Phaser.Input.Keyboard.JustDown(this.keys.enter)) {
      const sel = this.menuItems[this.cursor];
      if (sel === 'Continue') {
        loadGame();
        this.scene.start('exploration');
      } else if (sel === 'New Game') {
        initNewGame();
        this.scene.start('exploration');
      }
    }
  }
}

  type: Phaser.AUTO,
  parent: 'game-container',
  width: SW,
  height: SH,
  backgroundColor: '#000000',
  pixelArt: true,

const game = new Phaser.Game(config);

// Strip Phaser's inline canvas sizing so CSS controls display dimensions
game.events.on('ready', () => {
  game.canvas.style.width = '';
  game.canvas.style.height = '';
});

// Virtual Controller - dispatches keyboard events from on-screen buttons
(function setupVirtualControls() {
  const buttons = {
    'btn-up':    { keyCode: 38, key: 'ArrowUp',    code: 'ArrowUp' },
    'btn-down':  { keyCode: 40, key: 'ArrowDown',  code: 'ArrowDown' },
    'btn-left':  { keyCode: 37, key: 'ArrowLeft',  code: 'ArrowLeft' },
    'btn-right': { keyCode: 39, key: 'ArrowRight', code: 'ArrowRight' },
    'btn-a':     { keyCode: 90, key: 'z',          code: 'KeyZ' },
    'btn-b':     { keyCode: 88, key: 'x',          code: 'KeyX' },
    'btn-menu':  { keyCode: 13, key: 'Enter',      code: 'Enter' },
  };

  function fireKey(type, info) {
    const e = new KeyboardEvent(type, {
      bubbles: true, cancelable: true,
      key: info.key, code: info.code,
    });
    Object.defineProperty(e, 'keyCode', { value: info.keyCode });
    Object.defineProperty(e, 'which', { value: info.keyCode });
    window.dispatchEvent(e);
  }

  const isDpad = id => ['btn-up','btn-down','btn-left','btn-right'].includes(id);

  for (const [id, info] of Object.entries(buttons)) {
    const el = document.getElementById(id);
    if (!el) continue;

    let repeatTimeout = null;
    let repeatInterval = null;
    let pressed = false;

    function startPress(e) {
      e.preventDefault();
      e.stopPropagation();
      if (pressed) return;
      pressed = true;
      fireKey('keydown', info);
      if (isDpad(id)) {
        repeatTimeout = setTimeout(() => {
          repeatInterval = setInterval(() => {
            fireKey('keyup', info);
            fireKey('keydown', info);
          }, 120);
        }, 350);
      }
    }

    function endPress(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (!pressed) return;
      pressed = false;
      fireKey('keyup', info);
      if (repeatTimeout) { clearTimeout(repeatTimeout); repeatTimeout = null; }
      if (repeatInterval) { clearInterval(repeatInterval); repeatInterval = null; }
    }

    el.addEventListener('pointerdown', startPress, { passive: false });
    el.addEventListener('pointerup', endPress, { passive: false });
    el.addEventListener('pointercancel', endPress, { passive: false });
    el.addEventListener('pointerleave', endPress, { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());
  }

  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
})();
